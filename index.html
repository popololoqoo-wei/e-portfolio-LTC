function doLogout(){
  // 【v1.5.5】登出前先 flush 任何 pending 的自動儲存到雲端，
  // 否則接下來 removeItem('form_drafts') 會把學生剛填的資料直接洗掉，
  // 老師端永遠看不到。
  try{
    if(typeof flushAllPendingAutoSaves === 'function'){
      flushAllPendingAutoSaves();
    }
  }catch(e){console.warn('logout flush failed:', e);}

  // 【安全】登出時清掉所有可能含他人帳號資料的 localStorage
  // 這樣下一位使用同一台電腦的人無法從 F12 看到上一位的草稿、密碼等
  try{
    // app_config(含所有人密碼)— 學生不會有,但為了保險清掉
    localStorage.removeItem('app_config');
    // 表單草稿 — 不要把上一位學生的草稿留給下一位
    localStorage.removeItem('form_drafts');
    // 歷史紀錄
    localStorage.removeItem('history_logs');
    // 註冊頻率限制紀錄(避免影響下一位)— 保留(這是防濫用機制,不該被輕易清除)
    // 失敗計次紀錄 — 保留
  }catch(e){}

  APP.currentRole=null;APP.currentUser=null;APP.teacherUnlocked=false;APP.examUnlocked=false;APP.currentFormId=null;
  // 也清除記憶體中的表單資料
  APP.formData = {};
  APP.historyLog = {};
  // 注意:APP.students / APP.teachers / APP.adminPwd 等仍保留(下次登入時 autoLoadConfig 會重抓)

  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('app-screen').classList.remove('active');
}
async function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  // ★ 切到 app-screen 後 topbar 才真正可見,此時量測高度才正確
  //   (登入畫面時 topbar 是 display:none,offsetHeight=0)
  if(typeof setTopbarHeightVar==='function') setTopbarHeightVar();
  const u=APP.currentUser;
  const roleLabel={student:'學生',teacher:'臨床老師',admin:'管理員'}[APP.currentRole];
  const roleClass={student:'chip-s',teacher:'chip-t',admin:'chip-a'}[APP.currentRole];
  document.getElementById('topbar-user').textContent=u.name;
  const rc=document.getElementById('topbar-role');
  rc.textContent=roleLabel;rc.className='role-chip '+roleClass;
  const homeBtn=document.getElementById('btn-home');
  if(homeBtn) homeBtn.style.display=(APP.currentRole==='teacher'||APP.currentRole==='admin')?'inline-block':'none';

  // ★★★ 跨裝置同步：清空本地殘留，從 GAS 重新載入 ★★★
  APP.formData = {};
  APP.historyLog = {};
  // ★ 一次性清理:把 localStorage 與記憶體裡所有「裸 id」條目掃乾淨,
  //   避免歷史殘留污染當前學生的表單(例如「學生簽名」帶到別人的名字)。
  try{ if(typeof purgeBareIdContamination==='function') purgeBareIdContamination(); }catch(e){}

  // 【資安修補 v18.1 + 簽名清單修補】所有角色登入後，皆從後端載入帳號清單
  // 學生需要老師姓名清單，才能在表單中選擇老師簽名（下拉選單）。
  // 後端應自行依角色決定回傳內容：學生僅取得老師姓名（無密碼/雜湊）。
  // 若後端對學生角色拒絕回傳，前端容錯不擋登入流程。
  try{
    await loadAccountsFromBackend();
  }catch(e){
    console.warn('載入帳號清單失敗:', e);
    // 學生角色：靜默失敗（不影響使用，僅老師下拉可能為空）
    // 管理員/老師角色：仍顯示警告
    if(APP.currentRole==='admin' || APP.currentRole==='teacher'){
      toast('⚠ 帳號清單載入失敗：' + (e.message||e), false);
    }
  }

  // 【簽名清單修補】若老師清單仍為空（例如後端對學生不回 teachers），
  // 重新呼叫 autoLoadConfig 從公開 config 拿姓名清單，
  // 確保表單中的「老師簽名」下拉選單有選項可選。
  if(!APP.teachers || Object.keys(APP.teachers).length === 0){
    try{
      await autoLoadConfig();
      console.log('[fallback] 已從 config 補載老師清單，共 ' +
        Object.keys(APP.teachers||{}).length + ' 位');
    }catch(e){
      console.warn('補載 config 失敗:', e);
    }
  }

  // 顯示載入提示
  var mc0 = document.getElementById('main-content');
  if(mc0){
    mc0.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--ink3);">'+
      '<div style="font-size:32px;margin-bottom:10px;">☁</div>'+
      '<div style="font-size:14px;font-weight:600;">正在從雲端同步資料...</div>'+
      '<div style="font-size:12px;margin-top:6px;color:var(--ink3);">確保所有裝置看到相同內容</div>'+
      '</div>';
  }

  // 學生 / 已選擇學生的老師才需要拉表單
  if(APP.currentRole==='student' || (APP.currentRole==='teacher' && APP.currentStudentId)){
    try{
      await loadAllFormsFromSheets();
    }catch(e){
      console.warn('批次載入失敗，改用本機備份:', e);
      try{
        var drafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
        // ★ 只接受帶學號的 formKey;裸 id 一律忽略,避免污染
        Object.keys(drafts).forEach(function(fkey){
          if(fkey.indexOf('_')<0) return;
          if(!APP.formData[fkey])APP.formData[fkey]={};
          Object.assign(APP.formData[fkey],drafts[fkey]);
        });
        var hlogs=JSON.parse(localStorage.getItem('history_logs')||'{}');
        Object.keys(hlogs).forEach(function(fkey){
          if(fkey.indexOf('_')<0) return;
          APP.historyLog[fkey]=hlogs[fkey];
        });
      }catch(e2){}
    }
  } else {
    // 管理員、未選學生的老師：照原本載入草稿
    try{
      var drafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
      // ★ 只接受帶學號的 formKey
      Object.keys(drafts).forEach(function(fkey){
        if(fkey.indexOf('_')<0) return;
        if(!APP.formData[fkey])APP.formData[fkey]={};
        Object.assign(APP.formData[fkey],drafts[fkey]);
      });
    }catch(e){}
  }
  // ★ 登入後執行一次性 migration：把裸 id 的殘留資料整理到 canonical formKey
  setTimeout(function(){
    try{ migrateBareKeysToFormKey(); }catch(e){console.warn('migration failed:',e);}
    // 【安全】把明文密碼轉換為雜湊（背景執行，不阻塞 UI）
    try{ migratePlaintextSecrets(); }catch(e){console.warn('hash migration failed:',e);}
    // 【安全】啟動閒置自動登出
    bumpActivity();
    startSessionWatchdog();
    renderSidebar(); // 更新狀態圖示
  }, 100);
  renderSidebar();
  // 顯示快捷導覽列（非管理員）
  var qnav=document.getElementById('quick-nav');
  if(qnav) qnav.style.display=(APP.currentRole!=='admin')?'flex':'none';
  updateQuickNav();
  if(APP.currentRole==='admin'){renderAdmin();}
  else if(APP.currentRole==='teacher'){renderTeacherHome();}
  else{renderFormList(); setTimeout(showUnfilledNotification, 800);}
}

/* ─── 前端內建正解與解析（與 EXAM_QUESTIONS 索引對應） ───
   原設計把答案存後端 (GAS) 是為防止學生透過 F12 偷看；
   但實務上若無 GAS 後端，使用者送出後測卻看不到正解與解析，
   失去學習意義。改為「前端 fallback」：
   - 若 GAS 後端可用且回傳 review，優先使用後端版本（仍維持 GAS 防作弊機制）。
   - 若後端不可用或無回傳 review，則使用此前端版本，至少可顯示正解與解析給學生對照。
   ※ 題目來源：台灣考選部「呼吸治療師」歷屆高考公開試題與標準答案。

const EXAM_ANSWERS = [
];

/* 取得後測題目正解（給前端 fallback 計分使用） */
function _examGetCorrectAnswer(origIdx){
  if(typeof origIdx!=='number' || origIdx<0 || origIdx>=EXAM_ANSWERS.length) return '';
  return (EXAM_ANSWERS[origIdx].answer||'').toUpperCase();
}
/* 取得後測題目解析 */
function _examGetExplanation(origIdx){
  if(typeof origIdx!=='number' || origIdx<0 || origIdx>=EXAM_ANSWERS.length) return '';
  return EXAM_ANSWERS[origIdx].explanation||'';
}
/* 前端 fallback 計分（後端不可用時使用） */
function _examGradeLocally(mode, order, answers){
  var total = EXAM_QUESTIONS.length;
  var perQ = EXAM_PER_QUESTION_SCORE;
  var correctCnt = 0;
  var wrongList = [];
  var review = {}; // origIdx -> {answer, explanation}
  for(var qi=0; qi<total; qi++){
    var origIdx = order[qi];
    var userAns = String(answers['q'+(qi+1)]||'').toUpperCase();
    var correct = _examGetCorrectAnswer(origIdx);
    if(userAns && userAns===correct){
      correctCnt++;
    } else {
      wrongList.push(qi+1);
    }
    if(mode==='post'){
      review[origIdx] = {
        answer: correct,
        explanation: _examGetExplanation(origIdx)
      };
    }
  }
  return {
    score: correctCnt * perQ,
    correctCnt: correctCnt,
    total: total,
    wrongList: wrongList,
    review: mode==='post' ? review : null
  };
}

const EXAM_QUESTION_CATEGORY = [
  /* 題目補齊後，依序填入每題的範疇 key，長度需等於 EXAM_QUESTIONS.length */
];
/* ─── 依範疇統計答對/答錯 ───
   參數：
     order       : 該卷題序（display index → original index）
     wrongSet    : { 畫面題號(1-based): true } 答錯的題（未作答可不在內，由 isAnsweredFn 判定）
     isAnsweredFn: function(畫面題號) → 是否已作答（未作答視為錯）
   回傳：依正確率由低到高排序的陣列（只含有出現在本卷的範疇）
         [{key,name,advice,course,total,correct,wrong,unanswered,rate}] */
function _examCategoryRows(order, wrongSet, isAnsweredFn){
  if(!Array.isArray(order) || typeof EXAM_CATEGORIES==='undefined') return [];
  var stat = {};
  EXAM_CATEGORIES.forEach(function(c){ stat[c.key]={total:0,correct:0,wrong:0,unanswered:0}; });
  for(var disp=0; disp<order.length; disp++){
    var origIdx = order[disp];
    var catKey  = EXAM_QUESTION_CATEGORY[origIdx];
    var s = stat[catKey];
    if(!s) continue;
    var qNum = disp+1;
    s.total++;
    var answered = isAnsweredFn ? !!isAnsweredFn(qNum) : true;
    if(!answered){ s.unanswered++; s.wrong++; }
    else if(wrongSet && wrongSet[qNum]){ s.wrong++; }
    else { s.correct++; }
  }
  var rows = EXAM_CATEGORIES.map(function(c){
    var s = stat[c.key];
    var rate = s.total>0 ? Math.round(s.correct/s.total*100) : 0;
    return { key:c.key, name:c.name, advice:c.advice, course:c.course,
             total:s.total, correct:s.correct, wrong:s.wrong,
             unanswered:s.unanswered, rate:rate };
  }).filter(function(r){ return r.total>0; });
  // 正確率低者排前（最該加強）；同分時錯題多者在前
  rows.sort(function(a,b){ return (a.rate-b.rate) || (b.wrong-a.wrong); });
  return rows;
}

/* ─── 從「已儲存的表單資料物件」還原方向統計（給前後測對照、班級彙整用） ───
   d 需為某份 F-PRE / F-POST 的 formData；未送出回傳 null。 */
function _examRowsFromFormData(d){
  if(!d || !(d.submitted==='true' || d.submitted===true)) return null;
  var n = (typeof EXAM_QUESTIONS!=='undefined') ? EXAM_QUESTIONS.length : 25;
  var order=[];
  var raw=d.order;
  if(typeof raw==='string' && raw){ try{ raw=JSON.parse(raw); }catch(e){ raw=null; } }
  if(Array.isArray(raw) && raw.length===n){
    var seen={}, ok=true;
    for(var i=0;i<raw.length;i++){ var v=raw[i]; if(typeof v!=='number'||v<0||v>=n||seen[v]){ ok=false; break; } seen[v]=true; }
    if(ok) order=raw.slice();
  }
  if(!order.length){ for(var j=0;j<n;j++) order.push(j); }
  var wrongSet={};
  var w=d.wrong_list;
  if(typeof w==='string' && w){ try{ w=JSON.parse(w); }catch(e){ w=[]; } }
  if(Array.isArray(w)) w.forEach(function(x){ wrongSet[x]=true; });
  return _examCategoryRows(order, wrongSet, function(q){ return !!(d['q'+q]||''); });
}

/* 課後測驗計分（前端直接計算，不需呼叫後端） */
function _courseTestCalcScore(fid){
  var bank = getCourseTestBank(fid);
  if(!bank) return null;
  var d = APP.formData[fid] || {};
  var qs = bank.questions;
  var correct = 0, wrongList = [], answered = 0;
  for(var i=0; i<qs.length; i++){
    var qNum = i + 1;
    var u = String(d['q'+qNum]||'').toUpperCase();

    if(u === corr){

    }
  }
  return {
    score: correct * COURSE_TEST_PER_QUESTION_SCORE,
    correctCnt: correct,
    wrongList: wrongList,
    answered: answered,
    total: qs.length
  };
}

/* 把可能已帶學號的 id 還原成 baseId，避免 getFormKey 重複加學號 */
function _stripSidFromId(id){
  if(!id || typeof id!=='string') return id;
  if(id.indexOf('_')<0) return id;
  var sids = [];
  if(APP.currentUser && APP.currentUser.sid) sids.push(APP.currentUser.sid);
  if(APP.currentStudentId) sids.push(APP.currentStudentId);
  if(APP.students){ Object.keys(APP.students).forEach(function(s){ sids.push(s); }); }
  for(var i=0;i<sids.length;i++){
    var suffix = '_' + sids[i];
    if(id.length > suffix.length && id.slice(-suffix.length) === suffix){
      return id.slice(0, id.length - suffix.length);
    }
  }
  return id;
}

/* ═══════════ 「已刪除欄位」追蹤機制 ═══════════
 * 問題:當使用者「再點清除」某欄位後,本機已刪掉該欄位,但雲端可能還保留舊值。
 *      下次「同步」或「跨裝置開啟」時,從雲端拉回的資料會把已刪除的欄位「復活」。
 * 解法:在本機 localStorage 維護一份「最近 24 小時內被刪除的 formKey + key」清單,
 *      loadFormFromSheets 從雲端拉資料後,根據此清單過濾掉這些 key。
 *      超過 24 小時的記錄會自動過期清除。
 *
 * 注意:當使用者主動把該欄位重新填寫時,要記得從清單裡移除,否則下次同步又會被清掉。 */
function _getRecentlyDeleted(){
  try{
    var raw = localStorage.getItem('recently_deleted_fields') || '{}';
    var obj = JSON.parse(raw);
    // 清掉超過 24 小時的過期項目
    var now = Date.now();
    var changed = false;
    Object.keys(obj).forEach(function(formKey){
      var byKey = obj[formKey] || {};
      Object.keys(byKey).forEach(function(k){
        var ts = byKey[k];
        if(typeof ts!=='number' || now - ts > 24*3600*1000){
          delete byKey[k]; changed = true;
        }
      });
      if(Object.keys(byKey).length===0){ delete obj[formKey]; changed = true; }
    });
    if(changed){
      try{ localStorage.setItem('recently_deleted_fields', JSON.stringify(obj)); }catch(e){}
    }
    return obj;
  }catch(e){ return {}; }
}
function markFieldDeleted(formKey, key){
  if(!formKey || !key) return;
  try{
    var obj = _getRecentlyDeleted();
    if(!obj[formKey]) obj[formKey] = {};
    obj[formKey][key] = Date.now();
    localStorage.setItem('recently_deleted_fields', JSON.stringify(obj));
  }catch(e){}
}
function unmarkFieldDeleted(formKey, key){
  // 使用者主動重新填寫,要從「已刪除清單」移除
  if(!formKey || !key) return;
  try{
    var obj = _getRecentlyDeleted();
    if(obj[formKey] && obj[formKey][key]){
      delete obj[formKey][key];
      if(Object.keys(obj[formKey]).length===0) delete obj[formKey];
      localStorage.setItem('recently_deleted_fields', JSON.stringify(obj));
    }
  }catch(e){}
}
function getDeletedKeysFor(formKey){
  // 回傳該 formKey 「已刪除」的 key 陣列
  var obj = _getRecentlyDeleted();
  if(!obj[formKey]) return [];
  return Object.keys(obj[formKey]);
}

/* ── 一次性 migration：把所有「裸 id」key 的資料搬到對應的「formKey」key ──
   避免後續 getStatus / openForm 在多個 key 之間來回 merge 造成不穩定
*/
function migrateBareKeysToFormKey(){
  if(!APP.formData) return;
  // 確認有目標學號可搬
  var sid=null;
  if(APP.currentRole==='student' && APP.currentUser && APP.currentUser.sid) sid=APP.currentUser.sid;
  else if(APP.currentStudentId) sid=APP.currentStudentId;
  if(!sid) return;
  // 蒐集所有 FORMS 的裸 id
  var formIds=(typeof FORMS!=='undefined'&&FORMS)?FORMS.map(function(f){return f.id;}):[];
  formIds.forEach(function(fid){
    var bare=APP.formData[fid];
    if(!bare || Object.keys(bare).length===0) return;
    var formKey=fid+'_'+sid;
    if(!APP.formData[formKey]) APP.formData[formKey]={};
    // ★ 改用「非空值補空」:formKey 已有的有效值優先保留,絕不被裸 id 覆蓋。
    //   理由:裸 id 是「跨學生共用」的危險空間,內容可能來自上一位被檢視的學生,
    //   若強行覆蓋當前學生 formKey,會導致跨學生污染(例如把別人的簽名套到當前學生)。
    Object.keys(bare).forEach(function(k){
      var v=bare[k];
      if(v==='' || v===null || v===undefined) return;
      var tv=APP.formData[formKey][k];
      if(tv===''||tv===null||tv===undefined||tv===false){
        APP.formData[formKey][k]=v;
      }
      // 兩邊都有值 → 保留 formKey 已有值(不覆蓋)
    });
    // 搬完後刪除裸 id 版本
    delete APP.formData[fid];
  });
  // historyLog 也一併搬移
  if(APP.historyLog){
    formIds.forEach(function(fid){
      var bare=APP.historyLog[fid];
      if(!bare || bare.length===0) return;
      var formKey=fid+'_'+sid;
      if(!APP.historyLog[formKey]) APP.historyLog[formKey]=[];
      bare.forEach(function(entry){
        var exists=APP.historyLog[formKey].some(function(e){return e.ts===entry.ts;});
        if(!exists) APP.historyLog[formKey].push(entry);
      });
      APP.historyLog[formKey].sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
      delete APP.historyLog[fid];
    });
  }
  // localStorage 草稿也搬
  try{
    var drafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    var changed=false;
    formIds.forEach(function(fid){
      if(!drafts[fid] || Object.keys(drafts[fid]).length===0) return;
      var formKey=fid+'_'+sid;
      if(!drafts[formKey]) drafts[formKey]={};
      Object.keys(drafts[fid]).forEach(function(k){
        var v=drafts[fid][k];
        if(v==='' || v===null || v===undefined) return;
        drafts[formKey][k]=v;
      });
      delete drafts[fid];
      changed=true;
    });
    if(changed) localStorage.setItem('form_drafts',JSON.stringify(drafts));
  }catch(e){}
  // localStorage history 也搬
  try{
    var hLogs=JSON.parse(localStorage.getItem('history_logs')||'{}');
    var hChanged=false;
    formIds.forEach(function(fid){
      if(!hLogs[fid] || hLogs[fid].length===0) return;
      var formKey=fid+'_'+sid;
      if(!hLogs[formKey]) hLogs[formKey]=[];
      hLogs[fid].forEach(function(entry){
        var exists=hLogs[formKey].some(function(e){return e.ts===entry.ts;});
        if(!exists) hLogs[formKey].push(entry);
      });
      delete hLogs[fid];
      hChanged=true;
    });
    if(hChanged) localStorage.setItem('history_logs',JSON.stringify(hLogs));
  }catch(e){}
}

function writeField(fid, key, val){

/* ════════════════════════════════════════════════
   自動儲存機制（Auto-Save）
   每次資料變動 → 等待 20 秒（debounce）→ 自動觸發儲存
   進入儲存前 10 秒切換為倒數提示 + 顏色閃爍，作為視覺緩衝
   ════════════════════════════════════════════════ */
const AUTO_SAVE_DEBOUNCE_MS = 8000;             // 停止輸入 8 秒後自動存（v1.5.5：原 20 秒過長，老師端常看不到學生草稿）
const AUTO_SAVE_COUNTDOWN_MS = 4000;            // 儲存前 4 秒進入倒數提示
let _autoSaveTimers = {};            // 每張表單獨立計時器
let _autoSaveCountdownTimers = {};   // 每張表單的倒數提示計時器
let _autoSaveCountdownInterval = null; // 全域倒數刷新 interval
let _autoSaveCountdownEnd = 0;       // 預定觸發儲存的絕對時間（ms）
let _autoSaveInFlight = {};          // 避免重複觸發

function scheduleAutoSave(bareId){
  // 必須有登入身分才自動儲存
  if(!APP.currentRole || !APP.currentUser) return;
  // 學生：只能自動儲存自己的表單
  if(APP.currentRole==='student' && !APP.currentUser.sid) return;
  // 老師：必須選定學生
  if(APP.currentRole==='teacher' && !APP.currentStudentId) return;
  // 管理員：跳過自動儲存（管理員多半在管理帳號，不該觸發表單儲存）
  if(APP.currentRole==='admin') return;

  // 取消舊計時器，重設 debounce
  if(_autoSaveTimers[bareId]) clearTimeout(_autoSaveTimers[bareId]);
  if(_autoSaveCountdownTimers[bareId]) clearTimeout(_autoSaveCountdownTimers[bareId]);
  if(_autoSaveCountdownInterval){ clearInterval(_autoSaveCountdownInterval); _autoSaveCountdownInterval=null; }

  // 顯示「未儲存」指示
  showAutoSaveIndicator('pending');

  // 主計時器：20 秒後觸發儲存
  _autoSaveTimers[bareId] = setTimeout(function(){
    runAutoSave(bareId);
  }, AUTO_SAVE_DEBOUNCE_MS);

  // 倒數提示計時器：在儲存前 10 秒切換為倒數狀態
  _autoSaveCountdownEnd = Date.now() + AUTO_SAVE_DEBOUNCE_MS;
  _autoSaveCountdownTimers[bareId] = setTimeout(function(){
    // 進入倒數狀態時，立即顯示完整剩餘秒數，避免第一秒沒有數字
    var initialRemain = Math.max(0, Math.ceil((_autoSaveCountdownEnd - Date.now())/1000));
    showAutoSaveIndicator('countdown', initialRemain);
    // 每秒刷新倒數秒數，產生「即將儲存」的視覺緩衝
    _autoSaveCountdownInterval = setInterval(function(){
      var remain = Math.max(0, Math.ceil((_autoSaveCountdownEnd - Date.now())/1000));
      showAutoSaveIndicator('countdown', remain);
      if(remain <= 0){
        clearInterval(_autoSaveCountdownInterval);
        _autoSaveCountdownInterval = null;
      }
    }, 1000);
  }, AUTO_SAVE_DEBOUNCE_MS - AUTO_SAVE_COUNTDOWN_MS);
}

function runAutoSave(bareId){
  if(_autoSaveInFlight[bareId]) return;
  _autoSaveInFlight[bareId] = true;
  // 停止倒數刷新
  if(_autoSaveCountdownInterval){ clearInterval(_autoSaveCountdownInterval); _autoSaveCountdownInterval=null; }
  showAutoSaveIndicator('saving');
  try{
    // 直接呼叫 saveForm，與「按儲存按鈕」效果完全相同
    // 這會建立 historyLog 紀錄，讓狀態判定能正確運作
    // ★ silent=true:autoSave 是背景觸發,不該跳「老師必填未完成」對話框
    //   (那個對話框只在使用者主動按「儲存表單」按鈕時跳)
    if(typeof saveForm === 'function'){
      saveForm(bareId, true);
      showAutoSaveIndicator('saved');
    }
  }catch(e){
    console.warn('autoSave failed:', e);
    showAutoSaveIndicator('error');
  }finally{
    setTimeout(function(){ _autoSaveInFlight[bareId] = false; }, 1000);
  }
}

/* ──────────────────────────────────────────────────────────────
 * 【v1.5.5】離開前 flush 機制
 * 問題：學生填一填直接關分頁/登出，原 20 秒 debounce 還沒到就走人，
 *      雲端沒收到資料，老師端登入看到的就是空白。
 * 解法：
 *   1. flushAllPendingAutoSaves()：把所有 _autoSaveTimers 立即執行
 *   2. beforeunload / pagehide / visibilitychange 三個事件都掛
 *      （桌機靠 beforeunload，手機 Safari 必須靠 pagehide / visibilitychange）
 *   3. doLogout 也呼叫此函式（在 removeItem('form_drafts') 之前）
 * ──────────────────────────────────────────────────────────────── */
function flushAllPendingAutoSaves(){
  try{
    var pendingIds = Object.keys(_autoSaveTimers||{});
    if(pendingIds.length===0) return false;
    pendingIds.forEach(function(bareId){
      try{
        clearTimeout(_autoSaveTimers[bareId]);
        delete _autoSaveTimers[bareId];
        if(_autoSaveCountdownTimers[bareId]){
          clearTimeout(_autoSaveCountdownTimers[bareId]);
          delete _autoSaveCountdownTimers[bareId];
        }
        // 同步呼叫 saveForm(silent=true)，內部會走 saveFormToSheets 推上 GAS
        if(typeof saveForm === 'function') saveForm(bareId, true);
      }catch(e){console.warn('flushAllPendingAutoSaves item failed:', bareId, e);}
    });
    if(_autoSaveCountdownInterval){
      clearInterval(_autoSaveCountdownInterval);
      _autoSaveCountdownInterval=null;
    }
    return true;
  }catch(e){
    console.warn('flushAllPendingAutoSaves failed:', e);
    return false;
  }
}

/* ── 掛載一次性的全域離開監聽 ── */
(function attachUnloadFlushHandlers(){
  if(window.__unloadFlushAttached) return;
  window.__unloadFlushAttached = true;

  // 桌機：關分頁、重新整理、關瀏覽器
  window.addEventListener('beforeunload', function(ev){
    var hasPending = Object.keys(_autoSaveTimers||{}).length > 0;
    if(hasPending){
      // 先 flush（fetch 在 unload 期間用 sendBeacon 更可靠，但目前 saveFormToSheets 用 fetch，
      // 大多瀏覽器仍會送出 — 我們再加一道防線：顯示原生「離開確認」對話框）
      flushAllPendingAutoSaves();
      // 標準離開確認（現代瀏覽器多半只顯示通用訊息，但仍能阻止使用者意外關掉）
      ev.preventDefault();
      ev.returnValue = '尚有未儲存的草稿正在上傳，確定要離開嗎？';
      return ev.returnValue;
    }
  });

  // 手機 / 切到背景 / iOS Safari（beforeunload 在 iOS 不可靠）
  window.addEventListener('pagehide', function(){
    flushAllPendingAutoSaves();
  });

  // 切分頁、最小化、手機切 app：當頁面變不可見時也 flush 一次
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden'){
      flushAllPendingAutoSaves();
    }
  });
})();

/* ── 自動儲存狀態指示器（右下角小提示） ── */
function showAutoSaveIndicator(state, countdownSec){
  let el = document.getElementById('auto-save-indicator');
  if(!el){
    el = document.createElement('div');
    el.id = 'auto-save-indicator';
    el.style.cssText = 'position:fixed;bottom:1.2rem;left:1.2rem;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;z-index:9998;transition:background .25s,color .25s,border-color .25s,opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(15,23,42,.12);opacity:0;';
    document.body.appendChild(el);
  }
  // 注入閃爍動畫樣式（只注入一次）
  if(!document.getElementById('auto-save-indicator-style')){
    var st = document.createElement('style');
    st.id = 'auto-save-indicator-style';
    st.textContent = '@keyframes autoSaveFlash{0%,100%{box-shadow:0 2px 8px rgba(15,23,42,.12),0 0 0 0 rgba(245,158,11,.55);}50%{box-shadow:0 2px 12px rgba(245,158,11,.45),0 0 0 6px rgba(245,158,11,0);}}';
    document.head.appendChild(st);
  }
  var cdSec = (typeof countdownSec==='number') ? countdownSec : null;
  const conf = {
    pending:   { txt:'✏️ 編輯中…20 秒後自動儲存', bg:'#FEF3C7', color:'#78350F', border:'#F59E0B', flash:false },
    countdown: { txt:'⏳ 即將自動儲存…' + (cdSec!==null?(' '+cdSec+' 秒'):''), bg:'#FFEDD5', color:'#9A3412', border:'#F97316', flash:true },
    saving:    { txt:'⏳ 自動儲存中…',           bg:'#DBEAFE', color:'#1E40AF', border:'#2563EB', flash:false },
    saved:     { txt:'☁ 已自動儲存',             bg:'#D1FAE5', color:'#065F46', border:'#059669', flash:false },
    error:     { txt:'⚠ 自動儲存失敗',           bg:'#FEE2E2', color:'#991B1B', border:'#DC2626', flash:false }
  }[state] || null;
  if(!conf){ el.style.opacity='0'; el.style.animation=''; return; }
  el.textContent = conf.txt;
  el.style.background = conf.bg;
  el.style.color = conf.color;
  el.style.border = '1px solid '+conf.border;
  el.style.opacity = '1';
  // 倒數狀態才啟用閃爍動畫，其他狀態移除
  el.style.animation = conf.flash ? 'autoSaveFlash 1s ease-in-out infinite' : '';
  // 「已儲存」狀態 3 秒後自動淡出
  if(state === 'saved' || state === 'error'){
    setTimeout(function(){
      if(el.textContent === conf.txt){ el.style.opacity = '0'; el.style.animation=''; }
    }, 3000);
  }
}

  return TEACHER_PREFIX_FIELDS.some(function(p){ return key.indexOf(p)===0; });

function getStatus(id){
  // ★ 老師端尚未選定學生 → 沒有「當前學生」的真實資料可看,一律回 'new'
  //   避免被任何裸 id 殘留誤判成 done/draft,造成頂部數字錯亂、
  //   或顯示出別位學生的表單。
  if(APP.currentRole==='teacher' && !APP.currentStudentId) return 'new';

  const formKey=getFormKey(id);

  // ★ 讀取資料：以 formKey 為主，但仍向下相容讀取裸 id（避免 migration 還沒跑時誤判）
  // 用「非空值優先」合併，避免空字串覆蓋有效值
  function mergeReadOnly(dest, src){
    if(!src) return;
    Object.keys(src).forEach(function(k){
      var v=src[k];
      if(v===''||v===null||v===undefined||v===false) return;
      if(dest[k]===''||dest[k]===null||dest[k]===undefined||dest[k]===false){
        dest[k]=v;
      }
    });
  }
  const d={};
  // 1) 先填 formKey 的值（最新最權威）
  mergeReadOnly(d, APP.formData[formKey]||{});
  // 2) 再從草稿補空缺
  try{
    var allDrafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    mergeReadOnly(d, allDrafts[formKey]||{});
    // 向下相容：若還有裸 id 殘留草稿，補空缺
    if(formKey!==id) mergeReadOnly(d, allDrafts[id]||{});
  }catch(e){}
  // 3) 向下相容：若 APP.formData[id] 還有殘留（migration 失敗時的安全網），補空缺
  if(formKey!==id) mergeReadOnly(d, APP.formData[id]||{});

  // historyLog：以 formKey 為主，向下相容讀裸 id
  var allLogs=[];
  var logSeen={};
  function pushLogs(arr){
    if(!arr) return;
    arr.forEach(function(l){
      if(!logSeen[l.ts]){logSeen[l.ts]=true;allLogs.push(l);}
    });
  }
  pushLogs(APP.historyLog[formKey]);
  if(formKey!==id) pushLogs(APP.historyLog[id]);
  try{
    var savedLogs=JSON.parse(localStorage.getItem('history_logs')||'{}');
    pushLogs(savedLogs[formKey]);
    if(formKey!==id) pushLogs(savedLogs[id]);
  }catch(e){}
  const hasRecord=allLogs.length>0;
  function hasRealVal(v){
    if(v===undefined||v===null||v===false) return false;
    var s = String(v).trim();
    if(s==='') return false;
    // ★ 空 JSON 陣列 / 物件視為「沒填」
    //   例如 F04 的 rt_ind / vent_type checkbox 取消勾選後會留下 "[]",
    //   不該被誤判為「有實質資料」造成表單變成「草稿中」狀態。
    if(s==='[]' || s==='{}' || s==='null') return false;
    return true;
  }

  // 輔助：checkField 驗證單一必填欄位
  function checkField(k){
    // ── 虛擬必填項：複合條件 ──
    // __prof_any：F08/F09 「參加職類」17 個 prof_* 任一個 truthy 即算填
    if(k==='__prof_any'){
      return Object.keys(d).some(function(kk){
        return kk.indexOf('prof_')===0 && d[kk]===true;
      });
    }
    // __team_first：F08 「跨團隊照護」第一組 team_type_1 + team_care_1 都要填
    if(k==='__team_first'){
      return hasRealVal(d['team_type_1']) && hasRealVal(d['team_care_1']);
    }
    // __sc_any：EPA 「臨床情境」JSON array (e0X_sc) 至少一項
    if(k==='__sc_any'){
      var raw=d['e01_sc']||d['e02_sc']||d['e03_sc']||'';
      if(!raw) return false;
      try{
        var arr=JSON.parse(raw);
        return Array.isArray(arr) && arr.length>0;
      }catch(e){
        return false;
      }
    }
    var v=d[k];
    if(!hasRealVal(v)) return false;
    if(k==='s_date'){
      var sv=String(v).trim();
      if(sv.indexOf(' - ')>=0){
        var pts=sv.split(' - ');
        return pts.length===2&&pts[0].trim().length>=8&&pts[1].trim().length>=8;
      }
      return sv.length>=8;
    }
    if(k==='t_sign'||k==='s_sign'||k==='t_sign2'||k==='host_sign'){
      var sv2=String(v).trim();
      return sv2!==''
        &&sv2!=='請選擇學生'&&sv2!=='請選擇老師'
        &&sv2!=='請選擇臨床老師'&&sv2!=='請選擇實習總指導教師'
        &&sv2!=='請選擇指導老師'&&sv2!=='請選擇主持人';
    }
    if(k==='t_sign_date'||k==='s_sign_date'||k==='t_sign2_date'||k==='host_sign_date'||k==='host_date'||k==='follow_date'){
      return String(v).trim().length>=8;
    }
    // F04 呼吸問題確立、呼吸器機型 等 JSON array：parse 後至少一項
    if(k==='rt_ind'||k==='vent_type'){
      try{
        var arr2=JSON.parse(String(v));
        return Array.isArray(arr2) && arr2.length>0;
      }catch(e){
        return false;
      }
    }
    return true;
  }

  // ── 層級1：未填 ── 完全沒有實質資料
  // 「自動帶入」欄位不算實質資料：
  // - intern_cat 是預設值
  // - s_name / s_sign / school 在學生登入時自動帶入，本身不代表使用者「有填寫」
  // - order 是筆試前/後測的題序（後測為洗牌結果），表單一渲染就會寫入草稿以維持
  //   「重新進入時題序穩定」，但這只是系統內部狀態,不代表使用者實際開始作答,
  //   故必須排除,否則「只是點進去察看」就會被誤判為「草稿中」。
  const SKIP_KEYS=['intern_cat','s_name','s_sign','school','s_date','order'];
  const hasAnyData=Object.keys(d).some(function(k){
    return SKIP_KEYS.indexOf(k)<0 && hasRealVal(d[k]);
  });
  if(!hasAnyData) return 'new';

  // ── 層級2：有資料但無儲存紀錄 → 'draft'（草稿中，提醒使用者尚未儲存） ──
  if(!hasRecord) return 'draft';

  // ── F04 床邊教學：特殊必填清單 ──
  if(id==='F04M'||id==='F04S'){
    var f04Req=['s_name','school','bed','pt_name',
      'diagnosis','medical_focus','rt_plan','t_fb','t_sign','t_sign_date','s_sign'];
    if(f04Req.every(function(k){return checkField(k);})) return 'done';
    return 'draft';
  }

  // ── F10A/F10B 輔導記錄：學生欄位 + 老師欄位都要齊全才算完成 ──
  if(id==='F10A'||id==='F10B'){
    // F10 的日期欄位 key 是 'date'，不是 's_date'
    // 基本資料 + 老師查核 8 項 + 老師備註 + 老師簽名 + 老師簽名日期 + 學生回答 5 題
    var f10Req=['s_name','intern_cat','date','school',
                'q_basic','q_self','q_progress','q_detail','q_t_sign','q_feeling','q_t_fb','q_all_sign',
                't_note','t_sign','t_sign_date',
                's_q2','s_q3','s_q4','s_q5','s_q6'];
    var f10Ok=f10Req.every(function(k){
      if(k==='date'||k==='t_sign_date'){return String(d[k]||'').trim().length>=8;}
      return checkField(k);
    });
    if(f10Ok) return 'done';
    return 'draft';
  }

  // ── 筆試前測 / 後測：以 submitted 標記為 done ──
  if(id==='F-PRE'||id==='F-POST'){
    var subVal=d['submitted'];
    var isSubmitted=(subVal==='true'||subVal===true);
    var basicReq=['s_name','school','intern_cat','s_date'];
    var basicOk=basicReq.every(function(k){return checkField(k);});
    if(isSubmitted && basicOk) return 'done';
    return 'draft';
  }

  // ── 核心課程-課後測驗（F-CT01 等）：以 submitted 標記為 done ──
  if(typeof id==='string' && id.indexOf('F-CT')===0){
    var ctSubVal=d['submitted'];
    var ctIsSubmitted=(ctSubVal==='true'||ctSubVal===true);
    var ctBasicReq=['s_name','school','intern_cat','s_date'];
    var ctBasicOk=ctBasicReq.every(function(k){return checkField(k);});
    if(ctIsSubmitted && ctBasicOk) return 'done';
    return 'draft';
  }

  // ── 一般表單：REQUIRED_STUDENT_FIELDS ──
  const req=(REQUIRED_STUDENT_FIELDS[id]||[]).slice();

  // roles='both' 的表單：額外要求老師簽名（若 req 裡沒有）
  const f=findForm(id);
  if(f&&f.roles==='both'&&req.indexOf('t_sign')<0){
    req.push('t_sign');
  }

  const allFilled=req.length===0
    ? hasAnyData
    : req.every(function(k){return checkField(k);});

  if(allFilled) return 'done';
  return 'draft';
}

function getStatusSummary(){
  const statuses=FORMS.map(f=>getStatus(f.id));
  return{
    done:statuses.filter(s=>s==='done').length,
    partial:0, // 已合併到 draft（保留欄位避免相容性問題）
    draft:statuses.filter(s=>s==='draft').length,
    newF:statuses.filter(s=>s==='new').length,
    total:FORMS.length
  };
}

function getUnfilledForms(){
  return FORMS.filter(f=>['new','draft'].includes(getStatus(f.id)));
}

/* ── 老師在表單內切換學生 ── */
async function switchStudent(sid, formId){
  if(!sid) return;
  // ★ 跳轉前檢查:若老師已動筆當前表單但必填未完成,先警示
  if(APP.currentRole==='teacher' && APP.currentFormId
     && typeof teacherConfirmLeaveIfIncomplete==='function'){
    if(!teacherConfirmLeaveIfIncomplete(APP.currentFormId)) return;
  }
  // ★★★ 關鍵:切換學生「之前」,先把當前學生的表單資料 flush 到雲端 ★★★
  // 在 APP.currentStudentId 被改之前,先用「當前學生」的 formKey 儲存。
  // 如果不這樣,老師對 A 學生填的分數,在切到 B 學生時會留在記憶體/localStorage,
  // 但「沒推上雲端」,結果 A 學生用學生帳號登入時看不到老師寫的內容。
  if(APP.currentRole==='teacher' && APP.currentFormId && APP.currentStudentId
     && !APP.currentFormId.startsWith('__')){
    var _curBareId = APP.currentFormId.indexOf('_')>=0
      ? APP.currentFormId.split('_')[0] : APP.currentFormId;
    // 取消任何 pending 的 autoSave 倒數,改為「立即」儲存
    if(typeof _autoSaveTimers !== 'undefined' && _autoSaveTimers[_curBareId]){
      clearTimeout(_autoSaveTimers[_curBareId]);
      delete _autoSaveTimers[_curBareId];
    }
    // 直接呼叫底層儲存:把 APP.formData[<current formKey>] 推到雲端 + localStorage
    try{
      var _curFormKey = getFormKey(_curBareId); // 此時 currentStudentId 還是「舊學生」
      // ★★★【v1.5.5 修正】嚴格守門:資料是空的就不要儲存,也不要覆蓋雲端 ★★★
      // 舊版 bug:當 loadFormFromSheets 暫時清空 APP.formData[_curFormKey] 後,
      // 老師切換學生會把「空物件」推上雲端,覆蓋掉學生本人之前填的資料。
      var _hasData = _curFormKey && APP.formData[_curFormKey]
        && Object.keys(APP.formData[_curFormKey]).length>0;
      if(_hasData){
        // 寫入 localStorage 草稿(改為 merge,不覆蓋本機既有 key)
        try{
          var _drafts = JSON.parse(localStorage.getItem('form_drafts')||'{}');
          if(!_drafts[_curFormKey]) _drafts[_curFormKey] = {};
          Object.keys(APP.formData[_curFormKey]).forEach(function(k){
            _drafts[_curFormKey][k] = APP.formData[_curFormKey][k];
          });
          localStorage.setItem('form_drafts', JSON.stringify(_drafts));
        }catch(e){}
        // 寫入雲端 GAS(非同步,不等待)
        if(typeof saveFormToSheets === 'function'){
          saveFormToSheets(_curFormKey);
        }
      }
    }catch(e){ console.warn('switchStudent flush failed:', e); }
  }
  APP.currentStudentId = sid;
  APP.teacherUnlocked = true;
  // ★ 切換學生後執行 migration：把裸 id 的資料併到 formKey
  try{ migrateBareKeysToFormKey(); }catch(e){console.warn('migration failed:',e);}
  renderSidebar();
  // ★ 切學生後更新頂部 quick-nav,讓統計數字反映新選定學生
  if(typeof updateQuickNav==='function') updateQuickNav();
  // Reload the same form with the new student's data
  await openForm(formId);
}

function getStudentFormStatus(formId, sid){
  // 借用 getStatus 的完整必填邏輯，先暫時把 currentStudentId 指向目標學生
  const key = formId+'_'+sid;
  const data = APP.formData[key];
  if(!data || Object.keys(data).length===0) return 'new';
  // 暫存目前狀態
  const savedStudentId = APP.currentStudentId;
  const savedRole = APP.currentRole;
  const savedUser = APP.currentUser;
  // 切換成 admin/teacher 模式 + currentStudentId=sid，讓 getFormKey 回傳 formId+'_'+sid
  if(APP.currentRole === 'student'){
    // 學生不會用到此函式（學生只看自己），但仍保險處理
    APP.currentRole = 'admin';
    APP.currentUser = null;
  }
  APP.currentStudentId = sid;
  let st;

  } finally {
    APP.currentStudentId = savedStudentId;
    APP.currentRole = savedRole;

  }

}

/* ═══════════ 可摺疊群組(總覽用)— 共用工具 ═══════════ */
/* 用 localStorage 記住每個 view+group 的展開/收起狀態,key 格式: collGrp:<viewKey>:<groupLabel> = '1'/'0' */
function _collGrpKey(viewKey, groupLabel){ return 'collGrp:'+viewKey+':'+groupLabel; }
function _collGrpRead(viewKey, groupLabel){
  try{ return localStorage.getItem(_collGrpKey(viewKey, groupLabel)); }catch(e){ return null; }
}
function _collGrpWrite(viewKey, groupLabel, isOpen){
  try{ localStorage.setItem(_collGrpKey(viewKey, groupLabel), isOpen?'1':'0'); }catch(e){}
}
/* 計算單一群組的進度統計(依目前角色 / 學生)
 * statusFn(id) 由呼叫者傳入,回傳 'done'/'draft'/'new'
 */
function _collGrpStats(group, statusFn){
  let done=0, draft=0, newF=0;
  group.ids.forEach(function(id){
    const f = findForm(id); if(!f) return;
    const st = statusFn(id);
    if(st==='done') done++;
    else if(st==='draft') draft++;
    else newF++;
  });
  const total = done + draft + newF;
  return {done:done, draft:draft, newF:newF, total:total};
}
/* 是否預設展開:預設「全部收起」 — 點大標題才展開;但若使用者手動設過則尊重使用者選擇 */
function _collGrpDefaultOpen(stats){ return false; }
function _collGrpIsOpen(viewKey, groupLabel, stats){
  const saved = _collGrpRead(viewKey, groupLabel);
  if(saved === '1') return true;
  if(saved === '0') return false;
  return _collGrpDefaultOpen(stats);
}
/* 切換單一群組 */
window.toggleCollGrp = function(viewKey, groupLabel){
  const groupEl = document.querySelector('.collapsible-group[data-grp="'+CSS.escape(viewKey+':'+groupLabel)+'"]');
  if(!groupEl) return;
  const willOpen = !groupEl.classList.contains('is-open');
  groupEl.classList.toggle('is-open', willOpen);
  _collGrpWrite(viewKey, groupLabel, willOpen);
};
/* 全部展開 / 全部收起 / 智慧重設 */
window.collGrpExpandAll = function(viewKey){
  document.querySelectorAll('.collapsible-group[data-vk="'+CSS.escape(viewKey)+'"]').forEach(function(el){
    el.classList.add('is-open');
    _collGrpWrite(viewKey, el.getAttribute('data-label'), true);
  });
};
window.collGrpCollapseAll = function(viewKey){
  document.querySelectorAll('.collapsible-group[data-vk="'+CSS.escape(viewKey)+'"]').forEach(function(el){
    el.classList.remove('is-open');
    _collGrpWrite(viewKey, el.getAttribute('data-label'), false);
  });
};
window.collGrpResetSmart = function(viewKey){
  // 清除使用者手動偏好,改回「智慧預設」(未完成展開、全完成收起)
  document.querySelectorAll('.collapsible-group[data-vk="'+CSS.escape(viewKey)+'"]').forEach(function(el){
    const lbl = el.getAttribute('data-label');
    try{ localStorage.removeItem(_collGrpKey(viewKey, lbl)); }catch(e){}
    // 用元素上預先儲存的 default 屬性復原
    const def = el.getAttribute('data-default-open') === '1';
    el.classList.toggle('is-open', def);
  });
};
/* 渲染單一群組頭部 — 標題 + 進度小條 + 狀態 chip */
function _collGrpRenderHead(group, stats, isOpen){
  const pct = stats.total > 0 ? Math.round(stats.done / stats.total * 100) : 0;
  const draftPct = stats.total > 0 ? Math.round(stats.draft / stats.total * 100) : 0;
  let chips = '';
  if(stats.done > 0) chips += '<span class="stag stag-done">✅ '+stats.done+'</span>';
  if(stats.draft > 0) chips += '<span class="stag stag-draft">✏️ '+stats.draft+'</span>';
  if(stats.newF > 0) chips += '<span class="stag stag-new">⭕ '+stats.newF+'</span>';
  if(stats.done === stats.total && stats.total > 0) chips = '<span class="stag stag-allgood">🎉 全部完成</span>';
  return '<div class="collapsible-header" onclick="toggleCollGrp(this.parentElement.getAttribute(\'data-vk\'), this.parentElement.getAttribute(\'data-label\'))">'
    + '<span class="collapsible-caret">▶</span>'
    + '<span class="collapsible-title">'+escapeExamHtml(group.label)+'</span>'
    + '<span class="collapsible-summary">'
      + '<span class="collapsible-progress">'+stats.done+' / '+stats.total
        + '<span class="collapsible-progress-bar">'
          + '<span class="pb-done" style="width:'+pct+'%;"></span>'
          + '<span class="pb-draft" style="width:'+draftPct+'%;"></span>'
        + '</span>'
      + '</span>'
      + '<span class="collapsible-status-tags">'+chips+'</span>'
    + '</span>'
  + '</div>';
}
/* 渲染上方工具列(全部展開 / 全部收起) */
function _collGrpRenderToolbar(viewKey, sm){
  return '<div class="collapsible-toolbar">'
    + '<div style="font-size:12px;color:var(--ink3);">點擊群組標題即可展開／收起；系統會記住您的選擇</div>'
    + '<div class="collapsible-toolbar-actions">'
      + '<button class="collapsible-toolbar-btn" onclick="collGrpExpandAll(\''+viewKey+'\')">▼ 全部展開</button>'
      + '<button class="collapsible-toolbar-btn" onclick="collGrpCollapseAll(\''+viewKey+'\')">▲ 全部收起</button>'
    + '</div>'
  + '</div>';
}

        <div class="form-card-name" style="margin-top:4px;">${f.name}</div>
        <div class="form-card-sub">${f.sub}</div>
        <div class="form-card-meta">${rolesTag}<span style="font-size:11px;color:${stColor};font-weight:500;">${stLabel}</span></div>
      </div>`;
    });
    html+='</div></div></div>';
  });
  html+='</div>';
  mc.innerHTML=html;
  // ★ 重渲染總覽後同步更新頂部 quick-nav
  if(typeof updateQuickNav==='function') updateQuickNav();
}

/* ═══════════ OPEN FORM ═══════════ */
async function openForm(id){
  // ★ 跳轉前檢查:老師在離開「不同的」舊表單前,若必填未完成,先警示
  // 只有「切到不同表單」才檢查;同表單 re-render(例如 switchStudent 內部呼叫)不檢查
  if(APP.currentRole==='teacher' && APP.currentFormId
     && APP.currentFormId !== id
     && typeof teacherConfirmLeaveIfIncomplete==='function'){
    if(!teacherConfirmLeaveIfIncomplete(APP.currentFormId)) return;
  }
  // ★ 切換表單前：強制觸發目前表單的待儲存草稿（若有未完成的 debounce 計時）
  if(APP.currentFormId && APP.currentFormId !== id && !APP.currentFormId.startsWith('__')){
    const oldBare = APP.currentFormId.indexOf('_')>=0 ? APP.currentFormId.split('_')[0] : APP.currentFormId;
    if(_autoSaveTimers[oldBare]){
      clearTimeout(_autoSaveTimers[oldBare]);
      delete _autoSaveTimers[oldBare];
      // 立即儲存而非等 5 秒
      try{ runAutoSave(oldBare); }catch(e){console.warn('flush autoSave failed:',e);}
    }
  }
  // 自動暫存目前表單（如果有未儲存的資料）
  if(APP.currentFormId && APP.currentFormId !== id && 
     !APP.currentFormId.startsWith('__')){
    autoSaveDraft(APP.currentFormId);
  }

  // ★★★ 修正 PIN 跨表單外洩 bug(v3) ★★★
  // 鎖回規則:
  //  - 「同表單再次渲染」(id === currentFormId) 且 _skipPinReset=true → 保留解鎖狀態
  //    (這是 PIN 解鎖後同表單因雲端同步等原因再次觸發 openForm 的情境)
  //  - 其他所有情境(切到不同表單、從總覽進入任何表單──此時 currentFormId 為 null)
  //    → 一律重置 teacherUnlocked,確保新表單以鎖定狀態開啟
  //  - _skipPinReset 旗標只在「同表單再次渲染」時生效一次,然後即刻消費掉
  //  ─────────────────────────────────────────────────────────
  //  舊版 bug:條件為 `APP.currentFormId && APP.currentFormId !== id`,
  //  導致「返回總覽再點表單」(currentFormId 已被 renderFormList 清為 null)
  //  時整個分支被跳過,teacherUnlocked 維持解鎖狀態 → 跨表單外洩。
  if(APP.currentRole==='student'){
    var _isSameFormReRender = (APP.currentFormId === id);
    if(_isSameFormReRender && APP._skipPinReset){
      // 同表單剛 PIN 解鎖完的後續再次渲染 → 保留解鎖狀態,消費旗標
      APP._skipPinReset=false;
    } else {
      // 任何「進入新表單」情境(切換、從總覽進入、首次進入) → 一律鎖回
      APP.teacherUnlocked=false;
      // 筆試後測 PIN:離開 F-POST 一律重置(包含從總覽進其他表單也算離開)
      if(APP.currentFormId==='F-POST' && id!=='F-POST'){
        APP.examUnlocked=false;
      }
      APP._skipPinReset=false;
    }
  }
  // 老師端切換表單時,自動清掉學生欄位的「已確認」標記
  // (B 方案:每張新表單重新攔截,確保不延續上一張的確認狀態)
  // 這個動作其實是自動發生的,因為每張表單的 DOM 都會重新渲染

  // ★★★ 修正:切到非 F16 表單時,清除 F16 浮動表頭與相關 scroll/resize 監聽 ★★★
  // 原因:F16 的浮動表頭(#f16-floating-thead)是 appendChild 到 document.body 的 fixed 元素,
  //      不會隨 main-content 重新渲染而消失;scroll handler 也會繼續觸發顯示,
  //      導致切到別張表單(例如 ILPs)時,左上角仍殘留「題目敘述/0 不像/1 有點像/2 很像」表頭。
  if(id !== 'F16'){
    var _f16fh = document.getElementById('f16-floating-thead');
    if(_f16fh) _f16fh.remove();
    if(window.__f16ScrollHandler){
      window.removeEventListener('scroll', window.__f16ScrollHandler);
      var _f16mc = document.getElementById('main-content');
      if(_f16mc) _f16mc.removeEventListener('scroll', window.__f16ScrollHandler);
      window.__f16ScrollHandler = null;
    }
    if(window.__f16ResizeHandler){
      window.removeEventListener('resize', window.__f16ResizeHandler);
      window.__f16ResizeHandler = null;
    }
  }

  APP.currentFormId=id;
  renderSidebar();
  const mc=document.getElementById('main-content');
  const f=findForm(id);if(!f)return;

  // 顯示載入中
  mc.innerHTML=`<div style="padding:2rem;text-align:center;color:var(--ink3);">
    <div style="font-size:24px;margin-bottom:8px;">⏳</div>
    <div style="font-size:13px;">載入表單資料中...</div>
  </div>`;

  const formKey = getFormKey(id);
  
  // 合併所有可能 key 的資料到 formKey
  function mergeAllKeys(){
    if(!APP.formData[formKey])APP.formData[formKey]={};
    // ★★★ 修正:絕對不可以把「其他學生」的同表單資料合併進來 ★★★
    // 合併來源「只允許」：
    //   (1) 裸 id（舊版未含學號的殘留資料,由 migration 搬入當前學生）
    //   (2) 當前 formKey 本身
    // 嚴禁使用 k.startsWith(id+'_') 之類的廣域匹配——這會把 D01_<其他學號>
    // 的資料也掃進來,造成切換學生時看到別人的資料(本表單跨學生外洩 bug)。
    var keysToMerge=[id, formKey];
    keysToMerge=keysToMerge.filter(function(v,i,a){return a.indexOf(v)===i;});

    // ★ 改用「非空值優先」合併：來源的空字串/null/undefined 不能覆蓋 formKey 已有的有效值
    function mergeNonEmpty(target, source){
      if(!source) return;
      Object.keys(source).forEach(function(k){
        var v=source[k];
        if(v===''||v===null||v===undefined||v===false) return;
        // 只在 target 該 key 為空時填入；若 target 已有有效值，保留 target
        var tv=target[k];
        if(tv===''||tv===null||tv===undefined||tv===false){
          target[k]=v;
        }
        // 若兩邊都有 → 保留 target（formKey 是正規來源），不覆蓋
      });
    }

    keysToMerge.forEach(function(k){
      if(k!==formKey && APP.formData[k] && Object.keys(APP.formData[k]).length>0){
        mergeNonEmpty(APP.formData[formKey], APP.formData[k]);
      }
    });
    // 載入草稿（同樣非空值優先）
    try{
      var drafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
      keysToMerge.forEach(function(k){
        if(drafts[k]){
          mergeNonEmpty(APP.formData[formKey], drafts[k]);
        }
      });
    }catch(e){}
    /* ★ FIX v19.5：mergeNonEmpty 是「空的就補」，會讓使用者剛清空的欄位
       被裸 id / 舊草稿的舊值補回來 —— 這就是「刪掉分數、切走再回來又出現」
       的其中一條路徑。合併完後把已登記刪除的 key 再清一次。 */
    try{
      if(typeof getDeletedKeysFor==='function'){
        getDeletedKeysFor(formKey).forEach(function(k){
          delete APP.formData[formKey][k];
        });
      }
    }catch(e){}
    // 合併 historyLog（這個沒有「空值覆蓋」問題，照舊去重合併即可）
    if(!APP.historyLog[formKey])APP.historyLog[formKey]=[];
    keysToMerge.forEach(function(k){
      if(k!==formKey&&APP.historyLog[k]&&APP.historyLog[k].length>0){
        APP.historyLog[k].forEach(function(entry){
          var exists=APP.historyLog[formKey].some(function(e){return e.ts===entry.ts;});
          if(!exists)APP.historyLog[formKey].push(entry);
        });
        APP.historyLog[formKey].sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});
      }
    });
    // ★ 合併完後，把裸 id 的殘留資料清掉，避免下次又被掃進來
    if(id!==formKey && APP.formData[id]){
      delete APP.formData[id];
    }
    // 同步清掉 localStorage 內的裸 id 草稿
    try{
      var drafts2=JSON.parse(localStorage.getItem('form_drafts')||'{}');
      if(drafts2[id] && id!==formKey){
        // 確認 formKey 草稿存在後才清
        if(drafts2[formKey]){
          delete drafts2[id];
          localStorage.setItem('form_drafts',JSON.stringify(drafts2));
        }
      }
    }catch(e){}
  }
  
  mergeAllKeys();

  const canT=APP.currentRole==='teacher'||APP.currentRole==='admin'||APP.teacherUnlocked;
  const canS=APP.currentRole==='student';
  const d=Object.assign({}, APP.formData[id]||{}, APP.formData[formKey]||{});
  APP.formData[formKey]=Object.assign({},d);

  // ★★★【v1.5.5 診斷 log】記錄 buildXxx 渲染前的記憶體狀態 ★★★
  var _initFCount = Object.keys(d).filter(function(k){return /^f\d/.test(k);}).length;
  console.log('[openForm] '+id+' 開始渲染,傳給 buildXxx 的 d 中 f* key 共 '+_initFCount+' 個');

  let studentBanner='';
  if(APP.currentRole==='teacher'||APP.currentRole==='admin'){
  // 計算每位學生此表單的評核狀態
  const stuRows=Object.entries(APP.students).map(([sid,acc])=>{
    const fkey=id+'_'+sid;
    const fd=APP.formData[fkey]||{};
    const ff=findForm(id);
    const hasStudentData=Object.keys(fd).length>0;
    const hasTeacherData=ff&&ff.tFields&&ff.tFields.length>0?ff.tFields.some(k=>fd[k]&&String(fd[k]).trim()):false;
    let status='unevaluated';
    if(hasStudentData&&hasTeacherData) status='done';
    else if(hasStudentData) status='student_only';
    else if(hasTeacherData) status='teacher_only';
    return {sid,acc,status};
  });

  const stuOpts=stuRows.map(({sid,acc,status})=>{
    const mark=status==='done'?'✅ ':status==='student_only'?'📝 ':status==='teacher_only'?'✏️ ':'⭕ ';
    const label=status==='done'?'（已完成）':status==='student_only'?'（待老師評）':status==='teacher_only'?'（待學生填）':'（未填寫）';
    return `<option value="${escAttr(sid)}" ${APP.currentStudentId===sid?'selected':''}>${mark}${esc(acc.name)} ${label}</option>`;
  }).join('');

  const curStu=APP.currentStudentId?APP.students[APP.currentStudentId]:null;

  // 狀態統計列表
  const doneCount=stuRows.filter(r=>r.status==='done').length;
  const pendCount=stuRows.filter(r=>r.status==='student_only').length;
  const noneCount=stuRows.filter(r=>r.status==='unevaluated').length;

  // 學生狀態卡片列表
  const _stuCardHtml=({sid,acc,status})=>{
    const isActive=APP.currentStudentId===sid;
    const bg=isActive?'background:var(--ink);color:#fff;':'background:#fff;color:var(--ink);';
    const dotColor=status==='done'?'#639922':status==='student_only'?'#EF9F27':status==='teacher_only'?'#1A3A5C':'#B4B2A9';
    const statusLabel=status==='done'?'已完成':status==='student_only'?'待評分':status==='teacher_only'?'待學生填':'未填寫';
    return `<div onclick="switchStudent('${escapeJsString(sid)}','${id}')" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);cursor:pointer;${bg}border:1px solid ${isActive?'var(--ink)':'var(--border2)'};transition:all .15s;">
      <span style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;"></span>
      <span style="font-size:12px;font-weight:${isActive?'600':'400'};flex:1;">${esc(acc.name)}</span>
      <span style="font-size:10px;padding:1px 7px;border-radius:999px;background:${isActive?'rgba(255,255,255,.2)':'var(--cream)'};color:${isActive?'#fff':'var(--ink3)'};">${statusLabel}</span>
    </div>`;
  };
  // ★ v1.6：學生一多就依「學期」分組，預設只展開目前學生所在的梯次
  const _termGroups=groupSidsByTerm(stuRows.map(r=>r.sid));
  let stuCards;
  if(_termGroups.length<=1){
    stuCards=stuRows.map(_stuCardHtml).join('');
  }else{
    const _rowBySid={};
    stuRows.forEach(r=>{ _rowBySid[r.sid]=r; });
    const _curTerm=APP.currentStudentId?getStudentTerm(APP.currentStudentId):_termGroups[0].term;
    stuCards=_termGroups.map(g=>{
      const open=(g.term===_curTerm)?' open':'';
      const doneN=g.sids.filter(s=>(_rowBySid[s]||{}).status==='done').length;
      return `<details${open} style="border:1px solid var(--border2);border-radius:var(--r);background:#FCFCFB;">
        <summary style="cursor:pointer;padding:6px 10px;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;">
          <span>🎓 ${esc(g.term)}</span>
          <span style="font-size:10px;background:var(--primary);color:#fff;padding:1px 7px;border-radius:999px;">${g.sids.length} 位</span>
          <span style="font-size:10px;color:var(--ink3);">已完成 ${doneN}/${g.sids.length}</span>
        </summary>
        <div style="display:flex;flex-direction:column;gap:5px;padding:6px 8px 8px;">
          ${g.sids.map(s=>_stuCardHtml(_rowBySid[s])).join('')}
        </div>
      </details>`;
    }).join('');
  }

  studentBanner=`<div style="background:var(--cream);border:1px solid var(--border);border-radius:var(--r2);padding:1rem;margin-bottom:1rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;">
      <div style="font-size:12px;font-weight:600;color:var(--ink3);">👤 選擇學生</div>
      <div style="display:flex;gap:8px;font-size:11px;">
        <span style="color:var(--green);">✅ 完成 ${doneCount}</span>
        <span style="color:var(--gold);">📝 待評 ${pendCount}</span>
        <span style="color:var(--ink3);">⭕ 未填 ${noneCount}</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;">
      ${stuCards}
    </div>
    ${!APP.currentStudentId?'<div style="font-size:11px;color:var(--red);margin-top:8px;padding:6px 8px;background:#FFF0F0;border-radius:var(--r);">⚠ 請點選上方學生姓名才能填寫表單</div>':''}
  </div>`;
  }

  let html=`<div class="form-detail-view" data-role="${APP.currentRole||''}" data-form-id="${id}">`;
  html+=`<div class="form-detail-header">
  <h1>${f.name}</h1>
  <div class="fh-meta">${f.sub}　｜　${f.roles==='both'?'學生＋老師填寫':f.roles==='student'?'學生填寫':'老師填寫'}</div>
  </div>`;
  html+=studentBanner;

  // 表單填寫進度條(掛在表單上方,自動統計已填欄位;對學生視角不計入老師欄位)
  // ─── 隱藏進度條的規則(依角色 × 表單) ───
  //   學生視角: F04M/F04S/F08/F09 隱藏(這 4 張流程偏自由文字 / 多選跨段)
  //   老師視角: F01A、F-PRE、F-POST、F-CT01~12、F16、E01~E03 隱藏
  //            (這些表單老師沒有需要填寫的欄位,或使用者明確指定不需要)
  var __role=APP.currentRole||'';
  var __hideForStudent=['F04M','F08','F09'];
  var __hideForTeacher=['F01A','F-PRE','F-POST','F16','F-CT01'];
  var __hideProgress=false;
  if(__role==='student' && __hideForStudent.indexOf(id)>=0) __hideProgress=true;
  if((__role==='teacher'||__role==='admin') && __hideForTeacher.indexOf(id)>=0) __hideProgress=true;
  if(!__hideProgress){
    html+=`<div class="form-progress" id="form-progress-${id}" role="status" aria-label="表單填寫進度">
      <div class="form-progress-label">
        已填 <span class="fp-num"><span class="fp-done">0</span> / <span class="fp-total">0</span></span> 欄
        <span class="fp-pct">(0%)</span>
      </div>
      <div class="form-progress-track"><div class="form-progress-fill"></div></div>
    </div>`;
  }

  // Lock bar for student viewing teacher-only form
  if(f.roles==='both'&&APP.currentRole==='student'&&!APP.teacherUnlocked){
  html+=`<div class="lock-bar">🔒 老師評分欄位已鎖定。老師請輸入 PIN 碼解鎖：
    <input id="inline-pin" type="password" placeholder="PIN碼" maxlength="8">
    <button class="unlock-btn" onclick="inlineUnlock()">解鎖</button>
    <span id="inline-msg" style="font-size:11px;margin-left:4px;"></span>
  </div>`;
  }

  // Form content
  try{
    html+=buildFormBody(f,d,canT,formKey,canS);
  }catch(buildErr){
    console.error('buildFormBody error:',buildErr);
    html+='<div class="card"><div class="card-body" style="color:var(--red);">⚠ 表單載入失敗：'+buildErr.message+'</div></div>';
  }

  // Footer
  const hasSaved=APP.historyLog[formKey]&&APP.historyLog[formKey].length>0;
  html+=`<div class="form-footer">
  <button class="btn-back" onclick="renderFormList();window.scrollTo(0,0);">← 返回總覽</button>
  <div class="form-footer-right">
    <span class="saved-msg" id="saved-msg">✓ 已儲存</span>

    <button class="btn-save" onclick="saveForm('${id}')" title="儲存後即可在其他裝置同步看到">儲存表單</button>
  </div>
  </div>`;

  // History log
  html+=buildHistoryLog(id);
  html+='</div>';
  mc.innerHTML=html;
  // 切換表單時：永遠從表單最上方（基本資料區）開始顯示，不要保留前一張表單的捲動位置
  try{ window.scrollTo({top:0, behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
  // 部分行動瀏覽器需在下一個 frame 才生效，加一個保險
  setTimeout(function(){
    try{ window.scrollTo({top:0, behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
    var mcEl = document.getElementById('main-content');
    if(mcEl) mcEl.scrollTop = 0;
    // 重新量測 topbar 高度,確保 sticky 表頭(F16 等)能錨定到正確位置
    if(typeof setTopbarHeightVar==='function') setTopbarHeightVar();
  }, 0);

  // 自動為每張 card 套上學生藍／老師紅／混合色
  try{ applyCardColors(); }catch(e){console.warn('applyCardColors failed:',e);}

  // 表單填寫進度條:初始計算 + 綁定變更監聽
  try{
    bindFormProgressEvents();
    // 延後一拍,等待各 build 函式的 setTimeout 渲染完成(如 F16 等)
    setTimeout(function(){ updateFormProgress(); }, 80);
    setTimeout(function(){ updateFormProgress(); }, 700);
  }catch(e){console.warn('form progress init failed:',e);}

  // ★ 為所有 radio 啟用「再點同一值就清除」功能
  try{ enableRadioToggleClear(); }catch(e){console.warn('enableRadioToggleClear failed:',e);}

  // ★★★ 終極保險:對所有「明確的老師元素」主動標記 data-student-confirmed='1' ★★★
  //   即使有任何 handler 意外掛上去,守護函式入口會檢查此標記直接放行,
  //   100% 確保老師欄位絕對不會跳「修改學生欄位?」警示。
  //   ★ 效能優化:單次掃描,複合條件判斷,避免兩次全文件 querySelectorAll
  try{
    var _mc = document.getElementById('main-content');
    if(_mc){
      _mc.querySelectorAll('[data-teacher="1"],[data-key],[data-rkey]').forEach(function(el){
        // 條件 1:有 data-teacher="1" 直接標記
        if(el.getAttribute('data-teacher')==='1'){
          el.setAttribute('data-student-confirmed','1');
          return;
        }
        // 條件 2:data-key 或 data-rkey 在老師白名單
        var k = el.getAttribute('data-key') || el.getAttribute('data-rkey') || '';
        if(k && typeof isTeacherFieldKey==='function' && isTeacherFieldKey(k)){
          el.setAttribute('data-student-confirmed','1');
        }
      });
    }
  }catch(e){ console.warn('teacher field pre-confirm failed:',e); }

  // 360度評估表：初始化自動計算
  if(APP.currentFormId==='F07M'||APP.currentFormId==='F07S'){
  setTimeout(function(){
    // ★ 用「表單鍵(含學號)」呼叫，與 build360 產生的元素 id 一致
    var fid2=(typeof getFormKey==='function')?getFormKey(APP.currentFormId):APP.currentFormId;
    calc360Score(fid2);
    setTimeout(function(){calc360Score(fid2);},600);
    setTimeout(function(){calc360Score(fid2);},1500);
  },150);
  }

  // 回填日期區間欄位（drs_*_s / drs_*_e）
  setTimeout(function(){
    var data=APP.formData[formKey]||{};
    Object.keys(data).forEach(function(key){
      var val=data[key];
      if(!val||typeof val!=='string')return;
      if(val.indexOf(' - ')<0)return;
      var parts=val.split(' - ');
      var sv=parts[0]?parts[0].replace(/\//g,'-'):'';
      var ev=parts[1]?parts[1].replace(/\//g,'-'):'';
      var sEl=document.getElementById('drs_'+formKey+'_'+key+'_s')
           ||document.getElementById('drs_'+id+'_'+key+'_s');
      var eEl=document.getElementById('drs_'+formKey+'_'+key+'_e')
           ||document.getElementById('drs_'+id+'_'+key+'_e');
      if(sEl&&sv&&!sEl.value) sEl.value=sv;
      if(eEl&&ev&&!eEl.value) eEl.value=ev;
    });
  },50);

  // 老師登入:鎖定學生欄位(預設;可由「🖋 修改學生欄位」按鈕主動解鎖)
  // 注意:F01A 是 student-only,老師登入不應鎖定該表單的學生評分按鈕
  if(APP.currentRole==='teacher'){
    var isStudentOnlyForm=(f&&f.roles==='student');
    if(!isStudentOnlyForm){
      // 進到非 student-only 表單時,先解除可能殘留的「整表警示」listener,
      // 避免從 F16 等切過來時,舊 listener 仍對新表單觸發提示
      if(typeof disarmStudentOnlyTeacherWarning==='function') disarmStudentOnlyTeacherWarning();
      lockStudentFields();
    } else {
      // ★ student-only 表單(F16 學習風格、F-PRE/POST 筆試、F-CT01~12 課後測驗):
      //   老師不應該替學生填,但仍要能進來查看內容。
      //   為了避免老師「不小心點到」,在「第一次」互動任一可編輯元素時跳一次全表警示;
      //   確認後該表單在當前進入週期內不再跳(避免騷擾)。
      armStudentOnlyTeacherWarning(id);
    }
  }

  if(GAS_URL && GAS_URL !== 'YOUR_GAS_URL_HERE'){
    // ★ 若本機 APP.formData 已經有這個 formKey 的草稿,就不要拉雲端
    //   (避免「跳走再跳回,雲端拉舊版蓋掉剛填的東西」)
    //   要看別台裝置的最新版,請使用右上角「🔄 同步」按鈕(它走 replaceMode 強制覆蓋)
    var _existing = APP.formData[formKey] || {};
    var _hasLocalDraft = Object.keys(_existing).some(function(k){
      var v = _existing[k];
      return v !== '' && v !== null && v !== undefined && v !== false;
    });
    if(_hasLocalDraft){
      console.log('[openForm] '+formKey+' 本機已有草稿,跳過 loadFormFromSheets,使用本機資料');
      // 仍然刷一次 UI 以防按鈕視覺與記憶體不同步
      if(typeof refreshFormUI === 'function'){
        try{ refreshFormUI(formKey); }catch(e){}
      }
    } else {
      // 本機沒有草稿(第一次打開、或是剛登入) → 從雲端拉
      loadFormFromSheets(formKey).then(function(){
        mergeAllKeys();
        if(APP.currentFormId===id){
          var hw=document.getElementById('history-wrap');
          if(hw) hw.innerHTML=buildHistoryItems(formKey);
        }
        if(typeof refreshFormUI === 'function'){
          try{ refreshFormUI(formKey); }catch(e){}
        }
      }).catch(function(){});
    }
  }

  // ★ F10A / F10B 殘留值清理：若先前因 saveForm 的 bug 把 radio 寫成 'on'，
  //   清掉這些壞值，讓使用者重新勾選即可（避免 'on' 卡住 PDF 顯示）
  if(id==='F10A' || id==='F10B'){
    var f10keys=['q_basic','q_self','q_progress','q_detail','q_t_sign','q_feeling','q_t_fb','q_all_sign',
                 's_q2','s_q3','s_q4','s_q5','s_q6'];
    var changed=false;
    [id, formKey].forEach(function(k){
      if(APP.formData[k]){
        f10keys.forEach(function(fk){
          if(APP.formData[k][fk]==='on'){ delete APP.formData[k][fk]; changed=true; }
        });
      }
    });
    try{
      var lsDr=JSON.parse(localStorage.getItem('form_drafts')||'{}');
      [id, formKey].forEach(function(k){
        if(lsDr[k]){
          f10keys.forEach(function(fk){
            if(lsDr[k][fk]==='on'){ delete lsDr[k][fk]; changed=true; }
          });
        }
      });
      if(changed) localStorage.setItem('form_drafts', JSON.stringify(lsDr));
    }catch(e){}
    if(changed){
      console.log('[F10 修補] 清除舊版殘留的 "on" 值，請重新勾選查核項目');
    }
  }

  // ★ F15 加分項目殘留值清理：先前 onchange 用 this.value 但 radio 沒有 value 屬性，
  //   所以 bonus 被存成 "on"。現在修好之後清掉舊的壞值，讓使用者重新勾選。
  if(id==='F15'){
    var f15changed=false;
    [id, formKey].forEach(function(k){
      if(APP.formData[k] && APP.formData[k]['bonus']==='on'){
        delete APP.formData[k]['bonus']; f15changed=true;
      }
    });
    try{
      var ls15=JSON.parse(localStorage.getItem('form_drafts')||'{}');
      [id, formKey].forEach(function(k){
        if(ls15[k] && ls15[k]['bonus']==='on'){
          delete ls15[k]['bonus']; f15changed=true;
        }
      });
      if(f15changed) localStorage.setItem('form_drafts', JSON.stringify(ls15));
    }catch(e){}
    if(f15changed){
      console.log('[F15 修補] 清除舊版加分項目殘留的 "on" 值，請重新勾選');
    }
  }
}

async function inlineUnlock(){
  const pinInput=document.getElementById('inline-pin');
  const pin=clipInput(pinInput?pinInput.value:'', 16);
  const msg=document.getElementById('inline-msg');
  if(!msg) return;
  // 暴力破解保護：每位學生獨立計次
  const lockKey='pin_'+(APP.currentUser&&APP.currentUser.sid?APP.currentUser.sid:'guest');
  const locked=isLocked(lockKey);
  if(locked){
    msg.style.color='var(--red)';
    msg.textContent='PIN 嘗試次數過多，請等待 '+locked+' 秒';
    return;
  }
  // 【資安修補 v18.2】優先走後端 verifyTeacherPin
  // 後端用 Script Properties 的 TEACHER_PIN_HASH 比對（含限速保護）
  // 連線失敗時退回本地比對（向下相容）
  let matched = false;
  try {
    const result = await callBackend('verifyTeacherPin', {pin: pin});
    if(result && result.ok){
      matched = true;
    } else if(result && result.error && result.error.indexOf('連線')<0){
      // 後端明確回傳錯誤（PIN 錯、未設定等）→ 不退回本地，直接顯示錯誤
      matched = false;
    } else {
      // 連線失敗 → 退回本地比對
      matched = await passwordMatchesV2(pin, APP.teacherPIN, 'teacher_pin');
    }
  } catch(e) {
    console.warn('verifyTeacherPin failed, falling back to local:', e);
    matched = await passwordMatchesV2(pin, APP.teacherPIN, 'teacher_pin');
  }
  if(matched){
    clearFails(lockKey);
    APP.teacherUnlocked=true;
    APP._skipPinReset=true;
    msg.style.color='var(--green)';msg.textContent='解鎖成功！';
    if(pinInput) pinInput.value='';
    unlockTeacherFieldsInDOM();
  } else {
    recordFail(lockKey);
    msg.style.color='var(--red)';msg.textContent='PIN碼錯誤';
    if(pinInput) pinInput.value='';
  }
}

/* ── 自動為每張 card 套上學生藍／老師紅／混合色 ── */
/* 規則：
   1) card 內含 .t-badge 但沒有任何學生欄位（s_sign/s_fb/s_comment/s_feeling/s_improve/s_good/s-badge） → t-card（淡紅）
   2) card 內有學生欄位（s_sign/s_name/s_comment/s_feeling…）但沒有 .t-badge 也沒有老師欄位（t_*） → s-card（淡藍）
   3) card 內同時包含學生與老師欄位 → m-card（混合，不染整張，由內部子區塊處理）
   4) 純資訊類 card（基本資料、病人資料、診斷、呼吸計畫…）視同學生卡（學生填寫）→ s-card
*/
function applyCardColors(){
  var mc=document.getElementById('main-content');
  if(!mc) return;
  // 老師欄位 key 前綴清單
  var T_KEYS=['t_sign','t_sign2','t_fb','t_good','t_improve','t_comment','t_title','t_note','t_date',
    'director_fb','peer_good','peer_suggest','peer_sign','host_sign','host_date','host_note',
    'result','score','score_grade','epa_level','follow_date',
    'q_basic','q_self','q_progress','q_detail','q_t_sign','q_feeling','q_t_fb','q_all_sign',
    'bonus','s1','s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h',
    't_level','t_satisfy','obs_min','fb_min'];
  // 學生欄位 key 清單（僅學生會填的）
  var S_KEYS=['s_sign','s_sign_date','s_fb','s_comment','s_feeling','s_improve','s_satisfy','s_good','s_name',
    's_date','school','intern_cat','bed','pt_name','gender','birth_date','diagnosis','rt_ind',
    'vent_type','medical_focus','rt_plan','goal','motivation','strategy','difficulty','criteria',
    'timeline','f12_q1','f12_q2','f12_q3','f12_q4','f12_q5','f12_q6',
    'f12_q7_1','f12_q7_2','f12_q7_3','f12_q7_4','f12_q7_5','f12_q7_6',
    'f15s_att_0','f15s_att_1','f15s_att_2','f15s_att_3','f15s_att_4',
    'f15s_skl_0','f15s_skl_1','f15s_skl_2','f15s_skl_3','f15s_skl_4',
    'f15s_skl_5','f15s_skl_6','f15s_skl_7','f15s_skl_8','f15s_skl_9',
    'f15s_com_0','f15s_com_1','f15s_com_2','f15s_com_3','f15s_com_4'];
  
  function hasTeacherContent(card){
    if(card.querySelector('.t-badge')) return true;
    var ts=card.querySelectorAll('[data-key]');
    for(var i=0;i<ts.length;i++){
      var k=ts[i].getAttribute('data-key')||'';
      // 明確老師 key
      if(T_KEYS.indexOf(k)>=0) return true;
      // 老師評分欄位（f02/f05/f06/f07/f13/f14/f15）但 f02 是學生自評...實際看 data-teacher
      if(ts[i].getAttribute('data-teacher')==='1') return true;
      // 老師簽名相關
      if(/^t_/.test(k) && k!=='team_good' && k!=='team_suggest' && k!=='team_sign' && k!=='team_title' && k!=='team_type_1' && k!=='team_care_1') return true;
    }
    // 老師按鈕
    if(card.querySelector('button[data-teacher="1"]')) return true;
    // EPA 信賴等級（老師評）
    if(card.querySelector('.epa-level')) return true;
    return false;
  }
  function hasStudentContent(card){
    if(card.querySelector('.s-badge')) return true;
    var sl=card.querySelectorAll('[data-key]');
    for(var i=0;i<sl.length;i++){
      var k=sl[i].getAttribute('data-key')||'';
      // 明確標記 data-teacher="1" 者屬老師欄位，不計為學生內容
      //（例如「評核日期」用 s_date 但實為老師填，避免被判成混色 m-card）
      if(sl[i].getAttribute('data-teacher')==='1') continue;
      if(S_KEYS.indexOf(k)>=0) return true;
      // 學生評分欄位
      if(sl[i].getAttribute('data-teacher')==='0') return true;
      // F01 學前自評
      if(/^f01_(pre|post)_/.test(k)) return true;
    }
    // 學生按鈕
    if(card.querySelector('button[data-teacher="0"]')) return true;
    return false;
  }
  
  mc.querySelectorAll('.card').forEach(function(card){
    // 移除前次套色
    card.classList.remove('s-card','t-card','m-card');
    var hasT=hasTeacherContent(card);
    var hasS=hasStudentContent(card);
    if(hasT && hasS){
      card.classList.add('m-card');
    } else if(hasT){
      card.classList.add('t-card');
    } else if(hasS){
      card.classList.add('s-card');
    } else {
      // 沒有 data-key 也沒有 badge 的 card：視 card-head-title 文字判斷
      var title=card.querySelector('.card-head-title');
      var t=title?title.textContent:'';
      if(/老師|教師|指導者|主持人|評分|查核|評核/.test(t) && !/學生|自評/.test(t)){
        card.classList.add('t-card');
      } else if(/學生|自評|心得|計畫|診斷|資料|建議/.test(t)){
        card.classList.add('s-card');
      }
      // 完全中性的不染色
    }
    // ── 標籤文字與配色一致：綠=「學生」、黃=「老師」、混色=「學生＋老師」──
    var _head=card.querySelector('.card-head-title');
    var _cardHead=card.querySelector('.card-head');
    if(_head){
      // 移除整個 card-head 內既有的 s/t/m 徽章(含 title 內與其兄弟節點)，避免重複出現兩次
      (_cardHead||_head).querySelectorAll('.s-badge,.t-badge,.m-badge').forEach(function(b){b.remove();});
      var _lab='', _cls='';
      if(card.classList.contains('m-card')){ _lab='學生＋老師'; _cls='m-badge'; }
      else if(card.classList.contains('t-card')){ _lab='老師'; _cls='t-badge'; }
      else if(card.classList.contains('s-card')){ _lab='學生'; _cls='s-badge'; }
      if(_lab){
        var _sp=document.createElement('span');
        _sp.className=_cls; _sp.textContent=_lab;
        _head.appendChild(_sp);
      }
    }
  });
}

function updateFormProgress(formId){
  try{
    var view=document.querySelector('.form-detail-view');
    if(!view) return;
    var role=view.getAttribute('data-role')||APP.currentRole||'';
    var bar=view.querySelector('.form-progress');
    if(!bar) return;
    var isStudent=(role==='student');
    var isTeacher=(role==='teacher'||role==='admin');

    // ───────────────────────────────────────────────
    // 【老師視角】走白名單:精準對齊使用者期望的欄位數
    // ───────────────────────────────────────────────
    if(isTeacher){
      var curFormId=view.getAttribute('data-form-id')||APP.currentFormId||formId||'';
      var bareId=curFormId.indexOf('_')>=0 ? curFormId.split('_')[0] : curFormId;
      // 取得老師白名單
      var teacherKeys;
      if(TEACHER_PROGRESS_OVERRIDE[bareId]){
        teacherKeys=TEACHER_PROGRESS_OVERRIDE[bareId].slice();
      } else {
        var req=(typeof REQUIRED_STUDENT_FIELDS!=='undefined'&&REQUIRED_STUDENT_FIELDS[bareId])
          ? REQUIRED_STUDENT_FIELDS[bareId] : [];
        teacherKeys=req.filter(function(k){
          if(!k||k.indexOf('__')===0) return false;
          return (typeof isTeacherFieldKey==='function') && isTeacherFieldKey(k);
        });
      }
      var teacherTotal=teacherKeys.length;
      // 讀資料:canonical key
      var targetKey=(typeof getCanonicalKey==='function') ? getCanonicalKey(bareId) : bareId;
      var rec=(APP.formData && APP.formData[targetKey]) ? APP.formData[targetKey] : {};
      var teacherDone=0;
      teacherKeys.forEach(function(k){
        var v=rec[k];
        if(v===undefined||v===null||v===false) return;
        var s=String(v).trim();
        if(s===''||s==='[]'||s==='{}'||s==='null') return;
        // 簽名類:剔除「請選擇...」佔位字串
        if(k==='t_sign'||k==='t_sign2'||k==='host_sign'){
          if(s.indexOf('請選擇')===0) return;
        }
        teacherDone++;
      });
      var teacherPct=teacherTotal>0?Math.round(teacherDone/teacherTotal*100):0;
      var tDone=bar.querySelector('.fp-done');
      var tTotal=bar.querySelector('.fp-total');
      var tPct=bar.querySelector('.fp-pct');
      var tFill=bar.querySelector('.form-progress-fill');
      if(tDone) tDone.textContent=teacherDone;
      if(tTotal) tTotal.textContent=teacherTotal;
      if(tPct) tPct.textContent='('+teacherPct+'%)';
      if(tFill) tFill.style.width=teacherPct+'%';
      bar.classList.toggle('is-done', teacherTotal>0 && teacherDone===teacherTotal);
      return;
    }

    // ───────────────────────────────────────────────
    // 【學生視角】掃 DOM(維持原邏輯)
    // ───────────────────────────────────────────────
    // 判斷是否為應計入的欄位
    function shouldCount(el){
      if(!el) return false;
      if(el.type==='hidden'||el.type==='button'||el.type==='submit'||el.type==='reset') return false;
      if(el.disabled||el.readOnly) return false;
      // 跳過 PIN 解鎖輸入框
      if(el.id==='inline-pin') return false;
      // 跳過簽名時間戳隱藏欄
      var k=el.getAttribute('data-key')||el.name||'';
      // 學生視角:不計老師欄位
      if(isStudent){
        if(el.getAttribute('data-teacher')==='1') return false;
        // 透過父層 .field 內有 t-badge 判斷
        var fld=el.closest('.field');
        if(fld && fld.querySelector(':scope > label .t-badge, label > .t-badge')) return false;
      }
      return true;
    }
    // 判斷是否「已填」
    function hasValue(el){
      if(el.type==='checkbox'||el.type==='radio') return !!el.checked;
      var v=el.value;
      if(v===null||v===undefined) return false;
      return String(v).trim().length>0;
    }

    var done=0, total=0;
    var radioGroups={}; // name → {filled:bool}

    var fields=view.querySelectorAll('input,textarea,select');
    fields.forEach(function(el){
      if(!shouldCount(el)) return;
      if(el.type==='radio'){
        var name=el.name||el.getAttribute('data-fid')+'_'+el.getAttribute('data-key');
        if(!name) return;
        if(!(name in radioGroups)){
          radioGroups[name]={filled:false};
          total++;
        }
        if(el.checked) radioGroups[name].filled=true;
        return;
      }
      if(el.type==='checkbox'){
        // checkbox 單獨計算(常用於同意/勾選)
        total++;
        if(el.checked) done++;
        return;
      }
      total++;
      if(hasValue(el)) done++;
    });
    // radio 群組:已填者納入 done
    Object.keys(radioGroups).forEach(function(k){
      if(radioGroups[k].filled) done++;
    });

    // ── 按鈕群組(F01A/F01B 用 button + onclick="f01Click", F02 等用 rBtnTable)──
    // 一組 = 同 data-fid + 同 data-rkey 的所有 button,代表一個評分項目
    var btnGroups={}; // (fid|rkey) → { isTeacher, filled }
    view.querySelectorAll('button[data-rkey][data-fid]').forEach(function(btn){
      if(btn.disabled) return;
      var rkey=btn.getAttribute('data-rkey');
      var bfid=btn.getAttribute('data-fid');
      if(!rkey||!bfid) return;
      var isTch=btn.getAttribute('data-teacher')==='1' ||
                    (btn.classList && btn.classList.contains('sel-t'));
      // 學生視角:跳過老師欄位
      if(isStudent && isTch) return;

      var gkey=bfid+'|'+rkey;
      if(!(gkey in btnGroups)){
        btnGroups[gkey]={ isTeacher:isTch, filled:false, fid:bfid, rkey:rkey };
      }
      // 若先前掃描中此群組已判定為老師欄位,而當前掃到的按鈕是學生按鈕,
      // 表示同 rkey 有混合 → 保守視為非老師,讓學生視角納入
      if(!isTch) btnGroups[gkey].isTeacher=false;
    });
    // 判斷每組是否「已填」:從 APP.formData 找(canonical formKey)
    // ★ 規則:嚴格只看 canonical key,與 setRating/f01Click 的寫入規則一致。
    Object.keys(btnGroups).forEach(function(gk){
      var g=btnGroups[gk];
      // 學生視角再次過濾
      if(isStudent && g.isTeacher) return;
      // 取 canonical formKey (button 的 data-fid 通常已經是 canonical,但保險再算一次)
      var bare=g.fid.indexOf('_')>=0 ? g.fid.split('_')[0] : g.fid;
      var targetKey=(typeof getCanonicalKey==='function') ? getCanonicalKey(bare) : g.fid;
      var rec=(APP.formData && APP.formData[targetKey]) ? APP.formData[targetKey] : null;
      var v=rec?rec[g.rkey]:undefined;
      total++;
      if(v!==undefined && v!==null && String(v).trim()!=='') done++;
    });

    var pct=total>0?Math.round(done/total*100):0;
    var doneEl=bar.querySelector('.fp-done');
    var totalEl=bar.querySelector('.fp-total');
    var pctEl=bar.querySelector('.fp-pct');
    var fillEl=bar.querySelector('.form-progress-fill');
    if(doneEl) doneEl.textContent=done;
    if(totalEl) totalEl.textContent=total;
    if(pctEl) pctEl.textContent='('+pct+'%)';
    if(fillEl) fillEl.style.width=pct+'%';
    bar.classList.toggle('is-done', total>0 && done===total);
  }catch(e){
    console.warn('updateFormProgress error:',e);
  }
}

/* 監聽 form-detail-view 內所有變更,自動更新進度 */
function bindFormProgressEvents(){
  try{
    var view=document.querySelector('.form-detail-view');
    if(!view) return;
    if(view._progressBound) return;
    view._progressBound=true;
    var deb=null;
    var handler=function(){
      clearTimeout(deb);
      deb=setTimeout(function(){ updateFormProgress(); }, 120);
    };
    view.addEventListener('input', handler, true);
    view.addEventListener('change', handler, true);
    // ★ 按鈕群組(F01A/F01B 的 f01Click、F02/DOPS/EPA/360 的 setRating 等)用 onclick 不會冒
    //   input/change 事件,另外掛 click 監聽。
    //
    //   ⚠ 必須用 bubble phase (第 3 參數 false):
    //   - capture phase 會在 button 的 onclick="..." 屬性執行【之前】觸發,
    //     此時 APP.formData 還沒被更新,讀到舊值 → 點「取消」時看不到變化。
    //   - bubble phase 是 onclick 執行完才冒泡上來,APP.formData 已是最新狀態,
    //     可安全立即呼叫 updateFormProgress。
    //
    //   不用 debounce 也安全,因為:
    //   (a) 每次按鈕點擊都會走進 onclick → 同步更新 APP.formData → 才冒泡到這裡
    //   (b) 連點不同按鈕 → 每次都會即時反映,不會殘留舊狀態
    view.addEventListener('click', function(ev){
      // 用 closest 找最近的 button,避免 target 是 button 內的子節點(如 span)導致漏判
      var t = (ev.target && ev.target.closest) ? ev.target.closest('button') : null;
      if(!t) return;
      // 只處理「評分群組按鈕」:
      //   - 標準按鈕(F01A/F01B/F02/F06/F07/F14/F15/EPA 等):同時帶 data-rkey 和 data-fid
      //   - DOPS 按鈕(D04):用 data-key + data-fid + data-rval(setDOPS 寫法)
      //   ★ DOPS 點擊「再點同值=取消」也要立即更新進度,故必須涵蓋
      var isStdRating = t.hasAttribute('data-rkey') && t.hasAttribute('data-fid');
      var isDOPSRating = t.hasAttribute('data-key') && t.hasAttribute('data-fid') && t.hasAttribute('data-rval');
      if(!isStdRating && !isDOPSRating) return;
      // ★ 取消「延遲感」的雙保險:
      //   (1) 立刻同步呼叫 — onclick 已經同步寫好 APP.formData,這裡讀到的就是最新狀態
      //   (2) 再用 rAF 排一次 — 若 onclick 內有微任務(Promise/setTimeout)會在下一拍生效,補正
      try{ updateFormProgress(); }catch(e){}
      if(typeof requestAnimationFrame==='function'){
        requestAnimationFrame(function(){ try{updateFormProgress();}catch(e){} });
      }
    }, false);
    // 也曝露給其他流程呼叫
    window.refreshFormProgress=function(){ updateFormProgress(); };
  }catch(e){console.warn('bindFormProgressEvents:',e);}
}
