/* ═══════════ Radio 「再點同一值就清除」工具 ═══════════
 * 設計目的:radio 按鈕原生不能取消選擇,只能改選別的。這對「填錯想清空」很不便。
 * 行為:
 *  - 第一次點 radio → 正常選中(原本的 change 事件照走)
 *  - 第二次再點同一個 radio → 取消選中,清除資料,所有同 name 的 radio 都 unchecked
 * 觸發時機:在 openForm 完成後呼叫(每個表單渲染後都要套用一次)
 * 範圍:含 data-key 屬性的 radio(避免動到非表單用的 radio,例如 PIN 解鎖區的) */
function enableRadioToggleClear(){
  var mc = document.getElementById('main-content');
  if(!mc) return;
  mc.querySelectorAll('input[type="radio"][data-key]').forEach(function(r){
    if(r.getAttribute('data-toggle-clear-armed')==='1') return;
    r.setAttribute('data-toggle-clear-armed','1');
    // mousedown 觸發時記住「點之前是否已 checked」,因為 click handler 跑時 radio 已被選中,
    // 無法分辨「原本就選中還是這次點才選中」
    r.addEventListener('mousedown', function(){
      r.setAttribute('data-was-checked', r.checked?'1':'0');
    }, true);
    // click 觸發時若「點之前已 checked」 → 視為使用者要取消,unchecked 並清除資料
    r.addEventListener('click', function(ev){
      if(r.getAttribute('data-was-checked')!=='1') return;
      // 取消選中
      r.checked = false;
      // 取消所有同 name 的 radio(理論上其他本來就沒選,但保險)
      var name = r.getAttribute('name');
      if(name){
        document.getElementsByName(name).forEach(function(other){
          if(other.type==='radio') other.checked = false;
        });
      }
      // 清除資料:從 APP.formData 與 localStorage 草稿刪掉這個 key
      var key = r.getAttribute('data-key');
      var fid = r.getAttribute('data-fid') || (APP.currentFormId||'');
      if(key && fid){
        var bareId = fid.indexOf('_')>=0 ? fid.split('_')[0] : fid;
        var targetKey = (typeof getCanonicalKey==='function')
          ? getCanonicalKey(bareId)
          : (APP.currentStudentId ? bareId+'_'+APP.currentStudentId : bareId);
        if(APP.formData[targetKey]) delete APP.formData[targetKey][key];
        // 順便清掉裸 id 殘留
        if(APP.formData[bareId]) delete APP.formData[bareId][key];
        try{
          var drafts = JSON.parse(localStorage.getItem('form_drafts')||'{}');
          if(drafts[targetKey]) delete drafts[targetKey][key];
          if(drafts[bareId]) delete drafts[bareId][key];
          localStorage.setItem('form_drafts', JSON.stringify(drafts));
        }catch(e){}
        // ★ 標記為「已刪除」,避免下次從雲端拉回時復活
        if(typeof markFieldDeleted==='function') markFieldDeleted(targetKey, key);
        // 觸發自動儲存,讓「清除」也能同步到雲端
        if(typeof updateFormProgress==='function'){try{updateFormProgress();}catch(e){}}
        if(typeof scheduleAutoSave === 'function') scheduleAutoSave(bareId);
        // ★ 若有對應的「即時重算」函式,清除後也要重算(F16 分數、360 度分數等)
        try{
          if(key.indexOf('f16_q_')===0 && typeof calcF16AndRender==='function'){
            calcF16AndRender(fid);
          }
          if(key.indexOf('f07_')===0 && typeof calc360Score==='function'){
            calc360Score(fid);
          }
        }catch(e){ console.warn('post-clear recalc failed:', e); }
      }
      // toast 提示
      try{ toast('✓ 已清除此選擇'); }catch(e){}
    }, true);
  });
}

/* ═══════════ 老師端:學生欄位唯讀(v19.5 由 B 方案「點擊提醒」升級)═══════════
 * v19.4 以前:老師點學生欄位會跳 confirm,按確定就能改。
 * v19.5 起  :直接唯讀,老師看得到內容但改不了。
 *
 * 為什麼要升級:v19.5 修好了「清空的欄位刪不掉」——在那之前,老師就算把學生
 * 填的內容刪光也存不進雲端(等於有個意外的保護網);修好之後刪除會真的生效,
 * 所以必須把「老師能不能改學生欄位」這件事講清楚。
 *
 * ⚠ 只對 currentRole==='teacher' 生效。管理員維持完整編輯權限,
 *   需要代為修正資料時請用管理員帳號。
 * 對稱於 lockTeacherFields:學生不能改老師區、老師也不能改學生區。 */
function lockStudentFields(){
  // 【權限】只有老師生效(學生/管理員不需此保護)
  if(APP.currentRole!=='teacher') return;
  var mc=document.getElementById('main-content');
  if(!mc)return;

  // ★ 依當前表單做欄位豁免:某些表單的「基本資料區」應視為老師欄位(EPA 是老師主導評核)
  //   EPA 表單(E01/E02/E03):s_name、school、s_date、s_date_start、s_date_end、intern_cat 不守護
  var currentFid = APP.currentFormId || '';
  var currentBare = currentFid.indexOf('_')>=0 ? currentFid.split('_')[0] : currentFid;

  // ★★★ F15 實習課程評值表:已恢復守護機制 ★★★
  //   原本擔心老師點評分按鈕會誤觸「修改學生欄位?」警示,所以整張表跳過守護。
  //   但實際上所有評分按鈕(r-btn / d-btn / radio)都已標記 data-teacher="1",
  //   守護函式內 isExplicitTeacherElement() 會先檢查白名單豁免,
  //   評分按鈕不會被攔截。整表跳過反而導致 13 個學生欄位失去保護:
  //     - 基本資料(s_name / school / s_date / intern_cat)
  //     - 請假紀錄(leave_pub / leave_sick / leave_priv / late_cnt)
  //     - 自我評語(s_comment)
  //     - 個人反思(reflect_learn / reflect_challenge / reflect_improve / reflect_goal)
  //     - 學生簽名日期(s_sign_date)
  //   老師可不經警示直接覆蓋學生內容,違反「對稱保護」設計原則。
  //   故移除整表豁免,讓守護機制正常運作。
  // if(currentBare==='F15') return;  ← 已停用,改由欄位級別判斷

  var EPA_EXEMPT_KEYS = ['s_name','school','s_date','s_date_start','s_date_end','intern_cat'];
  var isEPAForm = (currentBare==='E01'||currentBare==='E02'||currentBare==='E03');
  function isExemptForCurrentForm(key){
    if(isEPAForm && EPA_EXEMPT_KEYS.indexOf(key)>=0) return true;
    return false;
  }

  // ★ 強防護:任何元素若標記為 data-teacher="1",或它的 data-key/data-rkey 屬於老師欄位白名單,
  //   一律視為老師欄位,絕對不掛守護(避免老師被自己該填的欄位擋下來)
  function isExplicitTeacherElement(el){
    if(el.getAttribute('data-teacher')==='1') return true;
    // ★ FIX v19.5：renderForm 會預先替所有「明確的老師元素」蓋上這個標記，
    //   一併認可，確保老師欄位絕不會被誤鎖成唯讀。
    if(el.getAttribute('data-student-confirmed')==='1') return true;
    var k = el.getAttribute('data-key') || el.getAttribute('data-rkey') || '';
    if(k && typeof isTeacherFieldKey==='function' && isTeacherFieldKey(k)) return true;
    return false;
  }

  // 對所有 data-key 是學生欄位的 input/textarea/select 加上 confirm 攔截
  mc.querySelectorAll('input[data-key],textarea[data-key],select[data-key]').forEach(function(el){
    var key=el.getAttribute('data-key')||'';
    if(!isStudentFieldKey(key)) return;
    if(isExemptForCurrentForm(key)) return; // EPA 等表單的基本資料豁免
    if(isExplicitTeacherElement(el)) return; // ★ 元素明確標記為老師欄位 → 不守護
    // 跳過已經 readonly 的欄位(例如學生姓名自動帶入,本身就唯讀)
    if(el.hasAttribute('readonly')) return;
    // 跳過已經處理過的欄位(避免重複綁定)
    if(el.getAttribute('data-student-guarded')==='1') return;
    el.setAttribute('data-student-guarded','1');

    // ★ radio / checkbox 需要特別處理:
    //   (1) 視覺提示要套在外層 label(因為 radio 本身的 border-left 看不出來)
    //   (2) 攔截要同時掛 mousedown + click,因為點 label 時可能繞過 mousedown
    /* ★★★ FIX v19.5：改為「唯讀」(原本是 B 方案：點擊跳 confirm) ★★★
       原因：v19.5 修好「清空欄位存不掉」之後，老師若真的把學生欄位清空，
       這次會真的同步刪除雲端資料。既然老師本來就不該改學生填的內容，
       乾脆從源頭擋掉，比事後跳確認框更安全。
       ── 文字類用 readonly：內容看得到、選得到、可捲動（個案報告很長）
       ── 選項類用 disabled：readonly 對 select / radio / checkbox 無效
       ── disabled 的欄位不會被 saveForm 的 DOM 蒐集掃到，也就不可能產生
          刪除墓碑，學生資料因此雙重保險。
       ⚠ 管理員不受影響（函式開頭已限定 currentRole==='teacher' 才執行）。 */
    var isRadioOrCheckbox = (el.type==='radio' || el.type==='checkbox');
    var isSelectOrDate = (el.tagName==='SELECT' || el.type==='date');
    var _roTip = '🔒 此欄位由學生填寫，老師端唯讀';

    if(isRadioOrCheckbox || isSelectOrDate){
      // readonly 對這幾種控制項無效 → 用 disabled
      el.disabled = true;
      el.title = _roTip;
      var parentLabel = el.closest('label');
      if(parentLabel && !parentLabel.hasAttribute('data-student-label-styled')){
        parentLabel.setAttribute('data-student-label-styled','1');
        parentLabel.style.borderLeft = '3px solid #3B82F6';
        parentLabel.style.background = 'rgba(59,130,246,0.06)';
        parentLabel.style.paddingLeft = '6px';
        parentLabel.style.borderRadius = '4px';
        parentLabel.title = _roTip;
      }
      if(isSelectOrDate){
        el.style.borderLeft = '3px solid #3B82F6';
        el.style.background = 'var(--cream)';
      }
    } else {
      // text / number / textarea：用 readonly，老師仍可選取複製內容
      el.readOnly = true;
      el.title = _roTip;
      el.style.borderLeft = '3px solid #3B82F6';
      el.style.background = 'var(--cream)';
      el.style.cursor = 'default';
      // readonly 仍可 focus；點下去給個提示，避免老師以為系統壞了
      el.addEventListener('focus', _studentFieldReadOnlyHint, true);
      el.addEventListener('click', _studentFieldReadOnlyHint, true);
    }
  });

  // 對學生欄位的 button(評分按鈕等)也加守護
  // ★ 嚴格條件:必須有 data-student="1" 而且 沒有 data-teacher="1"(防止屬性互衝)
  mc.querySelectorAll('button[data-student="1"]').forEach(function(btn){
    if(btn.getAttribute('data-teacher')==='1') return; // 同時有 teacher 標記 → 視為老師欄位,跳過
    var rkey = btn.getAttribute('data-rkey') || btn.getAttribute('data-key') || '';
    if(rkey && typeof isTeacherFieldKey==='function' && isTeacherFieldKey(rkey)) return; // 白名單豁免
    if(btn.getAttribute('data-student-confirmed')==='1') return;  // ★ FIX v19.5 保險
    if(btn.getAttribute('data-student-guarded')==='1') return;
    btn.setAttribute('data-student-guarded','1');
    /* ★ FIX v19.5：改為完全不可點（原本是點擊跳 confirm）。
       不用 disabled 屬性，是為了保留原本的選中／未選中配色，
       老師仍看得出學生選了哪一格。 */
    btn.style.borderLeft = '3px solid #3B82F6';
    btn.style.cursor = 'not-allowed';
    btn.style.opacity = '0.85';
    btn.title = '🔒 此為學生填寫的欄位，老師端唯讀';
    btn.addEventListener('click', _studentFieldReadOnlyBlock, true);
    btn.addEventListener('mousedown', _studentFieldReadOnlyBlock, true);
  });
}

/* ★ FIX v19.5：老師點到唯讀的學生欄位時給個提示，避免以為系統壞掉 */
var _studentRoHintAt = 0;
function _studentFieldReadOnlyHint(){
  var now = Date.now();
  if(now - _studentRoHintAt < 2500) return;   // 防抖，避免連續跳
  _studentRoHintAt = now;
  try{ toast('🔒 此欄位由學生填寫，老師端為唯讀'); }catch(e){}
}
function _studentFieldReadOnlyBlock(ev){
  ev.preventDefault();
  ev.stopPropagation();
  if(typeof ev.stopImmediatePropagation==='function') ev.stopImmediatePropagation();
  _studentFieldReadOnlyHint();
}

/* mousedown / click 守護:阻止互動 → 跳 confirm → 確認後解除該元素守護 */
function _studentFieldGuardHandler(ev){
  var el = ev.currentTarget;
  // ★ 終極保險:如果該元素其實是老師欄位(後來才被標記),直接放行
  //   (避免任何意外:元素的 data-teacher 屬性、或 data-rkey 對應老師白名單)
  if(el.getAttribute('data-teacher')==='1') return;
  var _k = el.getAttribute('data-key') || el.getAttribute('data-rkey') || '';
  if(_k && typeof isTeacherFieldKey==='function' && isTeacherFieldKey(_k)) return;
  // 已確認過 → 直接放行(讓 click 走完原本流程)
  if(el.getAttribute('data-student-confirmed')==='1') return;
  // 未確認 → 阻止 + 跳 confirm
  ev.preventDefault();
  ev.stopPropagation();
  // click 還會跑 — 也要阻止後續同事件繼續觸發
  if(typeof ev.stopImmediatePropagation==='function') ev.stopImmediatePropagation();
  // 取得具體欄位名稱(從 data-key 對應 FIELD_LABELS,找不到時用 key 原文)
  var _key = el.getAttribute('data-key') || '';
  var _fieldName = (typeof FIELD_LABELS!=='undefined' && FIELD_LABELS[_key])
    ? FIELD_LABELS[_key] : _key;
  var msg = '⚠ 修改學生欄位?\n\n' +
            '您正要修改:' + (_fieldName||'學生欄位') + '\n\n' +
            '此欄位由學生填寫。如果您不是要協助補填,請按取消。\n\n' +
            '確定要修改嗎?';
  if(confirm(msg)){
    // 確認 → 標記此元素已通過,移除所有攔截 handler
    el.setAttribute('data-student-confirmed','1');
    el.removeEventListener('mousedown', _studentFieldGuardHandler, true);
    el.removeEventListener('click', _studentFieldGuardHandler, true);
    el.removeEventListener('keydown', _studentFieldGuardKeyHandler, true);
    el.removeEventListener('focus', _studentFieldGuardFocusHandler, true);
    // 視覺提示:邊條變橘色(表示已解除守護,正在編輯)
    el.style.borderLeft = '3px solid #F59E0B';
    el.title = '⚠ 已解除守護;您正在修改學生欄位';
    // 同步把外層 label 的視覺也改色(radio/checkbox 用)
    var pl = el.closest('label');
    if(pl && pl.hasAttribute('data-student-label-styled')){
      pl.style.borderLeft = '3px solid #F59E0B';
      pl.style.background = 'rgba(245,158,11,0.08)';
    }
    // radio/checkbox:確認後使用者通常還要再點一次才會選中(因為當下這次點擊已被攔)
    //   給個 toast 提醒,避免使用者以為點了沒反應
    if(el.type==='radio' || el.type==='checkbox'){
      try{ toast('✓ 已解除守護,請再點一次以選中'); }catch(e){}
    } else {
      // 立即聚焦讓使用者開始編輯(text/textarea/select)
      setTimeout(function(){ try{ el.focus(); }catch(e){} }, 0);
    }
  }
  // 取消 → 不做任何事,保留守護(下次點到還會跳)
}

/* keydown 守護:防止 tab 鍵盤聚焦後直接打字 */
function _studentFieldGuardKeyHandler(ev){
  var el = ev.currentTarget;
  if(el.getAttribute('data-student-confirmed')==='1') return;
  // 允許 tab/shift-tab 跳到下一個欄位(不算編輯)
  if(ev.key === 'Tab') return;
  ev.preventDefault();
  ev.stopPropagation();
  // 第一次按鍵 → 跳 confirm(透過 mousedown handler 邏輯)
  _studentFieldGuardHandler(ev);
}

/* focus 守護:程式化 focus 時也要攔截 */
function _studentFieldGuardFocusHandler(ev){
  var el = ev.currentTarget;
  if(el.getAttribute('data-student-confirmed')==='1') return;
  // focus 不攔截(允許看內容),但會在第一次 mousedown/keydown 觸發 confirm
  // 這個 handler 只是預留,目前不做事
}

/* ═══════════ 老師端必填檢查工具 ═══════════
 * 回傳：當前表單(指定 formId)裡,「老師應填」但「尚未填」的欄位 label 陣列
 *  - 老師應填欄位 = REQUIRED_STUDENT_FIELDS[formId] 扣掉 STUDENT_FIELDS_KEY 之後的剩餘
 *  - 兩個虛擬必填(__sc_any、__prof_any、__team_first)不在此檢查範圍(由 getStatus 另外處理)
 *  - 簽名、簽名日期等也包含在內(這些通常是 t_sign / t_sign_date)
 *  - 資料來源:APP.formData[formKey] 與 localStorage 草稿合併取非空值 */

/* 判斷某表單「定義上」是否含有老師必填欄位
 * - F-PRE / F-POST / F-CT01~12 純筆試類表單,完全沒有老師欄位 → 回 false
 * - F16 學習風格自評,roles='student',也沒有老師欄位 → 回 false
 * - F01A 學前評值,roles='student',沒有老師欄位 → 回 false
 * - 其餘 roles='both' 的表單,通常至少有 t_sign / t_sign_date → 回 true */
function formHasTeacherRequiredFields(formId){
  var f=findForm(formId);
  if(!f) return false;
  // roles='student':純學生表單,不需要老師填
  if(f.roles==='student') return false;
  // roles='both' 一律視為「需要老師簽名」,即使 REQUIRED 名單沒列 t_sign
  if(f.roles==='both') return true;
  // 其他情況看 REQUIRED 名單是否含有「真正的老師欄位」(扣掉學生與中性欄位)
  var req=(typeof REQUIRED_STUDENT_FIELDS!=='undefined'&&REQUIRED_STUDENT_FIELDS[formId])
    ? REQUIRED_STUDENT_FIELDS[formId] : [];
  return req.some(function(k){
    if(!k||k.indexOf('__')===0) return false;
    return !isStudentOrNeutralFieldKey(k);
  });
}

function getTeacherMissingFields(formId){
  var req=(typeof REQUIRED_STUDENT_FIELDS!=='undefined'&&REQUIRED_STUDENT_FIELDS[formId])
    ? REQUIRED_STUDENT_FIELDS[formId].slice() : [];
  var f=findForm(formId);
  // roles='both' 的表單若 req 沒列 t_sign,額外要求
  if(f&&f.roles==='both'&&req.indexOf('t_sign')<0) req.push('t_sign');

  // 過濾出「真正的老師必填項」:扣掉學生欄位、中性欄位、虛擬欄位
  var teacherReq=req.filter(function(k){
    if(!k) return false;
    if(k.indexOf('__')===0) return false; // 虛擬必填
    return !isStudentOrNeutralFieldKey(k);
  });
  if(teacherReq.length===0) return [];

  // 讀取當前學生 formKey 的合併資料(formData + localStorage 草稿)
  var formKey=getFormKey(formId);
  var d={};
  function mergeReadOnly(dest, src){
    if(!src) return;
    Object.keys(src).forEach(function(k){
      var v=src[k];
      if(v===''||v===null||v===undefined||v===false) return;
      if(dest[k]===''||dest[k]===null||dest[k]===undefined||dest[k]===false){
        dest[k]=v;
      }
    });
  }
  mergeReadOnly(d, APP.formData[formKey]||{});
  if(formKey!==formId) mergeReadOnly(d, APP.formData[formId]||{});
  try{
    var allDrafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    mergeReadOnly(d, allDrafts[formKey]||{});
    if(formKey!==formId) mergeReadOnly(d, allDrafts[formId]||{});
  }catch(e){}

  function hasRealVal(v){
    if(v===undefined||v===null||v===false) return false;
    var s = String(v).trim();
    if(s==='') return false;
    if(s==='[]' || s==='{}' || s==='null') return false;
    return true;
  }
  function checkField(k){
    var v=d[k];
    if(!hasRealVal(v)) return false;
    // 簽名:不可為佔位文字
    if(k==='t_sign'||k==='t_sign2'||k==='host_sign'){
      var sv=String(v).trim();
      return sv!==''&&sv!=='請選擇老師'&&sv!=='請選擇臨床老師'
        &&sv!=='請選擇實習總指導教師'&&sv!=='請選擇指導老師'&&sv!=='請選擇主持人';
    }
    if(k==='t_sign_date'||k==='t_sign2_date'||k==='host_sign_date'||k==='host_date'||k==='follow_date'){
      return String(v).trim().length>=8;
    }
    return true;
  }

  // 友善欄位名稱
  function labelOf(k){
    if(typeof FIELD_LABELS!=='undefined'&&FIELD_LABELS[k]) return FIELD_LABELS[k];
    // DOPS 評核項目:D04_i1 → DOPS 評核項目 1
    var dm=k.match(/^(D\d+)_i(\d+)$/);
    if(dm) return 'DOPS 評核項目 '+dm[2];
    // F14 個案報告 PPT 評分:f14_sc_0 → PPT 評分項目 1
    if(k.indexOf('f14_sc_')===0) return 'PPT 評分項目 '+(parseInt(k.slice(7),10)+1);
    // F01B 指導者評核:f01_p1_0 → 核心技能評核 1
    if(k.indexOf('f01_p1_')===0) return '核心技能評核 '+(parseInt(k.slice(7),10)+1);
    // F01A 學前評值:f01_pre_X → 學前自評項目 N+1
    if(k.indexOf('f01_pre_')===0) return '學前自評項目 '+(parseInt(k.slice(8),10)+1);
    // F01B 學生自評:f01_post_X → 學後自評項目 N+1
    if(k.indexOf('f01_post_')===0) return '學後自評項目 '+(parseInt(k.slice(9),10)+1);
    // EPA 臨床情境(老師勾選):e01_sc → EPA 臨床情境
    if(k.indexOf('e01_sc')===0||k.indexOf('e02_sc')===0||k.indexOf('e03_sc')===0) return 'EPA 臨床情境';
    // F0X 系列:f04_0、f06_3、f07_5 → 評估項目 N+1
    var fm=k.match(/^f(\d+)_(\d+)$/);
    if(fm) return '評估項目 '+(parseInt(fm[2],10)+1);
    // F15 細項
    if(k.indexOf('f15_att_')===0) return '態度評核 '+(parseInt(k.slice(8),10)+1);
    if(k.indexOf('f15_skl_')===0) return '技能評核 '+(parseInt(k.slice(8),10)+1);
    if(k.indexOf('f15_com_')===0) return '溝通評核 '+(parseInt(k.slice(8),10)+1);
    if(k==='t_need_improve') return '建議應補強項目';
    if(k==='t_overall') return '綜合意見';
    return k;
  }

  var missing=[];
  teacherReq.forEach(function(k){
    if(!checkField(k)) missing.push(labelOf(k));
  });
  // 去重(label 可能重複,例如 D04_i1 都會回傳「DOPS 評核項目 1」)
  var seen={};
  return missing.filter(function(x){ if(seen[x]) return false; seen[x]=true; return true; });
}

/* 判斷:老師此刻是否「已動筆」當前表單(即至少填了某個老師欄位)
 * 用途:跳轉/返回總覽時,只有「已動筆但未填完」才警示;完全空白(只是點進來看)就放行 */
function teacherHasStartedForm(formId){
  if(APP.currentRole!=='teacher') return false;
  var formKey=getFormKey(formId);
  var d=Object.assign({}, APP.formData[formId]||{}, APP.formData[formKey]||{});
  // 任何「真正的老師欄位」且有實質值 → 視為已動筆
  return Object.keys(d).some(function(k){
    if(isStudentOrNeutralFieldKey(k)) return false;
    if(k.indexOf('__')===0) return false;
    if(k==='intern_cat'||k==='order') return false; // 系統自動帶入,不算動筆
    var v=d[k];
    return v!==undefined&&v!==null&&v!==false&&String(v).trim()!=='';
  });
}

/* 在跳轉前檢查老師必填:只要該表單「定義上有」老師必填欄位,且尚未填完,就跳警示
 * 回傳 true 表示「可繼續跳轉」,false 表示「使用者選擇留下」
 * 注意:不再要求「老師已動筆」才警示——只要這份表單需要老師填、而且還沒填完,就要提醒,
 * 避免老師不小心點到某張需要評核的表單但忘了填就離開。 */
function teacherConfirmLeaveIfIncomplete(formId){
  if(APP.currentRole!=='teacher') return true;
  if(!formId) return true;
  // 該表單定義上沒有老師需要填的欄位(例如 F-PRE / F-CT01~12 / F16 等) → 不警示
  if(!formHasTeacherRequiredFields(formId)) return true;
  var missing=getTeacherMissingFields(formId);
  if(missing.length===0) return true;
  var f=findForm(formId);
  var fname=f?(f.name||formId):formId;
  var preview=missing.slice(0,8).join('、');
  if(missing.length>8) preview+=' ...等 '+missing.length+' 項';
  var msg='⚠ 老師必填欄位尚未完成\n\n'+
          '表單:'+fname+'\n'+
          '未填欄位('+missing.length+'):'+preview+'\n\n'+
          '✅ 您剛剛填寫的內容會自動保留為草稿,下次回到此表單仍能繼續編輯。\n'+
          '⚠ 但表單尚未完成,建議補齊未填欄位後按「儲存表單」正式送出。\n\n'+
          '是否仍要離開?';
  return confirm(msg);
}

/* ═══════════ 老師端:student-only 表單(F16 等)整表警示 ═══════════
 * 設計理念:
 *  - F16 學習風格、F-PRE/POST 筆試、F-CT01~12 課後測驗:整張都是學生欄位
 *  - 對每個欄位都跳 confirm 會非常擾人(F16 有 70 題、課後測驗 10 題)
 *  - 所以改成「整張表第一次互動時跳一次提醒」,確認後就放行
 *  - 不放行則所有編輯動作都被吃掉
 *  - 標記放在 mc 上,離開表單(重新 openForm)會自動失效,符合「一個訪問週期一次」 */
function disarmStudentOnlyTeacherWarning(){
  // 移除前一次 armStudentOnlyTeacherWarning 所掛上的 listeners,避免跨表殘留
  // (修 bug:離開 student-only 表進到 'both' 表時,舊 listener 仍會用舊 formId 跳警示)
  var mc=document.getElementById('main-content');
  if(!mc) return;
  if(mc._studentOnlyWarnMouse){
    mc.removeEventListener('mousedown', mc._studentOnlyWarnMouse, true);
    mc._studentOnlyWarnMouse=null;
  }
  if(mc._studentOnlyWarnKey){
    mc.removeEventListener('keydown', mc._studentOnlyWarnKey, true);
    mc._studentOnlyWarnKey=null;
  }
  mc.removeAttribute('data-student-only-warn-form');
  mc.removeAttribute('data-student-only-warn-shown');
}

function armStudentOnlyTeacherWarning(formId){
  if(APP.currentRole!=='teacher') return;
  var mc=document.getElementById('main-content');
  if(!mc) return;
  // 先解除上一次的 listener,避免「進過 F16 後再進別張 both 表單也跳警示」
  disarmStudentOnlyTeacherWarning();
  // 同一個表單的同一次訪問內,只跳一次
  mc.setAttribute('data-student-only-warn-form', formId);
  mc.setAttribute('data-student-only-warn-shown', '0');

  /* 判斷:此元素是否為「真的會修改表單資料」的學生欄位元素
   * 必須同時符合:
   *  (1) 是 input / textarea / select / button
   *  (2) 帶有 data-key / data-rkey(代表它是表單欄位,不是頁面導覽按鈕)
   *  (3) 不是「返回總覽」、「儲存表單」、PDF、同步等「動作按鈕」
   *      → 沒 data-key/data-rkey 一律當動作按鈕看待,放行
   * 這樣可以避免老師按「返回總覽」也被攔截。 */
  function isFormFieldElement(el){
    if(!el) return false;
    var tag=(el.tagName||'').toLowerCase();
    if(tag!=='input'&&tag!=='textarea'&&tag!=='select'&&tag!=='button') return false;
    // 必須帶有 data-key 或 data-rkey,代表它是表單欄位(非動作按鈕/導覽連結)
    var hasKey=el.hasAttribute('data-key')||el.hasAttribute('data-rkey');
    return hasKey;
  }

  // 攔截整個 main-content 的 mousedown(capture 階段) — 任何「表單欄位元素」第一次互動才跳警示
  function handler(ev){
    // 若已通過警示 → 直接放行
    if(mc.getAttribute('data-student-only-warn-shown')==='1') return;
    // 防呆:若當前 form 已不是 arm 時的那張(使用者已切走),直接 disarm 並放行
    if(mc.getAttribute('data-student-only-warn-form')!==formId){
      disarmStudentOnlyTeacherWarning();
      return;
    }
    var target=ev.target;
    if(!target) return;
    // 找最近的「表單欄位元素」;若點到的是按鈕內 <span> 等,往上找
    var formEl=isFormFieldElement(target)
      ? target
      : (target.closest&&target.closest('input[data-key],textarea[data-key],select[data-key],button[data-key],button[data-rkey]'));
    if(!formEl) return; // 不是表單欄位 → 放行(例如:返回總覽、儲存、PDF、同步等按鈕)
    ev.preventDefault();
    ev.stopPropagation();
    // 動態取得當前表單名稱(避免硬編碼導致表單與訊息不符)
    var _f = (typeof findForm==='function') ? findForm(formId) : null;
    var _fname = _f ? _f.name : formId;
    var msg='⚠ 提醒:這是學生填寫的表單\n\n'+
            '「'+_fname+'」應由學生本人填寫,\n'+
            '老師通常只負責檢視結果,不應代為填寫。\n\n'+
            '若您確定要繼續(例如協助學生補填),請按「確定」;\n'+
            '若只是查看不要填寫,請按「取消」(下次點到學生欄位仍會再次提醒)。';
    if(confirm(msg)){
      // ★ 按「確定」 → 標記警示已通過,解除監聽,後續操作放行
      mc.setAttribute('data-student-only-warn-shown','1');
      disarmStudentOnlyTeacherWarning();
    }
    // ★ 按「取消」 → 保留監聽,下次點到學生欄位還會跳警示
    //   (老師不該代填學生欄位,所以重複提醒是合理的)
  }
  function keyHandler(ev){
    if(mc.getAttribute('data-student-only-warn-shown')==='1') return;
    if(mc.getAttribute('data-student-only-warn-form')!==formId){
      disarmStudentOnlyTeacherWarning();
      return;
    }
    var target=ev.target;
    if(!target) return;
    if(!isFormFieldElement(target)) return; // 非表單欄位 → 放行
    // 允許 Tab 鍵跳轉
    if(ev.key==='Tab') return;
    ev.preventDefault();
    ev.stopPropagation();
    handler({target:target, preventDefault:function(){}, stopPropagation:function(){}});
  }
  // 存到 mc 屬性上,下次 disarm 時可移除
  mc._studentOnlyWarnMouse=handler;
  mc._studentOnlyWarnKey=keyHandler;
  mc.addEventListener('mousedown', handler, true);
  mc.addEventListener('keydown', keyHandler, true);
}

/* ═══════════ SAVE ═══════════ */
function saveForm(id, silent){
  // silent=true:背景自動儲存(來自 autoSave 或跳轉 flush),不跳任何 confirm
  // ★ 取消 pending 的自動儲存計時器（避免重複儲存）
  if(typeof _autoSaveTimers !== 'undefined' && _autoSaveTimers[id]){
    clearTimeout(_autoSaveTimers[id]);
    delete _autoSaveTimers[id];
  }
  // ★ F15 「實習課程總評值」屬於最終評核,儲存前彈窗確認
  // (僅老師端適用 — F15 由老師填寫;silent 模式跳過)
  if(id==='F15' && APP.currentRole==='teacher' && !silent){
    var f15Confirm = '您正在儲存「實習課程總評值」 — 這份是學生的最終評核表。\n\n請再次確認您填寫的分數與評語無誤。\n資料儲存後仍可返回修改,但建議盡量一次填妥再儲存。\n\n是否確認儲存?';
    if(!confirm(f15Confirm)) return;
  }
  // 【安全】登入身分驗證:必須有有效的 currentRole
  if(!APP.currentRole){
    toast('⚠ 請先登入');
    return;
  }
  // 【安全】學生只能儲存自己的表單
  if(APP.currentRole==='student'){
    if(!APP.currentUser||!APP.currentUser.sid){
      toast('⚠ 帳號狀態異常，請重新登入');
      return;
    }
    // 確保即將寫入的 formKey 含學生本人的學號
    const expectedKey = id+'_'+APP.currentUser.sid;
    const actualKey = getFormKey(id);
    if(actualKey !== expectedKey){
      toast('⚠ 身分驗證失敗，無法儲存他人表單');
      console.warn('saveForm blocked: expected', expectedKey, 'got', actualKey);
      return;
    }
  }
  // 【安全】老師需要選定學生
  if(APP.currentRole==='teacher' && !APP.currentStudentId){
    toast('⚠ 請先選擇要評核的學生');
    return;
  }
  const formKey = getFormKey(id);
  // Collect all inputs (only editable fields for current role)
  if(!APP.formData[formKey])APP.formData[formKey]={};
  // ★ 若裸 id 有資料(舊版殘留或 f01Click 寫入),「只在 formKey 沒值時補上」,
  //   絕對不可 Object.assign 強覆蓋——裸 id 可能含有「上一位學生」的污染資料,
  //   會把當前學生的 s_sign / s_name 等改成別人的名字。
  if(id!==formKey && APP.formData[id]){
    Object.keys(APP.formData[id]).forEach(function(k){
      var v=APP.formData[id][k];
      if(v===''||v===null||v===undefined||v===false) return;
      var tv=APP.formData[formKey][k];
      if(tv===''||tv===null||tv===undefined||tv===false){
        APP.formData[formKey][k]=v;
      }
    });
  }
  // 也從草稿合併
  try{
    var saveDrafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    [id,formKey].forEach(function(k){
      if(saveDrafts[k]){
        Object.keys(saveDrafts[k]).forEach(function(dk){
          var dv=saveDrafts[k][dk];
          if(dv!==''&&dv!==null&&dv!==undefined)APP.formData[formKey][dk]=dv;
        });
      }
    });
  }catch(e){}

  /* ★ FIX v19.5：上面兩段合併都是「target 為空就補值」，
     使用者剛剛清空的欄位在 formKey 是空的，會被裸 id / 舊草稿的舊值補回來。
     這裡把「已登記刪除」的 key 再清一次，確保清空動作不會在存檔途中被撤銷。 */
  function _purgeDeletedKeys(){
    if(typeof getDeletedKeysFor!=='function') return;
    try{
      getDeletedKeysFor(formKey).forEach(function(k){
        if(APP.formData[formKey]) delete APP.formData[formKey][k];
        if(id!==formKey && APP.formData[id]) delete APP.formData[id][k];
      });
    }catch(e){}
  }
  _purgeDeletedKeys();
  // 收集所有可見欄位（用 id 或 formKey 都接受）
  document.querySelectorAll('[data-fid][data-key]').forEach(function(el){
    if(!el.disabled){
      var elFid=el.getAttribute('data-fid');
      if(elFid===id||elFid===formKey){
        var key=el.dataset.key||'';
        if(key.endsWith('_start')||key.endsWith('_end')) return; // 由下面統一處理
        // ★ Radio button 特殊處理：只有 checked 的 radio 才採用其值；
        //   未 checked 的 radio 一律跳過，避免 '是'/'否' 被覆寫成 'on' 或被相鄰選項覆蓋
        if(el.type==='radio'){
          if(el.checked){
            var rv=el.getAttribute('value');
            // 若未設定 value 屬性，從 onchange handler 字串裡取（如 saveDraftField('fid','key','是') 抓出最後一個參數）
            if(rv===null||rv===''||rv==='on'){
              var oc=el.getAttribute('onchange')||'';
              var m=oc.match(/['"]([^'"]+)['"]\s*\)\s*$/);
              if(m) rv=m[1];
            }
            if(rv!==null&&rv!==''&&rv!=='on') APP.formData[formKey][key]=rv;
          }
          return; // 不論 checked 與否，radio 一律不執行下面的通用流程
        }
        var v=el.type==='checkbox'?el.checked:el.value;
        if(v!==''&&v!==null) APP.formData[formKey][key]=v;
      }
    }
  });
  // 明確收集日期區間欄位（drs_*_s / drs_*_e）
  document.querySelectorAll('input[id^="drs_"]').forEach(function(el){
    var elId=el.id; // e.g. drs_F04M_P145023_s_date_s
    var suffix=elId.slice(-1); // 's' or 'e'
    if(suffix!=='s') return;
    var eEl=document.getElementById(elId.slice(0,-1)+'e');
    var s=el.value, e=eEl?eEl.value:'';
    if(!s&&!e) return;
    var r=(s?s.replace(/-/g,'/'):'')+(s&&e?' - ':s||e?' - ':'')+(e?e.replace(/-/g,'/'):'');
    var elFid=el.getAttribute('data-fid');
    var dataKey=el.getAttribute('data-key'); // e.g. s_date_start
    if(!elFid||!dataKey) return;
    var baseKey=dataKey.replace('_start','');
    if(elFid===id||elFid===formKey){
      APP.formData[formKey][baseKey]=r;
    }
  });
  // 同時儲存到 localStorage 草稿
  try{
    _purgeDeletedKeys();   // ★ FIX v19.5：快照前再清一次，草稿才不會留下已刪的欄位
    var draftSave=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    draftSave[formKey]=Object.assign({},APP.formData[formKey]);
    localStorage.setItem('form_drafts',JSON.stringify(draftSave));
  }catch(e){}
  // Also collect ALL data stored via setRating/setDOPS/setEPA clicks (already in APP.formData[formKey])
  // These are stored directly, no need to re-collect from DOM
  // But ensure formKey data is synced
  // ★ 若裸 id 還有殘留(例如 f01Click 寫入過舊版),用「非空值補空」方式合併,
  //   不強覆蓋當前學生 formKey 的資料,避免別人的資料倒灌進來。
  if(APP.formData[id] && Object.keys(APP.formData[id]).length>0){
    if(!APP.formData[formKey])APP.formData[formKey]={};
    Object.keys(APP.formData[id]).forEach(function(k){
      var v=APP.formData[id][k];
      if(v===''||v===null||v===undefined||v===false) return;
      var tv=APP.formData[formKey][k];
      if(tv===''||tv===null||tv===undefined||tv===false){
        APP.formData[formKey][k]=v;
      }
    });
    // ★ 整理完後乾脆清掉裸 id,避免後續再次被掃進來
    if(id!==formKey) delete APP.formData[id];
    _purgeDeletedKeys();   // ★ FIX v19.5：裸 id 補值後再清一次
  }

  // ★★★ 老師端必填欄位檢查:儲存前若有缺漏,跳出警示讓老師選擇 ★★★
  // - 只針對「老師應填但未填」的欄位;學生欄位由學生自己負責
  // - 老師可選擇「仍要儲存」(例如分多次填) 或「取消儲存先回去補」
  // - 該表單若定義上沒有老師必填欄位(例如純筆試 F-PRE / F-CT* / F16) → 不檢查
  // - silent 模式(自動儲存)不跳對話框,直接靜默儲存
  if(!silent && APP.currentRole==='teacher' && formHasTeacherRequiredFields(id)){
    var _form=findForm(id);
    var _missing=getTeacherMissingFields(id);
    if(_missing.length>0){
      var _preview=_missing.slice(0,10).join('、');
      if(_missing.length>10) _preview+=' ...等 '+_missing.length+' 項';
      var _msg='⚠ 老師必填欄位尚未完成\n\n'+
               '表單:'+(_form?_form.name:id)+'\n'+
               '未填欄位('+_missing.length+'):'+_preview+'\n\n'+
               '建議您回到表單填完再儲存,以確保評核資料完整。\n\n'+
               '按「確定」 → 仍儲存目前的部分內容(可日後再回來補)\n'+
               '按「取消」 → 不儲存,回到表單繼續填寫';
      if(!confirm(_msg)) return;
    }
  }

  // Record history - 判斷實際儲存角色
  // 若學生帳號但已解鎖老師欄位（PIN解鎖），儲存兩筆記錄（學生+老師都算完成）
  if(!APP.historyLog[formKey])APP.historyLog[formKey]=[];
  const now = new Date();
  const ts = now.toISOString();
  const effectiveRole = (APP.currentRole==='student' && APP.teacherUnlocked) ? 'both' : APP.currentRole;
  
  if(effectiveRole==='both'){
    // 學生帳號+PIN解鎖：同時記錄學生和老師儲存
    const sEntry={ts,role:'student',roleLabel:'學生',name:APP.currentUser.name};
    const tEntry={ts,role:'teacher',roleLabel:'臨床老師（PIN解鎖）',name:'PIN解鎖'};
    APP.historyLog[formKey].unshift(tEntry);
    APP.historyLog[formKey].unshift(sEntry);
  } else {
    const roleLabel={student:'學生',teacher:'臨床老師',admin:'管理員'}[APP.currentRole];
    const logEntry={ts,role:APP.currentRole,roleLabel,name:APP.currentUser.name};
    APP.historyLog[formKey].unshift(logEntry);
  }

  // Save to shared storage (GAS)
  saveFormToSheets(formKey);

  // 同時把 historyLog 存到 localStorage（確保 getStatus 能讀到）
  try{
    var savedLogs=JSON.parse(localStorage.getItem('history_logs')||'{}');
    savedLogs[formKey]=APP.historyLog[formKey]||[];
    savedLogs[id]=APP.historyLog[formKey]||[];
    localStorage.setItem('history_logs',JSON.stringify(savedLogs));
  }catch(e){}

  // Show saved
  const msg=document.getElementById('saved-msg');
  if(msg){msg.style.display='inline';setTimeout(()=>msg.style.display='none',2500);}

  // Update history display
  const histWrap=document.getElementById('history-wrap');
  if(histWrap)histWrap.innerHTML=buildHistoryItems(formKey);

  // PDF 按鈕：儲存後更新狀態但不自動下載
  const pdfBtn=document.getElementById('btn-pdf');
  if(pdfBtn&&canDownloadPDF(id)){
    pdfBtn.style.display='inline-block';
    pdfBtn.setAttribute('onclick',"checkAndDownloadPDF('"+id+"')");
  }

  // Also upload summary to sheets tab
  uploadToSheets(id);
  // 保留草稿作為備份（不清除，讓使用者隨時可以看到資料）
  // clearDraft(formKey); // 已停用清除草稿
  
  // 儲存後立即鎖回老師欄位（學生帳號一律鎖定，無論有無 PIN）
  if(APP.currentRole==='student'){
    APP.teacherUnlocked=false;
    lockTeacherFields();
    toast('✓ 表單已儲存（老師欄位已鎖定;您可隨時返回此表單修改自己的欄位）');
  } else {
    toast('✓ 表單已儲存(資料已存於本機,送出 Google 同步以備份至雲端)');
  }

  // ★★★ 跨裝置同步：3 秒後從雲端重新拉取，確認資料已同步 ★★★
  setTimeout(async function(){
    try{
      await loadFormFromSheets(id);
      var hw=document.getElementById('history-wrap');
      if(hw && APP.currentFormId===id){
        hw.innerHTML=buildHistoryItems(getFormKey(id));
      }
      renderSidebar();
      updateQuickNav();
    }catch(e){console.warn('儲存後同步確認失敗:',e);}
  }, 3000);

  // 更新進度條
  renderSidebar();
  updateQuickNav();
}

/* ── 將表單資料存到 GAS（共享給所有人） ── */
async function saveFormToSheets(id){
  // id 可能是裸 formId 或 formKey，統一處理
  // saveForm 呼叫時傳的是 formKey（含學號）
  const formKey=id; // saveForm已傳formKey
  // ★ 只用 formKey 的資料上雲;不再 merge 裸 id(裸 id 是跨學生共用空間,
  //   可能含上一位被檢視學生的污染殘留,merge 進來會把錯誤資料推到雲端)
  let mergedData=Object.assign({},APP.formData[formKey]||{});
  /* ★ FIX v19.5：記下這次上傳「實際套用了哪些刪除墓碑」，
     待雲端回報寫入成功後就撤掉它們 —— 墓碑的任務只是「撐到雲端確認刪除為止」，
     留著超過這段時間，反而可能把別台裝置後來填回的值再刪一次。 */
  var _appliedTombstones = [];

  // ★★★【防覆蓋修補 v1.6:送出前先抓雲端現有資料再合併】★★★
  //   根因:任何一方(尤其老師端)儲存時,APP.formData[formKey] 可能只含自己這方的欄位
  //        — 例如老師只有 t_fb / t_sign,缺學生填的 goal / motivation。直接整包上傳後,
  //        後端是「整格覆蓋」,於是另一方先前填的欄位被洗掉 → 學生資料憑空消失。
  //   修法:送出前先讀一次雲端該表單最新 data,用「雲端為底、本次非空值才覆蓋」方式合併,
  //        確保本次沒碰到的欄位(例如學生欄位)一律原封保留,從此不會互相洗掉。
  try{
    var _ctrl = new AbortController();
    var _tid  = setTimeout(function(){ _ctrl.abort(); }, 10000);
    var _u    = GAS_URL + '?action=loadForm&formId=' + encodeURIComponent(formKey) + '&t=' + Date.now();
    var _r    = await fetch(_u, {cache:'no-cache', signal:_ctrl.signal});
    clearTimeout(_tid);
    if(_r.ok){
      var _cloud = await _r.json();
      if(_cloud && _cloud.formData){
        var _cloudData = JSON.parse(_cloud.formData);
        var _m = {};
        // 1) 先鋪上雲端既有的所有欄位(保住另一方填的)
        Object.keys(_cloudData).forEach(function(k){ _m[k] = _cloudData[k]; });
        // 2) 再用本次的「非空值」覆蓋(本方這次真的填/改的欄位才寫進去)
        Object.keys(mergedData).forEach(function(k){
          var v = mergedData[k];
          if(v !== '' && v !== null && v !== undefined) _m[k] = v;
        });
        // 3) 尊重本機「再點清除」明確刪除的欄位
        if(typeof getDeletedKeysFor === 'function'){
          _appliedTombstones = getDeletedKeysFor(formKey).slice();
          _appliedTombstones.forEach(function(k){ delete _m[k]; });
        }
        mergedData = _m;
        // 同步回寫記憶體,讓畫面也保有合併後的完整資料(避免緊接著的同步又把畫面清空)
        APP.formData[formKey] = Object.assign({}, _m);
      }
    } else {
      console.warn('[saveFormToSheets] 送出前抓雲端失敗(HTTP ' + _r.status + '),改用本機資料');
    }
  }catch(_e){
    console.warn('[saveFormToSheets] 送出前抓雲端合併失敗,改用本機資料(此次儲存風險較高):', _e.name || _e);
  }

  // ★★★【v1.5.5 修正:防止空資料覆蓋雲端】★★★
  // 場景:loadFormFromSheets 短暫把 APP.formData[formKey] 清空時,
  //      若 autoSave / switchStudent / pagehide 在此瞬間觸發 saveFormToSheets,
  //      會把空物件推上雲端,徹底覆蓋學生原本填的資料 — 這就是「老師打開後消失」的根因之一。
  // 守門:資料為空就拒絕上傳(若要清空整份表單,使用者應主動「再點清除」逐 key 刪除,
  //      該流程會走 _recently_deleted 機制,雲端會收到精準的刪除指令)。
  if(!mergedData || Object.keys(mergedData).length===0){
    console.warn('[saveFormToSheets] 拒絕推送空資料到雲端,避免覆蓋既有內容:', formKey);
    return;
  }

  const mergedLog=(APP.historyLog[formKey]||[]).slice();
  // 去重複 log
  const logMap={};mergedLog.forEach(function(l){if(!logMap[l.ts])logMap[l.ts]=l;});
  const deduped=Object.values(logMap).sort(function(a,b){return new Date(b.ts)-new Date(a.ts);});

  const payload = {
    action: 'saveForm',
    formId: formKey,
    data: JSON.stringify(mergedData),
    history: JSON.stringify(deduped),
    studentId: APP.currentRole==='student' ? APP.currentUser.sid : (APP.currentRole==='teacher'?APP.currentUser.card:'admin'),
    // 【資安修補 v18】帶上 session token，後端會驗證 token 對應的角色才允許寫入
    sessionToken: getSessionToken() || '',
    role: APP.currentRole || '',
    // 【向下相容】secondary defense
    secret: (typeof GAS_WRITE_SECRET!=='undefined' && GAS_WRITE_SECRET) ? GAS_WRITE_SECRET : ''
  };
  if(!payload.sessionToken){
    console.warn('[Security] 未取得 session token，寫入操作可能被後端拒絕。請重新登入。');
  }
  // 【改用 fetch + text/plain 避免 CORS preflight】
  // 舊版用 iframe form submit 的問題：無法接收後端回應、無法判斷成功失敗
  try{
    fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload),
      mode:'cors'
    }).then(r=>r.ok?r.json():null).then(data=>{
      if(data && data.error){
        console.warn('[Backend] saveForm rejected:', data.error);
        if(data.error.indexOf('token')>=0 || data.error.indexOf('expired')>=0){
          toast('⚠ 登入逾時，請重新登入', false);
          clearSession();
        }
        return;   // 失敗 → 墓碑保留，下次再試
      }
      /* ★ FIX v19.5：雲端已確認收下（刪除的欄位不在 payload 裡了），
         墓碑任務完成即撤銷，避免它在接下來 24 小時內誤刪別台裝置填回的值。 */
      if(_appliedTombstones.length && typeof unmarkFieldDeleted==='function'){
        _appliedTombstones.forEach(function(k){ unmarkFieldDeleted(formKey, k); });
      }
    }).catch(e=>console.warn('saveFormToSheets error:',e));
  }catch(e){console.warn('saveFormToSheets error:',e);}
}

/* ── 從 GAS 讀取表單資料（載入時呼叫） ── */
async function loadFormFromSheets(id){
  // 使用 formKey（含學號）確保資料存到正確的 key
  const formKey=getFormKey(id);
  // ★ 旗標:逾時/失敗時不要呼叫 refreshFormUI 把畫面清空
  var cloudOk = false;
  try{
    const controller=new AbortController();
    const tid=setTimeout(function(){controller.abort();},15000); // 從 8 秒拉到 15 秒
    const url=GAS_URL+'?action=loadForm&formId='+encodeURIComponent(formKey)+'&t='+Date.now();
    const resp=await fetch(url,{cache:'no-cache',signal:controller.signal});
    clearTimeout(tid);
    if(!resp.ok)return;
    const data=await resp.json();
    cloudOk = true;
    if(data.formData){
      try{
        const loaded=JSON.parse(data.formData);
        // ★★★ 跨裝置同步:過濾掉「已刪除」的 keys ★★★
        //   使用者在本機按「再點清除」刪了某欄位,雲端可能還有舊值。
        //   從雲端拉回時要把這些已刪除的 key 從 loaded 過濾掉,避免「已刪除欄位復活」。
        if(typeof getDeletedKeysFor==='function'){
          var deletedKeys = getDeletedKeysFor(formKey);
          if(deletedKeys.length > 0){
            deletedKeys.forEach(function(k){
              if(loaded.hasOwnProperty(k)){
                delete loaded[k];
                console.log('[loadFormFromSheets] 過濾已刪除欄位:'+formKey+'/'+k);
              }
            });
          }
        }
        // ★★★【v1.5.5 修正】跨裝置同步:雲端 + 本機 merge,而非直接覆蓋 ★★★
        // 舊版 bug: `APP.formData[formKey] = loaded;` 整份覆蓋本機。
        // 後果:老師端打開表單時,先看到本機 merge 後的完整資料,
        //       1~3 秒後雲端回應(可能是空物件或只有部分欄位)→ 整份覆蓋 →
        //       「畫面上原本有的學生填答 突然消失」。
        //
        // 修法策略:
        //  (a) 已被 loaded 涵蓋的 key → 用雲端值(雲端是最終 source of truth)
        //  (b) loaded 沒有的 key      → 保留本機(可能是尚未上傳的本地草稿,
        //                              或被 deletedKeys 過濾掉的「真的該刪」的 key)
        //  (c) 顯式刪除清單裡的 key   → 從本機也移除(已在上面處理 loaded)
        // 注意:這不會讓「真的被刪掉」的欄位復活,因為已刪欄位被加入 _recently_deleted,
        //      下次儲存時雲端也會被同步刪除。
        var existing = APP.formData[formKey] || {};
        var merged = {};
        // 先放本機既有的(保底),再用雲端覆蓋
        Object.keys(existing).forEach(function(k){ merged[k] = existing[k]; });
        Object.keys(loaded).forEach(function(k){ merged[k] = loaded[k]; });
        // 已刪除清單裡的 key 從 merged 移除(雙保險)
        if(typeof getDeletedKeysFor==='function'){
          var dk2 = getDeletedKeysFor(formKey);
          dk2.forEach(function(k){ delete merged[k]; });
        }

        // ★★★【v1.5.5 診斷】偵測「雲端用空字串/null 覆蓋本機有效值」★★★
        // 如果偵測到雲端傳來的某個 key 值是空字串/null,但本機原本是有效值,
        // 印出警告,並 fallback 保留本機原值(避免畫面上的選項突然消失)。
        try{
          var _suspicious = [];
          Object.keys(loaded).forEach(function(k){
            var loadedVal = loaded[k];
            var existingVal = existing[k];
            var loadedEmpty = (loadedVal === '' || loadedVal === null || loadedVal === undefined);
            var existingHasValue = (existingVal !== '' && existingVal !== null && existingVal !== undefined);
            if(loadedEmpty && existingHasValue){
              _suspicious.push({key: k, was: existingVal, becameEmpty: loadedVal});
              // ★ 關鍵 fallback:雲端是空但本機有效 → 保留本機值
              merged[k] = existingVal;
            }
          });
          if(_suspicious.length > 0){
            console.warn('[loadFormFromSheets] ⚠ 雲端傳來 ' + _suspicious.length + ' 個欄位是「空」,但本機原本有值 → 已保留本機值:', _suspicious);
          }
        }catch(e){console.warn('suspicious check failed:', e);}

        APP.formData[formKey] = merged;
      }catch(e2){console.warn('formData parse:',e2);}
    }
    if(data.history){
      try{
        const remoteLog=JSON.parse(data.history);
        // ★★★【v1.5.5 修正】historyLog 也改成 merge,而非直接覆蓋 ★★★
        // 避免本機剛存的紀錄(尚未同步到雲端)被空陣列清掉。
        var localLog = APP.historyLog[formKey] || [];
        var logMap = {};
        // 雲端為主(較新),本機補上雲端沒有的(以 ts 去重)
        (remoteLog||[]).forEach(function(l){ if(l && l.ts) logMap[l.ts]=l; });
        localLog.forEach(function(l){ if(l && l.ts && !logMap[l.ts]) logMap[l.ts]=l; });
        APP.historyLog[formKey] = Object.values(logMap).sort(function(a,b){
          return new Date(b.ts) - new Date(a.ts);
        });
      }catch(e2){}
    }
  }catch(e){
    console.warn('loadFormFromSheets skipped:',formKey,e.name);
  }
  // 載入完成後重新計算分數（確保資料已就緒）
  var cid=APP.currentFormId;
  if(cid){
    setTimeout(function(){
      if(cid==='F07M'||cid==='F07S') calc360Score(getFormKey(cid));
      if(cid==='F15') calcF15Score(getFormKey(cid));
    },200);
  }
  // ★ 只有真的從雲端拿到資料才重畫,否則保留畫面原樣
  //   逾時/錯誤時 APP.formData[formKey] 是空的,若仍跑 refreshFormUI 會把按鈕全清回未選
  if(cloudOk && typeof refreshFormUI==='function'){
    refreshFormUI(formKey);
    setTimeout(function(){ refreshFormUI(formKey); }, 100);
    setTimeout(function(){ refreshFormUI(formKey); }, 400);
    setTimeout(function(){ refreshFormUI(formKey); }, 1000);
  } else if(!cloudOk){
    console.warn('[loadFormFromSheets] 雲端未成功取得 '+formKey+' → 跳過 refreshFormUI');
  }
}

/* ─── 清理輔助:過濾掉「裸 id」key(不含底線+學號),只保留 formKey ───
   裸 id key 不該存在於 APP.formData 或 localStorage 內,因為它是「跨學生共用」的
   危險空間,容易讓 A 學生看到 B 學生的資料。所有同步、備份、寫入都應只寫 formKey。
   這個 helper 用於寫入 localStorage 之前先過濾,避免污染重新登入後又被回灌。 */
function _sanitizeStoreForBackup(store){
  if(!store) return {};
  var out={};
  // 用所有 FORMS 的 id 做黑名單,並排除任何「不含底線」的 key(裸 id 一律有此特徵)
  var formIds=(typeof FORMS!=='undefined'&&FORMS)?FORMS.map(function(f){return f.id;}):[];
  var bareSet={}; formIds.forEach(function(x){ bareSet[x]=true; });
  Object.keys(store).forEach(function(k){
    if(bareSet[k]) return;          // 命中黑名單 → 跳過
    if(k.indexOf('_')<0) return;    // 沒有底線 → 視為裸 id 跳過
    out[k]=store[k];
  });
  return out;
}

/* ─── 一次性深度清理:把記憶體與 localStorage 中所有「裸 id」條目都清掉 ───
   登入時呼叫一次,確保使用者不會被舊污染影響。 */
function purgeBareIdContamination(){
  try{
    // 清記憶體
    if(APP.formData){
      _sanitizeBareIds(APP.formData);
    }
    if(APP.historyLog){
      _sanitizeBareIds(APP.historyLog);
    }
    // 清 localStorage
    ['form_drafts','history_logs'].forEach(function(lsKey){
      try{
        var obj=JSON.parse(localStorage.getItem(lsKey)||'{}');
        var changed=_sanitizeBareIds(obj);
        if(changed) localStorage.setItem(lsKey, JSON.stringify(obj));
      }catch(e){}
    });
  }catch(e){console.warn('purgeBareIdContamination failed:',e);}
}
function _sanitizeBareIds(obj){
  if(!obj) return false;
  var formIds=(typeof FORMS!=='undefined'&&FORMS)?FORMS.map(function(f){return f.id;}):[];
  var bareSet={}; formIds.forEach(function(x){ bareSet[x]=true; });
  var changed=false;
  Object.keys(obj).forEach(function(k){
    if(bareSet[k]){ delete obj[k]; changed=true; return; }
    if(k.indexOf('_')<0){ delete obj[k]; changed=true; }
  });
  return changed;
}

/* ── 登入時批次從 GAS 拉取該使用者所有表單（跨裝置同步用）── */
async function loadAllFormsFromSheets(replaceMode){
  // replaceMode=true (來自手動「同步」按鈕):雲端整份替換本機,真的拿到別台裝置最新版
  // replaceMode=false/undefined (來自登入時自動載入):merge,保留本機未上傳草稿
  if(!APP.currentUser) return;
  var sid = APP.currentRole==='student' ? APP.currentUser.sid 
          : (APP.currentStudentId || null);
  if(!sid) return;

  // ★ 優化:用新的 loadAllForms API 一次抓所有表單(取代 33 次請求)
  //   後端不支援的話,自動 fallback 回原本逐一抓的方式
  //   ★ v19.1:改用 POST 避免 GAS Web 部署對新增 GET action 的快取怪症
  try{
    var controller = new AbortController();
    var tid = setTimeout(function(){controller.abort();}, 12000);
    var resp = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({action:'loadAllForms', sid: sid}),
      signal: controller.signal,
      cache: 'no-cache'
    });
    clearTimeout(tid);
    if(resp.ok){
      var data = await resp.json();
      if(data.ok && data.forms){
        // 後端支援新 API → 一次寫入所有表單
        Object.keys(data.forms).forEach(function(fkey){
          var item = data.forms[fkey] || {};
          // ★ 只寫 formKey,不寫裸 baseId(避免跨學生污染)
          if(item.formData){
            try{
              var loaded = JSON.parse(item.formData);
              if(replaceMode){
                // ★ 手動同步:雲端整份替換本機(讓使用者真的拿到別台裝置的版本)
                APP.formData[fkey] = loaded;
              } else {
                // 一般登入載入:merge,保留本機未上傳草稿
                var _existing = APP.formData[fkey] || {};
                var _merged = {};
                Object.keys(_existing).forEach(function(k){ _merged[k] = _existing[k]; });
                Object.keys(loaded).forEach(function(k){ _merged[k] = loaded[k]; });
                if(typeof getDeletedKeysFor==='function'){
                  getDeletedKeysFor(fkey).forEach(function(k){ delete _merged[k]; });
                }
                Object.keys(loaded).forEach(function(k){
                  var lv = loaded[k], ev = _existing[k];
                  var lEmpty = (lv==='' || lv===null || lv===undefined);
                  var eHas = (ev!=='' && ev!==null && ev!==undefined);
                  if(lEmpty && eHas){ _merged[k] = ev; }
                });
                APP.formData[fkey] = _merged;
              }
            }catch(e){}
          }
          if(item.history){
            try{
              var remoteLog = JSON.parse(item.history);
              // ★★★【v1.5.5 修正】historyLog 也改成 merge ★★★
              var _localLog = APP.historyLog[fkey] || [];
              var _logMap = {};
              (remoteLog||[]).forEach(function(l){ if(l && l.ts) _logMap[l.ts] = l; });
              _localLog.forEach(function(l){ if(l && l.ts && !_logMap[l.ts]) _logMap[l.ts] = l; });
              APP.historyLog[fkey] = Object.values(_logMap).sort(function(a,b){
                return new Date(b.ts) - new Date(a.ts);
              });
            }catch(e){}
          }
        });
        // 寫回 localStorage 備份(★ 過濾裸 id,只存帶學號的 formKey)
        try{
          localStorage.setItem('form_drafts', JSON.stringify(_sanitizeStoreForBackup(APP.formData)));
          localStorage.setItem('history_logs', JSON.stringify(_sanitizeStoreForBackup(APP.historyLog)));
        }catch(e){}
        console.log('[loadAllForms] 一次載入 ' + Object.keys(data.forms).length + ' 份表單');
        return;
      }
    }
    // resp.ok 但沒有 data.forms → fall through 到舊版邏輯
    console.warn('[loadAllForms] 後端未支援新 API,回退到逐張抓取');
  }catch(e){
    console.warn('[loadAllForms] 失敗,回退到逐張抓取:', e.name||e);
  }

  // ── 舊版 fallback:逐一抓取(後端尚未部署新 API 時使用)──
  var allFormIds = FORMS.map(function(f){ return f.id; });
  var loadPromises = [];

  allFormIds.forEach(function(fid){
    var formKey = fid + '_' + sid;
    loadPromises.push(
      (async function(fk, baseId){
        try{
          var controller = new AbortController();
          var tid = setTimeout(function(){controller.abort();}, 6000);
          var url = GAS_URL + '?action=loadForm&formId=' + encodeURIComponent(fk) + '&t=' + Date.now();
          var resp = await fetch(url, {cache:'no-cache', signal:controller.signal});
          clearTimeout(tid);
          if(!resp.ok) return;
          var data = await resp.json();
          if(data.formData){
            try{
              var loaded = JSON.parse(data.formData);
              if(replaceMode){
                // ★ 手動同步:雲端整份替換本機
                APP.formData[fk] = loaded;
              } else {
                // 一般載入:merge
                var _existing2 = APP.formData[fk] || {};
                var _merged2 = {};
                Object.keys(_existing2).forEach(function(k){ _merged2[k] = _existing2[k]; });
                Object.keys(loaded).forEach(function(k){ _merged2[k] = loaded[k]; });
                if(typeof getDeletedKeysFor==='function'){
                  getDeletedKeysFor(fk).forEach(function(k){ delete _merged2[k]; });
                }
                Object.keys(loaded).forEach(function(k){
                  var lv = loaded[k], ev = _existing2[k];
                  var lEmpty = (lv==='' || lv===null || lv===undefined);
                  var eHas = (ev!=='' && ev!==null && ev!==undefined);
                  if(lEmpty && eHas){ _merged2[k] = ev; }
                });
                APP.formData[fk] = _merged2;
              }
            }catch(e){}
          }
          if(data.history){
            try{
              var remoteLog = JSON.parse(data.history);
              // ★★★【v1.5.5 修正】historyLog 也改成 merge ★★★
              var _localLog2 = APP.historyLog[fk] || [];
              var _logMap2 = {};
              (remoteLog||[]).forEach(function(l){ if(l && l.ts) _logMap2[l.ts] = l; });
              _localLog2.forEach(function(l){ if(l && l.ts && !_logMap2[l.ts]) _logMap2[l.ts] = l; });
              APP.historyLog[fk] = Object.values(_logMap2).sort(function(a,b){
                return new Date(b.ts) - new Date(a.ts);
              });
            }catch(e){}
          }
        }catch(e){}
      })(formKey, fid)
    );
  });

  await Promise.all(loadPromises);

  try{
    // ★ 寫回 localStorage 時過濾掉裸 id,只保留帶學號的 formKey,避免污染
    localStorage.setItem('form_drafts', JSON.stringify(_sanitizeStoreForBackup(APP.formData)));
    localStorage.setItem('history_logs', JSON.stringify(_sanitizeStoreForBackup(APP.historyLog)));
  }catch(e){}
}

/* ═══════════ 🔍 診斷模式（v1.5.5） ═══════════
 * 功能:檢查目前表單在 本機 / 雲端 / 記憶體 三邊的狀態,以全螢幕對話框呈現,
 *      讓非技術人員也能截圖回報問題。
 * 觸發:點右上角「🔍 診斷」按鈕。
 * 顯示:
 *   - 你是誰(角色 + sid)
 *   - 目前看的是哪份表單(formKey)
 *   - 三邊各有幾個欄位、內容預覽
 *   - 直接打雲端 API 看回應(原始 JSON)
 */
async function runDiagnostic(){
  if(!APP.currentUser){ alert('請先登入再執行診斷'); return; }

  // 建對話框骨架
  var existing = document.getElementById('diag-modal');
  if(existing) existing.remove();

  var modal = document.createElement('div');
  modal.id = 'diag-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';

/* ── 手動同步按鈕 ── */
async function manualSync(){
  if(!APP.currentUser){ toast('請先登入'); return; }
  var btn = document.getElementById('btn-sync');
  if(btn){ btn.disabled=true; btn.textContent='⏳ 同步中...'; }
  try{
    // ★ 手動同步:走「整份替換」模式,真的把雲端最新版本拉下來蓋掉本機
    //   (一般載入是 merge 保留本機草稿;但手動同步代表「我要看別台裝置最新進度」)
    await loadAllFormsFromSheets(true);
    toast('✓ 已從雲端載入最新資料');
    if(APP.currentFormId && !APP.currentFormId.startsWith('__')){
      openForm(APP.currentFormId);
    } else if(APP.currentRole==='admin'){
      renderAdmin();
    } else if(APP.currentRole==='teacher'){
      renderTeacherHome();
    } else {
      renderFormList();
    }
    renderSidebar();
    updateQuickNav();
  }catch(e){
    toast('同步失敗，請檢查網路', false);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='🔄 同步'; }
  }
}

function buildHistoryLog(id){
  const logs=APP.historyLog[id]||[];
  if(logs.length===0)return'';
  const formKey2=getFormKey(id);
  return`<div class="history-log">
    <div class="history-title">歷次修改紀錄</div>
    <div id="history-wrap">${buildHistoryItems(formKey2)}</div>
  </div>`;
}
function buildHistoryItems(id){
  const logs=APP.historyLog[id]||[];
  if(logs.length===0)return'';
  return logs.map((l,i)=>{
    const dt=new Date(l.ts);
    const ts=`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}:${String(dt.getSeconds()).padStart(2,'0')}`;
    const wClass={student:'hw-s',teacher:'hw-t',admin:'hw-a'}[l.role]||'hw-s';
    return`<div class="history-item"><span style="font-size:11px;color:var(--ink3);">#${logs.length-i}</span><span class="history-time">${escapeHtml(ts)}</span><span class="history-who ${wClass}">${escapeHtml(l.roleLabel)}：${escapeHtml(l.name)}</span></div>`;
  }).join('');
}

/* ═══════════ PDF DOWNLOAD ═══════════
 * 判定原則（方案 C：嚴格判定）
 *   PDF 可下載 ⇔ getStatus(id) === 'done'
 *
 * getStatus 已內建檢查 REQUIRED_STUDENT_FIELDS：
 *   ✓ 所有題目欄位都填完（評核項目、回饋、心得…）
 *   ✓ 學生簽名 + 學生簽名日期
 *   ✓ 老師簽名 + 老師簽名日期（roles='both' 表單）
 *   ✓ 虛擬必填項（__prof_any / __team_first / __sc_any）
 *
 * 不再使用「historyLog 有儲存紀錄」當條件 ── 因為自動儲存會稀釋它，
 * 任何角色登入後動 20 秒就會留紀錄，無法真正反映「雙方確認完成」。
 * 改以「必填欄位 + 雙方簽名」為單一判準，語意清楚且無法繞過。
 */
function canDownloadPDF(id){
  // 借用既有的完整必填判定 — 必須回傳 'done' 才能下載
  if(typeof getStatus !== 'function') return false;
  return getStatus(id) === 'done';
}

/* 找出當前表單還缺哪些必填欄位（給錯誤訊息用）
 * 回傳人類可讀的欄位名稱陣列，例如 ['老師簽名','建議加強','評量結果'] */
function getMissingRequiredFields(id){
  if(typeof REQUIRED_STUDENT_FIELDS === 'undefined') return [];
  const bareId = id.indexOf('_')>=0 ? id.split('_')[0] : id;
  const formKey = (typeof getFormKey==='function') ? getFormKey(id) : id;
  // 合併所有資料來源（與 getStatus 內部相同邏輯）
  const d = {};
  function mergeRO(src){
    if(!src) return;
    Object.keys(src).forEach(function(k){
      var v=src[k];
      if(v===''||v===null||v===undefined||v===false) return;
      if(d[k]===''||d[k]===null||d[k]===undefined||d[k]===false) d[k]=v;
    });
  }
  mergeRO(APP.formData[formKey]);
  try{
    var allDrafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    mergeRO(allDrafts[formKey]);
    if(formKey!==id) mergeRO(allDrafts[id]);
  }catch(e){}
  if(formKey!==id) mergeRO(APP.formData[id]);

  function hasRealVal(v){
    if(v===undefined||v===null||v===false) return false;
    var s=String(v).trim();
    if(s===''||s==='[]'||s==='{}'||s==='null') return false;
    return true;
  }

  // 取必填清單（向下相容：F04/F06/F07/F10 分內外科變體，REQUIRED 通常用 bareId 或變體 id）
  var req = (REQUIRED_STUDENT_FIELDS[id] || REQUIRED_STUDENT_FIELDS[bareId] || []).slice();
  // roles='both' 額外要求老師簽名
  var f = (typeof findForm==='function') ? findForm(id) : null;
  if(f && f.roles==='both' && req.indexOf('t_sign')<0) req.push('t_sign');

  // 欄位名稱對照（盡量用使用者看得懂的中文）
  var LABEL = {
    's_name':'學生姓名','school':'實習學校','intern_cat':'實習類別','s_date':'實習日期',
    's_sign':'學生簽名','s_sign_date':'學生簽名日期',
    't_sign':'老師簽名','t_sign_date':'老師簽名日期',
    't_sign2':'老師簽名（第二位）','t_sign2_date':'老師簽名日期（第二位）',
    't_fb':'老師回饋','t_good':'表現良好','t_improve':'建議加強','t_comment':'綜合意見',
    't_note':'輔導備註','t_title':'老師職稱','director_fb':'指導教師評語',
    'peer_good':'其他團隊優點','peer_suggest':'其他團隊建議','peer_sign':'其他團隊簽名',
    'team_good':'跨團隊優點','team_suggest':'跨團隊建議','team_sign':'跨團隊簽名','team_title':'跨團隊職稱',
    'host_sign':'主持人簽名','host_sign_date':'主持人簽名日期','host_date':'主持人日期',
    's_fb':'學生回饋','s_feeling':'學生心得','s_comment':'學生綜合意見','s_improve':'學生自評加強',
    'complexity':'技術複雜度','case_dx':'主診斷','diagnosis':'診斷',
    'result':'評量結果（合格/不合格）','score_grade':'評分等級','epa_level':'EPA 信賴等級',
    'bonus':'加分項目','follow_date':'追蹤日期',
    't_level':'老師職級','t_satisfy':'老師滿意度','s_satisfy':'學員滿意度',
    'obs_min':'直接觀察時間（分鐘）','fb_min':'回饋時間（分鐘）',
    '__prof_any':'參加職類（至少一項）','__team_first':'跨團隊照護第一組','__sc_any':'臨床情境（至少一項）',
    'q_basic':'基本資料查核','q_self':'自評查核','q_progress':'進度查核','q_detail':'細項查核',
    'q_t_sign':'老師查核簽名','q_feeling':'心得查核','q_t_fb':'老師查核回饋','q_all_sign':'總簽名',
    'f12_q1':'專業態度','f12_q2':'專業知識','f12_q3':'臨床技能','f12_q4':'實習心得','f12_q5':'改進建議',
    'f12_q6':'學習成果感受','f12_q7_1':'醫學倫理與法律應用','f12_q7_2':'實證醫學應用',
    'f12_q7_3':'醫療品質應用','f12_q7_4':'感染控制應用','f12_q7_5':'病歷寫作應用','f12_q7_6':'臨床溝通技巧應用',
    't_need_improve':'建議應補強項目','t_overall':'綜合意見',
    'goal':'學習目標','motivation':'動機','strategy':'策略','difficulty':'困難','criteria':'達成標準','timeline':'時程',
    'bed':'病床號','pt_name':'病人名','gender':'性別','birth_date':'出生日期',
    'rt_ind':'呼吸治療指徵','vent_type':'呼吸器類型','medical_focus':'醫療重點','rt_plan':'呼吸治療計畫',
    'cat':'會議類別','date':'日期',
    'discuss_生':'生理討論','discuss_心':'心理討論','discuss_靈':'靈性討論','discuss_社':'社會討論',
    'c1':'跨領域合作項目 1','c2':'跨領域合作項目 2','c3':'跨領域合作項目 3',
    's1':'個案分項評分 1','s2a':'個案分項評分 2a','s2b':'個案分項評分 2b','s2c':'個案分項評分 2c',
    's2d':'個案分項評分 2d','s2e':'個案分項評分 2e','s2f':'個案分項評分 2f','s2g':'個案分項評分 2g','s2h':'個案分項評分 2h',
    's_q2':'學生回答 2','s_q3':'學生回答 3','s_q4':'學生回答 4','s_q5':'學生回答 5','s_q6':'學生回答 6'
  };
  function labelOf(k){
    if(LABEL[k]) return LABEL[k];
    // 規則化的編號欄位
    if(/^f01_pre_(\d+)$/.test(k))  return '學前評值 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f01_post_(\d+)$/.test(k)) return '學後自評 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f01_p1_(\d+)$/.test(k))   return '指導者評核 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f02_(\d+)$/.test(k))      return '臨床表現 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f06_(\d+)$/.test(k))      return 'CbD 評估 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f07_(\d+)$/.test(k))      return '360 度評核 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f14_sc_(\d+)$/.test(k))   return 'PPT 評分 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f15_att_(\d+)$/.test(k))  return '學習態度 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f15_skl_(\d+)$/.test(k))  return '專業技能 第'+(parseInt(RegExp.$1)+1)+'項';
    if(/^f15_com_(\d+)$/.test(k))  return '溝通能力 第'+(parseInt(RegExp.$1)+1)+'項';
    var m = /^(D0[1-4])_i(\d+)$/.exec(k);
    if(m) return 'DOPS '+m[1]+' 評核項目 '+m[2];
    return k; // fallback：原 key
  }

  // 找出缺的（與 getStatus 內部 checkField 行為一致）
  var missing = [];
  req.forEach(function(k){
    // 虛擬必填的特例
    if(k==='__prof_any'){
      var ok = Object.keys(d).some(function(kk){ return kk.indexOf('prof_')===0 && d[kk]===true; });
      if(!ok) missing.push(labelOf(k));
      return;
    }
    if(k==='__team_first'){
      if(!(hasRealVal(d['team_type_1']) && hasRealVal(d['team_care_1']))) missing.push(labelOf(k));
      return;
    }
    if(k==='__sc_any'){
      var raw = d['e01_sc']||d['e02_sc']||d['e03_sc']||'';
      var ok2 = false;
      if(raw){ try{ var arr=JSON.parse(raw); ok2 = Array.isArray(arr)&&arr.length>0; }catch(e){} }
      if(!ok2) missing.push(labelOf(k));
      return;
    }
    if(!hasRealVal(d[k])) missing.push(labelOf(k));
  });
  return missing;
}

/* ═══════════ PDF「修改紀錄」壓縮排版 ═══════════
 * 問題:原本每筆紀錄各佔一行,一份表單存個 6~10 次就會把版面撐到多一頁,
 *      而且常常剛好被切在頁尾 → 產生一頁幾乎空白的 PDF。
 * 作法:1) 只列最近 PDF_HISTORY_MAX 筆,其餘用「共 N 次」帶過
 *      2) 同一段內以「｜」串接成流式文字,6 筆約只佔 1~2 行
 *      3) 時間縮成 M/D HH:mm(去掉年份與秒數,對稽核已足夠)
 *      4) page-break-inside:avoid,不讓這一區塊被切到下一頁
 * 調整:PDF_HISTORY_MAX 設 0 → 完全不印修改紀錄(只留「共 N 次」);
 *      設 999 → 全部印出(但仍是壓縮排版,比原本省很多行)。 */
var PDF_HISTORY_MAX = 5;

function _pdfHistTs(ts){
  var dt = new Date(ts);
  if(isNaN(dt.getTime())) return String(ts || '');
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
}

function buildPDFHistory(logs, title){
  logs = logs || [];
  if(logs.length === 0) return '';
  var max = (typeof PDF_HISTORY_MAX === 'number') ? PDF_HISTORY_MAX : 5;
  var shown = max > 0 ? logs.slice(0, max) : [];
  var first = logs[logs.length - 1];

  var html = '<div style="border-top:1px solid #DDD;margin-top:12px;padding-top:6px;'
           + 'page-break-inside:avoid;break-inside:avoid;font-size:8pt;color:#8A8A8A;line-height:1.65;">';
  html += '<span style="font-weight:700;color:#666;">' + (title || '修改紀錄') + '</span>';
  html += '<span style="margin-left:6px;">（共 ' + logs.length + ' 次'
        + (shown.length && logs.length > shown.length ? '，僅列最近 ' + shown.length + ' 次' : '')
        + '；首次 ' + _pdfHistTs(first.ts) + '）</span>';
  if(shown.length){
    html += '<span style="margin-left:8px;">'
          + shown.map(function(l, i){
              return '#' + (logs.length - i) + ' ' + _pdfHistTs(l.ts)
                   + ' ' + (l.roleLabel || '') + '：' + (l.name || '');
            }).join('　｜　')
          + '</span>';
  }
  html += '</div>';
  return html;
}

function checkAndDownloadPDF(id){
  if(canDownloadPDF(id)){
    downloadPDF(id);
    return;
  }
  // 找出缺哪些欄位，給使用者具體訊息
  var missing = [];

    toast('⚠ 表單尚未完成，請確認所有必填欄位都已填寫並簽名', false);

}

/* ── 簽名日期/時間格式化（電子簽章感）──
   原始儲存格式可能為：
   1) "YYYY-MM-DD 2026/5/5 14:32:18"  ← 由 signDateWithTimestamp 產生：日期欄位值 + ' ' + toLocaleString
   2) "YYYY-MM-DD"                    ← 早期資料只有日期
   3) "YYYY/MM/DD" 或其他變體          ← 舊資料殘留
   輸出統一格式：YYYY-MM-DD HH:MM（若有時間）/ YYYY-MM-DD（若無時間）
   "—" 用於空值。
*/
function formatSignTs(v){
  if(v===undefined||v===null) return '—';
  var s=String(v).trim();
  if(!s) return '—';
  // 抓出第一段 YYYY-MM-DD 或 YYYY/MM/DD 作為日期
  var dm=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  var datePart='';
  if(dm){
    datePart=dm[1]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
  } else {
    return s; // 無法解析就原樣回傳
  }
  // 抓時間：從整段字串裡找 HH:MM（取第一個出現的）
  var tm=s.match(/(\d{1,2}):(\d{2})/);
  if(tm){
    var hh=String(tm[1]).padStart(2,'0');
    var mm=tm[2];
    // 處理「下午 1:32」這類 12 小時制（toLocaleString 在某些 locale 會出現）
    var ampm=s.match(/(上午|下午|AM|PM|am|pm)/);
    if(ampm){
      var h=parseInt(hh,10);
      var marker=ampm[1];
      if((marker==='下午'||marker==='PM'||marker==='pm') && h<12) h+=12;
      if((marker==='上午'||marker==='AM'||marker==='am') && h===12) h=0;
      hh=String(h).padStart(2,'0');
    }
    return datePart+' '+hh+':'+mm;
  }
  return datePart;
}

function buildPDFContent(id,f,d,val,row,section,studentName,studentSchool,chk){

  //   不論呼叫端傳入 'F10A' 還是 'F10A_P145023' 都能正確匹配
  if(typeof id==='string' && id.indexOf('_')>=0){
    id = id.split('_')[0];
  }
  var html='';

  // ── 統一輔助：直接接受 value，兩條呼叫路徑皆適用 ──
  function pdfR(label,v,isT){
    var bg=isT?'#FFF5F5':'#FAFBFF';
    var disp=(v===undefined||v===null||v==='')?'—':String(v);
    // 【安全】HTML escape 防 XSS（學生/老師輸入的回饋、評語等不可信內容）
    var safeLabel = (typeof esc==='function') ? esc(label) : String(label||'');
    var safeDisp = (disp==='—') ? '—' : (typeof esc==='function' ? esc(disp) : String(disp));
    return '<tr><td style="background:'+bg+';font-weight:600;padding:6px 10px;border:1px solid #DDD;width:35%;font-size:10pt;vertical-align:top;">'+safeLabel+'</td>'
         +'<td style="background:'+bg+';padding:6px 10px;border:1px solid #DDD;font-size:10pt;white-space:pre-wrap;">'+safeDisp+'</td></tr>';
  }
  // 基本資料 section header
  function pdfSec(title){
    var safeTitle = (typeof esc==='function') ? esc(title) : String(title||'');
    return '<tr><td colspan="2" style="background:#1A3A5C;color:#fff;font-weight:700;padding:6px 10px;font-size:11pt;">'+safeTitle+'</td></tr>';
  }
  // 日期範圍清理：只填開始日期則只顯示開始日期；只填結束日期則只顯示結束日期
  function cleanDate(v){
    if(!v) return '—';
    var s=String(v).trim();
    // 只填開始日期，例如 "2026/06/29 - "
    var mStart=s.match(/^(\d{4}\/\d{2}\/\d{2})\s*-\s*$/);
    if(mStart) return mStart[1];
    // 只填結束日期，例如 " - 2026/06/29"
    var mEnd=s.match(/^\s*-\s*(\d{4}\/\d{2}\/\d{2})$/);
    if(mEnd) return mEnd[1];
    return s||'—';
  }
  // 單一日期欄位專用：若舊資料殘留區間格式（"YYYY/MM/DD - YYYY/MM/DD" 或 "YYYY-MM-DD - YYYY-MM-DD"），只取開始日期
  function singleDateOnly(v){
    if(!v) return v;
    var s=String(v).trim();
    var m=s.match(/^(\d{4}[-\/]\d{2}[-\/]\d{2})/);
    return m?m[1]:s;
  }

/* ═══════════ GOOGLE SHEETS UPLOAD ═══════════ */
async function uploadToSheets(id) {
  const d = APP.formData[id] || {};
  const f = findForm(id);
  const u = APP.currentUser;
  const now = new Date();
  const ts = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const roleLabel = {student:'學生', teacher:'臨床老師', admin:'管理員'}[APP.currentRole] || '';

  if (!GS.isReady || !GS.accessToken) {
    updateGsStatus('warn', '⚠ Google Sheets 尚未授權，請至管理員面板完成授權後再儲存');
    return;
  }

  // Build row: [時間戳記, 表單名稱, 使用者, 角色, ...所有欄位值]
  const row = [ts, f.name, u.name, roleLabel];
  // Add all key:value pairs as separate columns
  const keys = Object.keys(d);
  keys.forEach(k => row.push(d[k] ?? ''));

  // Determine sheet tab name (one tab per form)
  const sheetName = (f.num + '_' + f.name).slice(0, 31).replace(/[\\\/\?\*\[\]]/g, '_');

  try {
    // 1. Try to get sheet metadata to check if tab exists
    const metaResp = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}`,
      { headers: { Authorization: 'Bearer ' + GS.accessToken } }
    );
    const meta = await metaResp.json();
    const sheetExists = meta.sheets?.some(s => s.properties.title === sheetName);

    // 2. Create sheet tab if it doesn't exist
    if (!sheetExists) {
      await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}:batchUpdate`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + GS.accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: [{ addSheet: { properties: { title: sheetName } } }] })
      });
      // Write header row
      const headers = ['時間戳記', '表單名稱', '填寫者', '角色', ...keys];
      await appendRow(sheetName, headers);

      // Special: for F03 satisfaction, also write an averages header row
      // F03 removed
    }

    // 3. Append data row
    await appendRow(sheetName, row);

    // 4. Special handling: F03 satisfaction — recalculate averages
      // F03 removed

    updateGsStatus('ok', `✓ 已同步至 Google Sheets（${ts}）`);
    toast('✓ 已上傳至 Google Sheets');
  } catch (err) {
    console.error('Sheets upload error:', err);
    updateGsStatus('err', '上傳失敗：' + (err.message || '請確認授權是否仍有效'));
    toast('Google Sheets 上傳失敗', false);
  }
}

async function appendRow(sheetName, values) {
  const body = { values: [values.map(v => String(v ?? ''))] };
  const resp = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(sheetName)}!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
    { method: 'POST', headers: { Authorization: 'Bearer ' + GS.accessToken, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
  );
  return resp.json();
}

async function updateSatisfactionAverages(sheetName, latestData) {
  // Read all rows to compute per-question averages across all students
  try {
    const resp = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(sheetName)}`,
      { headers: { Authorization: 'Bearer ' + GS.accessToken } }
    );
    const data = await resp.json();
    const rows = data.values || [];
    if (rows.length < 2) return;

    const headers = rows[0];
    // Find question columns (f03t_0 … f03c_2)
    const qPrefixes = ['f03t_', 'f03c_'];
    const qCols = headers.reduce((acc, h, i) => {
      if (qPrefixes.some(p => h.startsWith?.(p) || String(h).startsWith(p))) acc.push({ idx: i, key: h });
      return acc;
    }, []);

    if (qCols.length === 0) return;

    // Compute averages from data rows (skip header & any avg rows)
    const dataRows = rows.slice(1).filter(r => r[0] && !String(r[0]).startsWith('---'));
    const avgs = qCols.map(({ idx }) => {
      const vals = dataRows.map(r => parseFloat(r[idx])).filter(v => !isNaN(v) && v > 0);
      return vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : '—';
    });

    // Find or create the averages row (marked with '--- 平均分數 ---' in col A)
    const avgRowIdx = rows.findIndex(r => String(r[0]).startsWith('---'));
    const avgRowValues = ['--- 平均分數 ---', '', '', '', ...Array(headers.length - 4).fill('')];
    qCols.forEach(({ idx }, i) => { avgRowValues[idx] = avgs[i]; });

    if (avgRowIdx >= 0) {
      // Update existing avg row
      const rowNum = avgRowIdx + 1; // 1-indexed
      await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values/${encodeURIComponent(sheetName)}!A${rowNum}:update?valueInputOption=USER_ENTERED`,
        { method: 'PUT', headers: { Authorization: 'Bearer ' + GS.accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: [avgRowValues.map(v => String(v))] }) }
      );
    } else {
      await appendRow(sheetName, avgRowValues);
    }
  } catch (e) { console.warn('Average update failed:', e); }
}

function fi(fid,key,type,disabled,ph,val){
  // 讀取點也做 canonical 轉換:即使呼叫端傳裸 id (f.id),也能讀到正確 formKey 的值
  const readKey = (fid && fid.indexOf('_')<0 && typeof getCanonicalKey==='function') ? getCanonicalKey(fid) : fid;
  const v=val!==undefined?val:((APP.formData[readKey]||{})[key]||'');
  const dis=disabled?'disabled':'';
  // 即時儲存：與 ta() 一致,改用 saveDraftField 寫入 canonical formKey 並落地 localStorage
  const oc=`saveDraftField('${fid}','${key}',this.value)`;
  return`<input type="${type||'text'}" value="${String(v).replace(/"/g,'&quot;')}" ${dis} data-fid="${fid}" data-key="${key}" oninput="${oc}" onchange="${oc}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:${disabled?'var(--cream)':'#fff'};color:var(--ink);font-size:13px;font-family:var(--ff-sans);" placeholder="${ph||''}">`;
}

  const v=(APP.formData[readKey]||{})[key]||'';
  const dis=disabled?'disabled':'';
  // 即時儲存：用 saveDraftField 寫入 canonical formKey 並落地 localStorage,

/* ═══════════ refreshFormUI:跨帳號同步畫面修復 ═══════════
 * 問題:學生端取消選項後雲端已經沒有那個 key,但老師端打開時:
 *   1) 雲端正確資料 → APP.formData 已更新
 *   2) 但畫面上的按鈕是 buildF01B 渲染時依據「當時的」資料畫的
 *   3) 老師端從 localStorage / 記憶體殘留中讀到舊「佳」,所以按鈕還是選中
 * 解法:雲端載入完成後,根據最新的 APP.formData,把所有評分按鈕的視覺狀態重畫一次。
 *      凡是 APP.formData 沒有的 key,所有對應按鈕都回到未選樣式。 */
function refreshFormUI(formKey){
  if(!formKey) return;
  try{
    var d = (APP.formData && APP.formData[formKey]) || {};

    // ★★★【v1.5.5 診斷 log】記錄此次 refreshFormUI 看到的記憶體值,
    //    方便追「畫面消失」現場。只在開發者模式或 console 看得到。
    var _fKeysCount = Object.keys(d).filter(function(k){return /^f\d/.test(k);}).length;
    console.log('[refreshFormUI] '+formKey+' 啟動,記憶體中 f* key 共 '+_fKeysCount+' 個');

    // 1) 處理 F01A/F01B 風格按鈕(inline style 染色,onclick="f01Click")
    var f01Btns = document.querySelectorAll('button[onclick="f01Click(this)"]');
    var rkeySet = {};
    f01Btns.forEach(function(b){
      var k = b.getAttribute('data-rkey');
      if(k) rkeySet[k] = true;
    });

    console.log('[refreshFormUI] 找到 '+f01Btns.length+' 個 f01Click 按鈕,'+Object.keys(rkeySet).length+' 個 rkey');

    var _refreshedCount = 0;
    Object.keys(rkeySet).forEach(function(k){
      var curVal = d[k];  // 雲端最新值(被刪掉就是 undefined)
      var btns = document.querySelectorAll('button[data-rkey="'+k+'"][onclick="f01Click(this)"]');
      btns.forEach(function(b){
        var isTeacher = b.getAttribute('data-teacher')==='1';
        var v = b.getAttribute('data-rval');
        var isNA = v==='NA';
        var selBg = isNA?'#7F8C8D':(isTeacher?'#B45309':'#4D7C0F');
        // 雲端有值且等於此按鈕的 rval 才選中;否則全部回到未選
        var shouldSel = (curVal!==undefined && curVal!==null && curVal!=='' && curVal===v);
        b.style.background = shouldSel?selBg:'#fff';
        b.style.color = shouldSel?'#fff':'#7A706A';
        b.style.fontWeight = shouldSel?'700':'400';
        b.style.borderColor = shouldSel?selBg:'#D4C9BB';
        if(shouldSel) _refreshedCount++;
      });
    });
    console.log('[refreshFormUI] 完成,共標記選中 '+_refreshedCount+' 個按鈕為高亮');
    // 2) 處理一般評分表格按鈕(class sel-s/sel-t/sel-a,onclick="setRating(...)")
    var tbBtns = document.querySelectorAll('button.r-btn[data-rkey]');
    var rkeySet2 = {};
    tbBtns.forEach(function(b){
      var k = b.getAttribute('data-rkey');
      if(k) rkeySet2[k] = true;
    });
    Object.keys(rkeySet2).forEach(function(k){
      var curVal = d[k];
      var btns = document.querySelectorAll('button.r-btn[data-rkey="'+k+'"]');
      btns.forEach(function(b){
        b.classList.remove('sel-s','sel-t','sel-a');
        if(curVal!==undefined && curVal!==null && curVal!=='' ){
          var v = b.getAttribute('data-rval');
          if(curVal==v || curVal===String(v)){
            var isT = b.getAttribute('data-teacher')==='1';
            b.classList.add(isT?'sel-t':'sel-s');
          }
        }
      });
    });
    // 3) 同步 localStorage form_drafts:雲端沒有的 key 也從本機草稿清掉,避免下次又被回灌
    //
    // ★★★【v1.5.5 修正】此步驟原本太激進,會在「雲端尚未收到資料」的情況下
    // 把本機合法草稿全部清掉,導致老師端打開後幾秒內畫面從「有」變「無」。
    //
    // 新規則:必須同時滿足兩個條件才清除草稿 key——
    //   (a) APP.formData[formKey] 目前確實沒這個 key(雲端 merge 結果也沒)
    //   (b) 此 key 出現在 _recently_deleted 清單裡(是使用者主動刪的)
    // 只滿足 (a) 不足以判定「該清」——可能只是雲端還沒收到本機新填的資料。
    try{
      var drafts = JSON.parse(localStorage.getItem('form_drafts')||'{}');
      if(drafts[formKey]){
        var deletedSet = {};
        if(typeof getDeletedKeysFor==='function'){
          getDeletedKeysFor(formKey).forEach(function(k){ deletedSet[k] = true; });
        }
        var draftKeys = Object.keys(drafts[formKey]);
        var changed = false;
        draftKeys.forEach(function(k){
          // 只清「使用者主動刪除」且「目前 merge 後也確實沒有」的評分 key
          if(/^f\d/.test(k) && !d.hasOwnProperty(k) && deletedSet[k]){
            delete drafts[formKey][k];
            changed = true;
          }
        });
        if(changed) localStorage.setItem('form_drafts', JSON.stringify(drafts));
      }
    }catch(e){}
  }catch(e){
    console.warn('[refreshFormUI] error:', e);
  }
}

function setRating(fid,key,val,role,btn){
  // ★ 統一寫入 canonical formKey，不再雙寫
  var bareId = fid.indexOf('_')>=0 ? fid.split('_')[0] : fid;
  var targetKey = getCanonicalKey(bareId);
  if(!APP.formData[targetKey])APP.formData[targetKey]={};
  // ★ 「再點同一值 = 清除」:若目前已選中就是這個 val,點下去視為取消
  var curVal = APP.formData[targetKey][key];
  var isToggleOff = (curVal!==undefined && curVal!==null && curVal!=='' && (curVal==val || curVal===String(val)));

  // ★★★【v1.5.5 修正:畫面/資料不同步保護】★★★
  // 場景:loadFormFromSheets 把資料 merge 進記憶體後,refreshFormUI 因 race condition
  //      或其他原因沒能把按鈕視覺更新成選中。此時使用者看到「按鈕未選」就去點,
  //      程式卻判定「再點同一值=清除」,跳出「✓已清除」訊息 → 使用者很困惑。
  // 修法:除了記憶體有值,還要確認「該按鈕視覺上真的是選中狀態」才算 toggle off。
  //      若記憶體有值但按鈕看起來未選 → 視為「重新選擇此值」,把按鈕視覺也同步上來。
  if(isToggleOff && btn){
    var btnVisuallySelected = false;
    // F01A/F01B inline-style 按鈕:檢查 background 是否為非白色
    var bg = (btn.style && btn.style.background) || '';
    if(bg && bg !== '' && bg.indexOf('#fff') !== 0 && bg !== 'rgb(255, 255, 255)' && bg !== 'white'){
      btnVisuallySelected = true;
    }
    // 一般 r-btn:檢查是否有 sel-s/sel-t/sel-a class
    if(btn.classList && (btn.classList.contains('sel-s') || btn.classList.contains('sel-t') || btn.classList.contains('sel-a'))){
      btnVisuallySelected = true;
    }
    // 若按鈕視覺上其實沒被選中 → 取消 toggle off,改成「重新選擇」
    if(!btnVisuallySelected){
      isToggleOff = false;
      console.warn('[setRating] 偵測到資料/畫面不同步:記憶體有值 '+curVal+' 但按鈕視覺未選中,改為重新選擇 '+val);
    }
  }

  if(isToggleOff){
    delete APP.formData[targetKey][key];
    // ★ 標記為「已刪除」,避免下次從雲端拉回時復活
    if(typeof markFieldDeleted==='function') markFieldDeleted(targetKey, key);
  } else {
    APP.formData[targetKey][key]=val;
    // ★ 使用者主動填值 → 從「已刪除清單」移除
    if(typeof unmarkFieldDeleted==='function') unmarkFieldDeleted(targetKey, key);
  }
  // localStorage
  try{
    var drafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    if(!drafts[targetKey])drafts[targetKey]={};
    if(isToggleOff){
      delete drafts[targetKey][key];
    } else {
      drafts[targetKey][key]=val;
    }
    localStorage.setItem('form_drafts',JSON.stringify(drafts));
  }catch(e){}
  // Update button visuals
  document.querySelectorAll('[data-rkey="'+key+'"]').forEach(function(b){
    b.classList.remove('sel-s','sel-t','sel-a');
    // 清除後所有按鈕都不選中;否則只有對應 val 的按鈕選中
    if(!isToggleOff && (b.dataset.rval==val||b.dataset.rval===String(val))){
      b.classList.add(role==='t'?'sel-t':role==='a'?'sel-a':'sel-s');
    }
  });
  // 清除時跳 toast 提示
  if(isToggleOff){
    try{ toast('✓ 已清除此項評分'); }catch(e){}
  }
  // ★ 觸發自動儲存
  if(typeof updateFormProgress==='function'){try{updateFormProgress();}catch(e){}}
  if(typeof scheduleAutoSave === 'function') scheduleAutoSave(bareId);
}

/* f01Click：F01A/F01B 評分按鈕 */
function f01Click(btn){
  if(btn.disabled) return;
  var key=btn.getAttribute('data-rkey');
  var val=btn.getAttribute('data-rval');
  var fid=btn.getAttribute('data-fid');
  var isTeacher=btn.getAttribute('data-teacher')==='1';
  var role=isTeacher?'t':'s';

  // ★ 偵測「再點同一值 = 清除」
  //   F01B/F01A 用 inline style 染色,需要先從資料判斷「目前是不是這個值」,
  //   不能只看 DOM(因為按鈕 DOM 同 rkey 有 4 個,要看資料才準)
  var bareId = fid.indexOf('_')>=0 ? fid.split('_')[0] : fid;
  var targetKey = (typeof getCanonicalKey==='function') ? getCanonicalKey(bareId) : fid;
  var curVal = (APP.formData[targetKey] && APP.formData[targetKey][key]) || '';
  var isToggleOff = (curVal && curVal===val);

  // ★★★【v1.5.5 修正:畫面/資料不同步保護】★★★
  // 場景同 setRating:loadFormFromSheets 後 race 導致按鈕視覺與記憶體不同步。
  // 若記憶體 curVal===val 但畫面上 **沒有任何按鈕視覺被選中**(整組都白底)→
  // 表示畫面狀態落後於資料,這次點擊應該是「重新選擇此值」而非「清除」。
  if(isToggleOff){
    var anyVisuallySelected = false;
    document.querySelectorAll('[data-rkey="'+key+'"]').forEach(function(b){
      var bg = (b.style && b.style.background) || '';
      // 只要不是白底就算被選中(F01A/F01B 選中時是藍/紅/灰底)
      if(bg && bg !== '' && bg.indexOf('#fff') !== 0 && bg !== 'rgb(255, 255, 255)' && bg !== 'white'){
        anyVisuallySelected = true;
      }
    });
    if(!anyVisuallySelected){
      isToggleOff = false;
      console.warn('[f01Click] 偵測到資料/畫面不同步:記憶體有 '+curVal+' 但 4 個按鈕都未選中,改為重新選擇 '+val);
    }
  }

  // 更新 inline style(F01A/F01B 按鈕用 inline style 不是 CSS class)
  var selBg=isTeacher?'#9F1239':'#4D7C0F';
  document.querySelectorAll('[data-rkey="'+key+'"]').forEach(function(b){
    // 清除時所有按鈕都回到未選樣式;否則只有對應 val 的按鈕變色
