<!-- ═══════════════ v19.5 修補（前端）═══════════════
  ★ FIX【清空的欄位刪不掉】F13 書面個案報告評分表、F14 個案報告 PPT 評分表，
     以及所有文字框／文字區塊，刪掉內容後切換表單再回來，舊值會復活。
     根因：saveDraftField 把清空寫成 ''，但沒有登記「刪除墩碑」；
     而 saveFormToSheets 的合併策略是「雲端為底、本次非空值才覆蓋」，
     '' 永遠覆蓋不掉雲端舊值，且合併結果會回寫記憶體 → 舊值當場復活。
     修法：saveDraftField 清空時改為 delete + markFieldDeleted()，重新填值時
     unmarkFieldDeleted()；openForm / saveForm 的「非空值補位」合併後
     一律再套用一次墩碑清單。
  ★ 墩碑在雲端回報寫入成功後即撤銷（原本固定活 24 小時），
     避免它誤刪別台裝置後來填回的值。
  ★ 老師端「學生欄位」由原本的「點擊跳確認框」升級為「唯讀」：
     文字類用 readonly（可讀可選取可捲動）、選項類用 disabled、
     學生評分按鈕不可點。管理員不受影響，維持完整編輯權限。
────────────────────────────────────────────────── -->
<!-- ═══════════════ v19.4 修補摘要（前端）═══════════════
  ★ FIX 1【致命】自助註冊後呼叫不存在的 setSessionToken() → 改為 saveSession()
  ★ FIX 2【致命】改學號後 Forms 的 formId 尾綴沒跟著改 → GAS v19.4 會一併搬移，
        前端顯示搬移筆數；後端版本太舊時會出現警告。
  ★ FIX 3【學期同步】
        · loadAccounts 回傳的 studentTerms / studentTermsAt / defaultNewTerm 現在真的會被採用
        · 學期改走專屬 setStudentTerm 批次 API（後端權威 + 伺服器蓋時間戳）
        · saveConfig 不再挾帶學期對照表（杜絕舊分頁把舊學期推回雲端）
        · applyConfig 對學期改為純補位，永不覆蓋、永不清除
        · 後台新增「☁ 將本機學期一次同步到雲端」按鈕（升級後按一次）
  ⚠ 本版需搭配 GAS v19.4（setStudentTerm / setCohortTerm 兩支 action）；
     後端未更新時會自動退回相容模式，功能不中斷。
────────────────────────────────────────────────── -->
<!-- ═══════════════ CONTENT SECURITY POLICY ═══════════════
     防止 XSS 攻擊。允許清單僅包含本系統實際依賴的網域：
     - Google Fonts (CSS + 字型檔)
     - Google Apps Script (後端 API)
     - Google Sheets API (OAuth 寫入)
     - Google Identity Services (OAuth)
     unsafe-inline 為 style 必要 (大量 inline style)；script 不允許 unsafe-inline 除了本檔內的 <script>
     若需新增外部資源，請在此處明確列出網域。
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: blob: https:;
  connect-src 'self' https://script.google.com https://script.googleusercontent.com https://sheets.googleapis.com https://accounts.google.com https://oauth2.googleapis.com;
  frame-src https://accounts.google.com https://script.google.com https://script.googleusercontent.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self' https://script.google.com https://script.googleusercontent.com;
">
<title>臺中榮總 — 長期呼吸治療學實習 e-Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ─── 配色系統 v3 ─── 長期呼吸治療學實習：橄欖苔綠 × 勃根地酒紅 ─── */
  /* 設計說明：
     · 學生填寫區 = 橄欖苔綠（沉穩、耐看，與小兒版的湖水綠、重症版的鈷藍明顯區隔）
     · 老師填寫區 = 勃根地酒紅（比重症版的正紅更深、更帶紫調，一眼可分辨）
     · 警示訊息   = 保留琥珀黃（第三色，不與學生/老師撞色）
     · 底色       = 暖砂米白，整體呈現「紙本檔案夾」的質感              */
  --topbar-h:     56px;

  /* 中性色（主背景與文字）*/
  --bg:           #F7F6F1;       /* 主背景：暖砂米白 */
  --bg-soft:      #EFEDE4;       /* 次背景 */
  --paper:        #FFFFFF;       /* 卡片底色：純白 */
  --ink:          #24261E;       /* 主要文字：深橄欖墨 */
  --ink2:         #4A4E40;       /* 次要文字 */
  --ink3:         #737866;       /* 輔助文字 */
  --ink4:         #A3A794;       /* 提示文字 */

  /* 主色：橄欖苔綠（= 學生色）*/
  --primary:      #4D7C0F;       /* 主色 */
  --primary2:     #3F6212;       /* 主色深 */
  --primary-soft: #F0F6E1;       /* 主色淡底 */
  --primary-line: #C9E08D;       /* 主色淡邊 */

  /* 強調色（黃銅金點綴）*/
  --gold:         #A97C2B;
  --gold2:        #CE9F45;
  --gold-soft:    #FAF2DF;

  /* 狀態色 */
  --red:          #9F1239;       /* 勃根地酒紅：警告 / 老師 */
  --red-soft:     #FFE9EF;
  --red-line:     #F6B3C6;
  --green:        #047857;       /* 成功 / 已完成 */
  --green-soft:   #D3F4E5;
  --green-line:   #9DE0C2;
  --blue:         #4D7C0F;       /* 學生 = 主色（橄欖苔綠）*/
  --blue-soft:    #F0F6E1;
  --blue-line:    #C9E08D;

  /* 老師專用色（勃根地酒紅系）*/
  --teacher:      #9F1239;
  --teacher2:     #831234;
  --teacher-soft: #FFF4F6;
  --teacher-line: #EDA9BC;

  /* 邊線與陰影 */
  --border:       #DED8C8;       /* 主邊線 */
  --border2:      #EAE6DA;       /* 次邊線 */
  --shadow-sm:    0 1px 2px rgba(36,38,30,.04), 0 1px 3px rgba(36,38,30,.06);
  --shadow:       0 2px 4px rgba(36,38,30,.06), 0 4px 12px rgba(36,38,30,.08);
  --shadow-lg:    0 4px 8px rgba(36,38,30,.08), 0 12px 24px rgba(36,38,30,.10);

  /* 向下相容（舊變數仍指向新色）*/
  --cream:        var(--bg);
  --border-old:   var(--border);

  /* 字型與圓角 */
  --ff-serif:'Noto Serif TC',serif;
  --ff-sans:'Noto Sans TC',sans-serif;
  --r:    8px;
  --r2:   12px;
  --r-sm: 4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ff-sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

/* ─── WATERMARK TEXTURE ─── 改為極淡的點狀紋理 ─── */
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(77,124,15,.05) 1px, transparent 0);background-size:24px 24px;pointer-events:none;z-index:0;}

/* ─── SCREENS ─── */
.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;}

/* ─── LOGIN ─── 方案B：白底卡 + 深藍頂條，靠左排版（醫療文件感） ─── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:#F4F6FA;}
.login-card{background:var(--paper);border:1px solid #E5EAF1;border-radius:var(--r2);box-shadow:0 1px 3px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);width:100%;max-width:460px;overflow:hidden;}
.login-header{background:#FFFFFF;border-top:4px solid #3F6212;padding:2rem 2rem 1.5rem;text-align:left;position:relative;}
.login-header::after{display:none;}
.login-header .hosp{font-size:11px;color:#3F6212;letter-spacing:2px;margin-bottom:8px;font-family:var(--ff-sans);font-weight:600;}
.login-header .title{font-family:var(--ff-serif);font-size:22px;color:#1A2332;font-weight:600;line-height:1.4;text-shadow:none;letter-spacing:.5px;}
.login-header .sub{font-size:11px;color:#6B7689;margin-top:8px;letter-spacing:.5px;}
.login-body{padding:2rem;}
.role-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.5rem;background:var(--bg-soft);}
.role-tab{flex:1;padding:11px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink3);background:transparent;transition:all .2s;border:none;border-right:1px solid var(--border);}
.role-tab:last-child{border-right:none;}
.role-tab.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:inset 0 -2px 0 var(--gold);}
.fg{margin-bottom:1.1rem;}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
.fg input,.fg select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:var(--ink);font-size:13px;font-family:var(--ff-sans);outline:none;transition:all .2s;}
.fg input:focus,.fg select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(77,124,15,.14);}
.login-err{font-size:12px;color:var(--red);margin-top:6px;display:none;background:var(--red-soft);padding:6px 10px;border-radius:var(--r);border:1px solid var(--red-line);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff-sans);letter-spacing:.5px;transition:all .2s;margin-top:.25rem;box-shadow:var(--shadow-sm);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{width:100%;padding:10px;background:transparent;color:var(--ink3);border:1px solid var(--border);border-radius:var(--r);font-size:12px;cursor:pointer;font-family:var(--ff-sans);margin-top:8px;transition:all .2s;}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.divider{display:flex;align-items:center;gap:10px;margin:1rem 0;}
.divider-line{flex:1;height:1px;background:var(--border2);}
.divider-text{font-size:11px;color:var(--ink3);}
.strength-bar{height:3px;border-radius:3px;background:var(--border2);margin-top:5px;overflow:hidden;}
.strength-fill{height:100%;border-radius:3px;transition:width .3s,background .3s;width:0;}
.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:38px !important;}
.pwd-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px 8px;color:var(--ink3);user-select:none;line-height:1;border-radius:4px;transition:background .15s;}
.pwd-eye:hover{color:var(--primary);background:var(--primary-soft);}

/* ─── MAIN APP ─── */
#app-screen{min-height:100vh;}
.topbar{background:linear-gradient(100deg,#3F6212,#4D7C0F);color:#fff;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(15,23,42,.15);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-family:var(--ff-serif);font-size:15px;font-weight:600;letter-spacing:.3px;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.user-badge{font-size:11px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;color:#fff;font-weight:500;backdrop-filter:blur(8px);}
.role-chip{font-size:10px;padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.3px;}
.chip-s{background:rgba(255,255,255,.95);color:var(--green);}
.chip-t{background:rgba(255,255,255,.95);color:var(--red);}
.chip-a{background:rgba(255,255,255,.95);color:var(--gold);}
.logout-btn{padding:6px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:var(--r);color:#fff;font-size:11px;cursor:pointer;transition:all .15s;font-weight:500;}
.logout-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);}

/* ─── F16 表頭:用 fixed 浮動表頭(不用 sticky,因為 sticky 在 <th> 上會被 <table> 困住) ─── */
/* 原始表頭:正常 thead,沒有 sticky */
.sticky-th{background:#1A3A5C !important;background-clip:padding-box;color:#fff;padding:5px 6px !important;border:1px solid #DDD;border-bottom:3px solid #B8860B;}
/* 浮動表頭:fixed 在 topbar + quick-nav 下方,JS 控制顯示/隱藏與寬度
   ★ top 用 CSS 變數 --f16-fh-top,由 JS 動態量測 (topbar + quick-nav) 後設定,
     避免硬寫像素造成手機版換行時遮住狀態列。
   ★ z-index 145 — 比 quick-nav (150) 低,確保 quick-nav 永遠在浮動表頭上方;
     比一般內容高,確保浮動表頭不被內容遮住。 */
.f16-floating-thead{position:fixed;left:0;right:0;top:var(--f16-fh-top,calc(var(--topbar-h) + 44px));z-index:145;background:#1A3A5C;color:#fff;border-bottom:3px solid #B8860B;box-shadow:0 6px 8px -2px rgba(0,0,0,.25);display:none;pointer-events:none;}
.f16-floating-thead.show{display:block;}
.f16-floating-thead table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;table-layout:fixed;}
.f16-floating-thead th{background:#1A3A5C;color:#fff;padding:5px 6px;border:1px solid rgba(255,255,255,.1);text-align:center;font-weight:600;}
.f16-floating-thead th:nth-child(2){text-align:left;}
@media(max-width:768px){
  .f16-floating-thead th{padding:3px 2px;font-size:10px;line-height:1.1;}
  .f16-floating-thead th br{display:none;}
  .f16-floating-thead th span{font-size:9px;display:inline;margin-left:2px;font-weight:400;}
}
/* 表格容器 */
.f16-table-wrap{isolation:isolate;}
/* 第一行 tbody tr 留較大上邊距,讓使用者捲到第 1 題時有充足過渡空間 */
.f16-table-wrap tbody tr:first-child td{padding-top:28px !important;}
/* 所有題目列 scroll-margin-top */
.f16-table-wrap tbody tr{scroll-margin-top:calc(var(--topbar-h) + 60px);}

/* ─── BODY LAYOUT ─── */
.app-body{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:220px;background:var(--paper);border-right:1px solid var(--border);padding:1.25rem 0;flex-shrink:0;box-shadow:1px 0 3px rgba(15,23,42,.03);}
@media(max-width:768px){
  input[type="date"],input[type="number"]{min-width:0;width:100%;box-sizing:border-box;}

  .app-body{flex-direction:column;}
  .sidebar{display:none !important;}
  .main-content{width:100% !important;min-height:calc(100vh - 56px);}
  .form-detail-view{padding:.6rem;}
  .form-list-view{padding:.75rem;}
  .g2,.g3{grid-template-columns:1fr !important;}
  .card-body{padding:.75rem;}
  .form-grid{grid-template-columns:1fr !important;}
  .mobile-nav{display:flex !important;}
  .admin-section{padding:.75rem;}
  .admin-row{flex-wrap:wrap;}
  .rating-table th,.rating-table td{padding:4px 3px;font-size:10px;}
  .r-btn{width:24px;height:24px;font-size:9px;}

  /* ─── 手機版 topbar:佔位用,實際規則移到 768px media query 外的獨立規則(見下方) ─── */

  /* ─── 手機版 可摺疊群組工具列:換行+小尺寸 ─── */
  .collapsible-toolbar{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:10px;}
  .collapsible-toolbar > div:first-child{font-size:11px;line-height:1.5;}
  .collapsible-toolbar-actions{width:100%;}
  .collapsible-toolbar-btn{flex:1;padding:7px 8px;font-size:11px;}

  /* 群組標題在手機上多行排:標題列佔上、進度列佔下 */
  .collapsible-header{flex-wrap:wrap;padding:10px 12px;gap:8px;}
  .collapsible-title{font-size:13px;line-height:1.4;flex:1 1 calc(100% - 40px);}
  .collapsible-summary{flex:1 1 100%;justify-content:flex-end;font-size:10px;}
  .collapsible-progress{padding:2px 8px;font-size:10px;}
  .collapsible-progress-bar{width:40px;height:4px;}
  .collapsible-status-tags .stag{font-size:9px;padding:2px 6px;}
  .collapsible-body{padding:10px 12px 12px;}
  /* ─── 手機版 F16 表格進一步壓縮欄寬 + 縮小表頭高度 ─── */
  /* 重點:壓縮表頭高度到極小,減少遮蔽下方題目的範圍 */
  .f16-table-wrap th.sticky-th{padding:3px 2px !important;font-size:10px;line-height:1.1 !important;}
  .f16-table-wrap td{padding:7px 4px !important;}
  .f16-table-wrap th.sticky-th:nth-child(1){width:22px !important;}
  .f16-table-wrap th.sticky-th:nth-child(3),
  .f16-table-wrap th.sticky-th:nth-child(4),
  .f16-table-wrap th.sticky-th:nth-child(5){width:42px !important;}
  /* 把 br 換成空格,讓 0/1/2 與 不像/有點像/很像 同行,大幅減少表頭高度 */
  .f16-table-wrap th.sticky-th br{display:none !important;}
  .f16-table-wrap th.sticky-th span{font-size:9px !important;display:inline !important;margin-left:2px !important;font-weight:400 !important;}
  /* 第一行 td 留更大上邊距,讓使用者捲到第 1 題時題目文字不會貼著表頭底部 */
  .f16-table-wrap tbody tr:first-child td{padding-top:18px !important;}
}

/* ════════════════════════════════════════════════════════════════════
 * ★ 手機版 topbar 兩排式佈局 — 獨立 media query,最高 specificity
 *
 * 為什麼獨立寫,而不放在上面的 @media(max-width:768px) 內:
 *   多次嘗試在 768px media query 內套用 column / flex-wrap 都失效。
 *   懷疑原因:某些 iOS Safari 版本對「同 selector 在 media query 內二次定義」
 *   的處理優先級異常,且原始 .topbar 規則有 height:56px,
 *   會跟我們的 height:auto 拉鋸。
 *
 * 解法:
 *   1. 用 body .topbar 提高 specificity(0,1,1 vs 原本的 0,0,1)
 *   2. 用 !important 雙重保險
 *   3. 斷點放寬到 1100px,確保任何手機/平板必定匹配
 *      (桌機通常 ≥ 1280px,不會影響)
 *   4. 規則放在所有原本 topbar 規則之後,優先級最高
 *
 * 結構:
 *   桌機版單排:[標題+副標題......][用戶][角色][首頁][同步][登出]
 *   手機版兩排:
 *     第一排:[標題 + 副標題]                                   ← 100% 寬,左對齊
 *     第二排:                  [用戶][角色][首頁][同步][登出]   ← 100% 寬,右對齊
 * ════════════════════════════════════════════════════════════════════ */
@media (max-width: 1100px) {
  body .topbar {
    height: auto !important;
    min-height: 52px !important;
    padding: 6px 10px !important;
    flex-wrap: wrap !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 4px !important;
  }
  body .topbar .topbar-left {
    flex: 1 1 100% !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;

}
.mobile-nav{display:none;background:var(--paper);border-bottom:1px solid var(--border);padding:10px 12px;gap:6px;overflow-x:auto;align-items:center;position:sticky;top:56px;z-index:40;box-shadow:0 1px 3px rgba(15,23,42,.04);}
.mobile-nav-btn{padding:7px 14px;border:1px solid var(--border);border-radius:999px;font-size:11px;white-space:nowrap;cursor:pointer;color:var(--ink2);background:#fff;flex-shrink:0;transition:all .15s;font-weight:500;}
.mobile-nav-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(37,99,235,.25);}
.mobile-menu-select{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--paper);color:var(--ink);max-width:100%;}
.sidebar-section{padding:0 1rem .5rem;font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:1.2px;text-transform:uppercase;margin-top:1rem;}
.sidebar-item{padding:9px 1.25rem;font-size:12px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;border-left:3px solid transparent;}
.sidebar-item:hover{background:var(--bg-soft);color:var(--ink);}
.sidebar-item.active{background:var(--primary-soft);border-left-color:var(--primary);color:var(--primary2);font-weight:600;}
.sidebar-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.dot-done{background:var(--green);}

.dot-partial{background:#F59E0B;}
.dot-draft{background:#0EA5E9;animation:draftPulse 2s ease-in-out infinite;}
.dot-new{background:var(--ink4);}
@keyframes draftPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.main-content{flex:1;overflow-y:auto;}

/* ─── FORM LIST (dashboard) ─── */
.form-list-view{padding:1.5rem;}
.section-header{display:flex;align-items:baseline;gap:10px;margin:1.5rem 0 1rem;padding:0 0 8px 0;border-bottom:2px solid var(--border2);}
.section-header:first-child{margin-top:0;}
.section-header h2{font-family:var(--ff-serif);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.5px;}
.section-header span{font-size:11px;color:var(--ink3);background:var(--bg-soft);padding:3px 9px;border-radius:999px;}

/* ─── 可摺疊群組(總覽用) ─── */
.collapsible-group{margin:1.25rem 0;border:1px solid var(--border);border-radius:10px;background:var(--paper);overflow:hidden;transition:box-shadow .2s;}
.collapsible-group:hover{box-shadow:var(--shadow-sm);}
.collapsible-group.is-open{box-shadow:var(--shadow);}
.collapsible-group:first-child{margin-top:0;}
.collapsible-header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none;background:linear-gradient(180deg,var(--cream) 0%,var(--paper) 100%);border-bottom:1px solid transparent;transition:all .15s;}
.collapsible-group.is-open .collapsible-header{border-bottom-color:var(--border2);background:linear-gradient(180deg,var(--cream) 0%,var(--cream) 100%);}
.collapsible-header:hover{background:var(--cream);}
.collapsible-caret{font-size:12px;color:var(--ink3);transition:transform .2s;flex-shrink:0;width:14px;text-align:center;font-weight:700;}
.collapsible-group.is-open .collapsible-caret{transform:rotate(90deg);color:var(--primary);}
.collapsible-title{flex:1;font-family:var(--ff-serif);font-size:15px;font-weight:600;color:var(--ink);}
.collapsible-summary{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);}
.collapsible-progress{display:inline-flex;align-items:center;gap:6px;background:var(--bg-soft);padding:3px 10px;border-radius:999px;font-weight:600;}
.collapsible-progress-bar{width:50px;height:5px;background:var(--border2);border-radius:3px;overflow:hidden;display:flex;}
.collapsible-progress-bar > div{height:100%;transition:width .4s;}
.collapsible-progress-bar .pb-done{background:var(--green);}
.collapsible-progress-bar .pb-draft{background:#7DD3FC;}
.collapsible-status-tags{display:flex;gap:4px;flex-wrap:wrap;}
.collapsible-status-tags .stag{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;line-height:1.4;}
.collapsible-status-tags .stag-done{background:#DCFCE7;color:#166534;}
.collapsible-status-tags .stag-draft{background:#E0F2FE;color:#075985;}
.collapsible-status-tags .stag-new{background:#F1F5F9;color:#64748B;}
.collapsible-status-tags .stag-allgood{background:#FEF3C7;color:#92400E;}
.collapsible-body{display:none;padding:14px 16px 16px;}
.collapsible-group.is-open .collapsible-body{display:block;animation:collFadeIn .25s ease-out;}
@keyframes collFadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.collapsible-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.collapsible-toolbar-actions{display:flex;gap:8px;}
.collapsible-toolbar-btn{font-size:12px;padding:6px 12px;border:1px solid var(--border);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500;transition:all .15s;}
.collapsible-toolbar-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--cream);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.form-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.15rem;cursor:pointer;transition:all .2s;position:relative;box-shadow:var(--shadow-sm);}
.form-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px);}
.form-card-num{font-size:10px;color:var(--primary2);margin-bottom:4px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.form-card-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;}
.form-card-sub{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.4;}
.form-card-meta{margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tag{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.2px;}
.tag-both{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line);}
.tag-student{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line);}
.tag-teacher{background:#FBE3EA;color:#831234;border:1px solid #EDA9BC;}
.form-card-status{font-size:10px;color:var(--ink3);}

/* ─── FORM DETAIL ─── */
.form-detail-view{padding:1.5rem;max-width:900px;}
.form-detail-header{background:linear-gradient(120deg,#3F6212,#4D7C0F);color:#fff;border-radius:var(--r2);padding:1.4rem 1.5rem;margin-bottom:1.25rem;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.form-detail-header::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(194,138,44,.7);}
.form-detail-header::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none;}
.form-detail-header h1{font-family:var(--ff-serif);font-size:18px;font-weight:600;letter-spacing:.5px;}
.form-detail-header .fh-meta{font-size:11px;color:rgba(255,255,255,.75);margin-top:5px;letter-spacing:.3px;}

/* ─── LOCK BAR ─── 改成警告色明亮樣式 ─── */
.lock-bar{background:linear-gradient(90deg,#FEF3C7 0%,#FDE68A 100%);border:1px solid #F59E0B;border-radius:var(--r);padding:11px 16px;margin-bottom:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#78350F;font-weight:500;box-shadow:0 1px 3px rgba(245,158,11,.15);}
.lock-bar input{padding:6px 10px;border:1px solid #D97706;border-radius:var(--r);font-size:12px;background:#fff;width:100px;color:var(--ink);outline:none;transition:all .15s;}
.lock-bar input:focus{box-shadow:0 0 0 2px rgba(217,119,6,.25);border-color:#B45309;}
.lock-bar .unlock-btn{padding:6px 14px;background:#92400E;color:#fff;border:none;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.3px;}
.lock-bar .unlock-btn:hover{background:#78350F;transform:translateY(-1px);}

/* ─── CARDS ─── */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:1.1rem;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s;}
.card:hover{box-shadow:var(--shadow);}
.card-head{background:linear-gradient(180deg,#F8FAFC 0%,#F1F5F9 100%);border-bottom:1px solid var(--border2);padding:11px 1.2rem;display:flex;align-items:center;gap:8px;}
.card-head-title{font-family:var(--ff-serif);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.5px;}

/* ─── Serif utility:分數顯示（評值結果、課後測驗、F-PRE/POST） ─── */
.score-display{font-family:var(--ff-serif);font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.score-display-sm{font-family:var(--ff-serif);font-size:20px;font-weight:600;letter-spacing:-.3px;}
/* ─── Serif utility:簽名顯示（學生/老師/主持人簽名顯示） ─── */
.signature-display{font-family:var(--ff-serif);font-size:15px;color:var(--ink);letter-spacing:1px;padding:2px 8px;display:inline-block;}
.card-body{padding:1.2rem;}

/* ─── 統一配色標準 ───
   學生區（藍）：邊框 #93C5FD、底色 #F0F7FF、標題列漸層 #3B82F6→#1D4ED8（白字）
   老師區（紅）：邊框 #FCA5A5、底色 #FFF5F5、標題列漸層 #DC2626→#991B1B（白字）
   這個色組是全站基準，所有「學生／老師」區塊都遵循，避免深淺不一。 */

/* 學生卡片 */
.card.s-card{background:#F5F9EC;border:2px solid #C9E08D;}
.card.s-card .card-head{background:linear-gradient(135deg,#4D7C0F 0%,#3F6212 100%);border-bottom:none;}
.card.s-card .card-head-title{color:#fff;}

/* 老師卡片（手動加 class） */
.card.t-card{background:var(--teacher-soft);border:2px solid var(--teacher-line);}
.card.t-card .card-head{background:linear-gradient(135deg,var(--teacher) 0%,var(--teacher2) 100%);border-bottom:none;}
.card.t-card .card-head-title{color:#fff;}

/* 混合卡片（共同填寫） */
.card.m-card{background:linear-gradient(180deg,#F5F9EC 0%,var(--teacher-soft) 100%);}
.card.m-card .card-head{background:linear-gradient(90deg,#F0F6E1 0%,#FBE3EA 100%);}
.card.m-card .card-head-title{color:#1F2937;}

/* ─── 自動套用「老師」配色：所有 card-head 內含 t-badge 的卡片，自動視為老師卡片 ───
   不論 build 函式是否手動加上 .t-card class，只要標題列寫了 <span class="t-badge">老師</span>
   就會自動上紅色配色。這樣未來新增的卡片不需特別處理。 */
.card:not(.s-card):not(.m-card):has(.card-head .t-badge){
  background:var(--teacher-soft);
  border:2px solid var(--teacher-line);
}
.card:not(.s-card):not(.m-card):has(.card-head .t-badge) > .card-head{
  background:linear-gradient(135deg,var(--teacher) 0%,var(--teacher2) 100%);
  border-bottom:none;
}
.card:not(.s-card):not(.m-card):has(.card-head .t-badge) > .card-head .card-head-title{
  color:#fff;
}
/* 在白色標題列中，t-badge 應該變成半透明白色才看得見 */
.card.t-card .t-badge,
.card:not(.s-card):not(.m-card):has(.card-head .t-badge) > .card-head .t-badge{
  background:rgba(255,255,255,.25);
  color:#fff;
  border-color:rgba(255,255,255,.4);
}

/* 混合卡片內的學生／老師子區塊 */
.s-block{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:var(--r);padding:12px 14px;margin:10px 0;}
.s-block-title{font-size:12px;font-weight:700;color:#3F6212;margin-bottom:8px;letter-spacing:.2px;}
.t-block{background:var(--teacher-soft);border:1px solid var(--teacher-line);border-radius:var(--r);padding:12px 14px;margin:10px 0;}
.t-block-title{font-size:12px;font-weight:700;color:var(--teacher2);margin-bottom:8px;letter-spacing:.2px;}

/* ─── FIELDS ─── */
.field{margin-bottom:.95rem;}
.field:last-child{margin-bottom:0;}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.2px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:var(--ink);font-size:13px;font-family:var(--ff-sans);outline:none;transition:all .15s;box-shadow:inset 0 1px 2px rgba(15,23,42,.02);}
.field input:hover,.field textarea:hover,.field select:hover{border-color:#9CA5B5;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(77,124,15,.14);}
.field input:disabled,.field textarea:disabled,.field select:disabled{background:var(--bg-soft);color:var(--ink3);cursor:not-allowed;border-color:var(--border2);}
.field textarea{resize:vertical;min-height:72px;line-height:1.6;}
.t-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:#FBE3EA;color:var(--teacher2);border:1px solid var(--teacher-line);margin-left:6px;font-weight:600;letter-spacing:.2px;}
.s-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line);margin-left:6px;font-weight:600;letter-spacing:.2px;}
.m-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:linear-gradient(90deg,var(--blue-soft) 0%,#FBE3EA 100%);color:var(--teacher2);border:1px solid var(--teacher-line);margin-left:6px;font-weight:600;letter-spacing:.2px;}

/* ─── 表單填寫進度條(置於 form-detail-header 下方) ─── */
.form-progress{
  position:sticky;top:0;z-index:5;
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:8px 14px;
  margin:8px 0 14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
}
.form-progress-label{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;}
.form-progress-label .fp-num{color:var(--primary2);font-weight:700;font-size:13px;}
.form-progress-label .fp-pct{color:var(--ink3);font-size:11px;margin-left:6px;font-weight:500;}
.form-progress-track{flex:1;height:8px;background:#EEF2F7;border-radius:999px;overflow:hidden;position:relative;}
.form-progress-fill{height:100%;background:linear-gradient(90deg,#4D7C0F 0%,#3F6212 100%);border-radius:999px;transition:width .3s ease;width:0%;}
.form-progress.is-done .form-progress-fill{background:linear-gradient(90deg,#22C55E 0%,#059669 100%);}
.form-progress.is-done .form-progress-label .fp-num{color:#059669;}
@media(max-width:560px){
  .form-progress{padding:7px 10px;gap:8px;}
  .form-progress-label{font-size:11px;}
  .form-progress-label .fp-num{font-size:12px;}
  .form-progress-label .fp-pct{display:none;}
}

/* ─── 學生視角:老師欄位灰階淡化 (整體仍維持紅色色票,僅降低存在感) ───
   觸發條件:容器 .form-detail-view[data-role="student"]
   作用對象:
     1) [data-teacher="1"] 的輸入元素本體
     2) .field 內含 .t-badge 的整個 field 區塊
     3) .card.t-card 內非 .t-badge 的內容(包住老師區段時更安靜)
   保留:.t-badge 本身保持紅色清楚標示 */
.form-detail-view[data-role="student"] .field:has(.t-badge){
  opacity:.55;
  filter:grayscale(35%);
  transition:opacity .15s,filter .15s;
}
.form-detail-view[data-role="student"] .field:has(.t-badge):hover{
  opacity:.85;
  filter:grayscale(10%);
}
.form-detail-view[data-role="student"] [data-teacher="1"]:not(.t-badge){
  opacity:.7;
  filter:grayscale(25%);
}
.form-detail-view[data-role="student"] [data-teacher="1"]:not(.t-badge):hover{
  opacity:1;
  filter:none;
}
/* 在 t-card / m-card 中,讓老師區塊整體稍微降低存在感(只調 body,不調標題與 badge) */
.form-detail-view[data-role="student"] .card.t-card > .card-body{
  opacity:.72;
  filter:grayscale(20%);
  transition:opacity .15s,filter .15s;
}
.form-detail-view[data-role="student"] .card.t-card:hover > .card-body{
  opacity:.95;
  filter:grayscale(5%);
}
/* badge 本身永遠保持清楚紅色 */
.form-detail-view[data-role="student"] .t-badge{
  opacity:1 !important;
  filter:none !important;
}

/* ─── F16 學習策略推薦區塊 ─── */
.f16-strategy{
  margin-top:16px;
  border:1px solid #E2E8F0;
  border-radius:var(--r2);
  overflow:hidden;
  background:#FFFFFF;
}
.f16-strategy-head{
  background:linear-gradient(135deg,#C0392B 0%,#922B21 100%);
  color:#fff;
  padding:10px 16px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;
}
.f16-strategy-body{padding:12px 16px;font-size:12px;line-height:1.75;}
.f16-strategy-section{margin-bottom:12px;}
.f16-strategy-section:last-child{margin-bottom:0;}
.f16-strategy-section-title{
  font-size:12px;font-weight:700;color:#1E3A8A;
  margin-bottom:6px;padding-bottom:4px;
  border-bottom:1px solid #E5E7EB;
  display:flex;align-items:center;gap:6px;
}
.f16-strategy-style-block{
  background:#FFF5F5;border-left:3px solid #C0392B;
  border-radius:4px;padding:8px 12px;margin-bottom:8px;
}
.f16-strategy-style-block:last-child{margin-bottom:0;}
.f16-strategy-style-name{font-weight:700;color:#C0392B;font-size:12.5px;margin-bottom:4px;}
.f16-strategy-list{margin:4px 0 0 0;padding-left:18px;}
.f16-strategy-list li{margin-bottom:3px;color:#374151;}
.f16-weak-block{
  background:var(--teacher-soft);border-left:3px solid var(--teacher);
  border-radius:4px;padding:8px 12px;
  font-size:11.5px;color:#78350F;line-height:1.7;
}
.f16-weak-block strong{color:#92400E;}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr;}}

/* ─── RATING ─── */
.rating-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.rating-table th,.rating-table td{padding:8px 8px;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);vertical-align:middle;}
.rating-table th:last-child,.rating-table td:last-child{border-right:none;}
.rating-table tr:last-child td{border-bottom:none;}
.rating-table th{background:linear-gradient(180deg,#F8FAFC 0%,#F1F5F9 100%);font-size:11px;font-weight:700;color:var(--ink2);text-align:center;letter-spacing:.2px;}
.rating-table td.row-label{font-size:12px;color:var(--ink);text-align:left;background:#FCFCFD;}
.rating-table tbody tr:hover td{background:rgba(37,99,235,.02);}
.rating-table tbody tr:hover td.row-label{background:rgba(37,99,235,.05);}
/* Sticky first column for scrollable tables */
.sticky-col{position:sticky;left:0;z-index:1;background:#FCFCFD;}
.sticky-head{position:sticky;left:0;z-index:2;background:#F8FAFC;}
.r-btn{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:500;cursor:pointer;color:var(--ink3);transition:all .15s;}
.r-btn:not(:disabled):hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);transform:translateY(-1px);}
.r-btn.sel-s{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;box-shadow:0 2px 4px rgba(37,99,235,.25);}
.r-btn.sel-t{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;box-shadow:0 2px 4px rgba(220,38,38,.25);}
.r-btn.sel-a{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;box-shadow:0 2px 4px rgba(194,138,44,.25);}
.r-btn:disabled{cursor:not-allowed;opacity:.4;pointer-events:none;}
.r-btn:not(:disabled){cursor:pointer;}

/* ─── DOPS TABLE ─── */
.dops-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;border:1px solid #B45309;border-radius:var(--r);overflow:hidden;}
.dops-tbl th{background:linear-gradient(180deg,#D97706 0%,#B45309 100%);color:#fff;border-right:1px solid #B45309;padding:7px 5px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.2px;}
.dops-tbl th:last-child{border-right:none;}
.dops-tbl td{padding:6px 5px;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);vertical-align:middle;background:#fff;}
.dops-tbl td:last-child{border-right:none;}
.dops-tbl tr:last-child td{border-bottom:none;}
.dops-tbl .item-cell{font-size:11px;color:var(--teacher2);background:linear-gradient(90deg,var(--teacher-soft) 0%,#FBE3EA 100%);padding:6px 10px;font-weight:500;}
.d-btn{width:28px;height:28px;border-radius:6px;border:2px solid #E0A93C;background:#FFFBF0;font-size:12px;cursor:pointer;color:#B45309;transition:all .15s;font-weight:600;}
.d-btn:not(:disabled):hover{background:#FBE3B8;color:#7C3A06;border-color:#D97706;transform:translateY(-1px);}
.d-btn.sel{background:#D97706;color:#fff;border-color:#B45309;font-weight:800;box-shadow:0 2px 5px rgba(180,83,9,.4);}
.d-btn:disabled{cursor:not-allowed;opacity:.4;}

/* ─── EPA levels ─── */
.epa-level{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:8px;transition:all .2s;background:#fff;}
.epa-level.sel{border-color:var(--primary);background:linear-gradient(135deg,var(--primary-soft) 0%,#EFF6FF 100%);box-shadow:0 2px 8px rgba(37,99,235,.12);}
.epa-level:hover:not([data-locked]):not(.sel){border-color:var(--primary-line);background:#FBFAF4;transform:translateX(2px);}
.epa-level[data-locked]{cursor:not-allowed;opacity:0.6;pointer-events:none;background:var(--bg-soft);}
.epa-lv-num{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);}
.epa-lv-desc{font-size:12px;color:var(--ink2);}

/* ─── CHECK / RADIO ─── */
.check-group{display:flex;flex-wrap:wrap;gap:10px;}
.check-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:6px 10px;border-radius:var(--r);transition:background .15s;cursor:pointer;}
.check-item:hover{background:var(--bg-soft);}
.check-item input{accent-color:var(--primary);width:15px;height:15px;cursor:pointer;}

/* ─── FONT-SIZE NORMALIZATION ───
   全表單區字體統一規範，覆蓋所有 inline font-size 樣式
   - Labels（欄位標籤）       : 12px
   - Inputs/Textareas/Selects : 13px
   - Body text / 輔助文字     : 12px
   - 說明文字 / hint          : 11px
   - 表格內容                  : 12px
   - 評分按鈕（r-btn）        : 12px
   - 卡片標題                  : 13px
*/
.form-detail-view .field > label{font-size:12px !important;}
.form-detail-view .field input[type=text],
.form-detail-view .field input[type=number],
.form-detail-view .field input[type=date],
.form-detail-view .field textarea,
.form-detail-view .field select{font-size:13px !important;}
.form-detail-view .card-head-title{font-size:13px !important;}
.form-detail-view .check-item{font-size:12px !important;}
.form-detail-view .check-item input{flex-shrink:0;}
/* 表格內容統一 */
.form-detail-view .rating-table th,
.form-detail-view .rating-table td{font-size:12px;}
.form-detail-view .rating-table .row-label{font-size:12px !important;}
.form-detail-view .dops-tbl th,
.form-detail-view .dops-tbl td{font-size:12px;}
.form-detail-view .dops-tbl .item-cell{font-size:12px !important;}
/* badge 統一 */
.form-detail-view .t-badge,
.form-detail-view .s-badge,
.form-detail-view .m-badge{font-size:10px !important;}
/* 表單區內 inline span/div 預設字體（不影響特定 size class） */
.form-detail-view .card-body > div:not([class]),
.form-detail-view .card-body > span:not([class]){font-size:12px;}
/* 評分按鈕統一 */
.form-detail-view .r-btn{font-size:12px !important;}
.form-detail-view .d-btn{font-size:12px !important;}
/* lock-bar 與 saved-msg */
.form-detail-view .lock-bar{font-size:12px;}
/* 行動裝置：表格內字體微縮以利顯示，但仍維持一致 */
@media(max-width:768px){
  .form-detail-view .rating-table th,
  .form-detail-view .rating-table td,
  .form-detail-view .rating-table .row-label,
  .form-detail-view .dops-tbl th,
  .form-detail-view .dops-tbl td,
  .form-detail-view .dops-tbl .item-cell{font-size:10px !important;}
  .form-detail-view .r-btn,
  .form-detail-view .d-btn{font-size:10px !important;}
}
/* F01A/F01B 較窄標題列 */
.form-detail-view .f01b-label{font-size:11px !important;}

/* ─── FORM FOOTER ─── */
.form-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1.2rem 0 .5rem;flex-wrap:wrap;border-top:1px solid var(--border2);margin-top:1.2rem;}
.form-footer-right{display:flex;gap:10px;align-items:center;}
.saved-msg{font-size:12px;color:var(--green);font-weight:600;display:none;background:var(--green-soft);padding:5px 12px;border-radius:999px;border:1px solid var(--green-line);}
.btn-save{padding:11px 24px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary2) 100%);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px;box-shadow:0 2px 6px rgba(37,99,235,.25);}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.35);}
.btn-save:active{transform:translateY(0);}
.btn-pdf{padding:10px 20px;background:linear-gradient(135deg,var(--red) 0%,#B91C1C 100%);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;display:none;transition:all .2s;letter-spacing:.3px;box-shadow:0 2px 6px rgba(220,38,38,.25);}
.btn-pdf:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(220,38,38,.35);}
.btn-back{padding:10px 18px;background:#fff;color:var(--ink2);border:1px solid var(--border);border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500;transition:all .15s;}
.btn-back:hover{background:var(--bg-soft);border-color:var(--ink3);}

/* ─── HISTORY LOG ─── */
.history-log{margin-top:1.2rem;}
.history-title{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.history-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);margin-bottom:6px;background:#fff;font-size:11px;transition:all .15s;}
.history-item:hover{border-color:var(--primary-line);box-shadow:var(--shadow-sm);}
.history-time{color:var(--ink3);font-family:'SF Mono','Monaco','Cascadia Code',monospace;font-size:11px;}
.history-who{padding:2px 9px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.2px;}
.hw-s{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line);}
.hw-t{background:#FBE3EA;color:var(--teacher2);border:1px solid var(--teacher-line);}
.hw-a{background:var(--gold-soft);color:var(--gold);border:1px solid #ECD08C;}

/* ─── ADMIN PANEL ─── */
.admin-section{padding:1.5rem;}
.admin-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:1.1rem;overflow:hidden;box-shadow:var(--shadow-sm);}
.admin-card-head{background:linear-gradient(135deg,#1E40AF 0%,#2563EB 100%);color:#fff;padding:12px 1.3rem;font-family:var(--ff-serif);font-size:14px;font-weight:600;letter-spacing:.3px;}
.admin-card-body{padding:1.3rem;}
.admin-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.admin-row input{flex:1;min-width:120px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:#fff;color:var(--ink);transition:all .15s;}
.admin-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(77,124,15,.14);outline:none;}
.admin-row select{flex:1;min-width:120px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:#fff;color:var(--ink);}
.btn-add{padding:8px 16px;background:linear-gradient(135deg,var(--green) 0%,#047857 100%);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(5,150,105,.25);}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(5,150,105,.35);}
.btn-del{padding:6px 11px;background:#fff;color:var(--red);border:1px solid var(--red-line);border-radius:var(--r);font-size:11px;cursor:pointer;font-weight:500;transition:all .15s;}
.btn-del:hover{background:var(--red);color:#fff;border-color:var(--red);}
.btn-update{padding:7px 14px;background:linear-gradient(135deg,var(--gold) 0%,#A16207 100%);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(194,138,44,.25);}
.btn-update:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(194,138,44,.35);}
.accounts-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin-top:8px;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.accounts-table th{background:linear-gradient(180deg,#F8FAFC 0%,#F1F5F9 100%);padding:10px 12px;text-align:left;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.2px;}
.accounts-table th:last-child{border-right:none;}
.accounts-table td{padding:9px 12px;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);color:var(--ink);background:#fff;}
.accounts-table td:last-child{border-right:none;}
.accounts-table tr:last-child td{border-bottom:none;}
.accounts-table tbody tr:hover td{background:#FBFAF4;}
.gs-status{font-size:12px;padding:8px 12px;border-radius:var(--r);margin-top:6px;font-weight:500;}
.gs-ok{background:var(--green-soft);color:#065F46;border:1px solid var(--green-line);}
.gs-err{background:var(--red-soft);color:#991B1B;border:1px solid var(--red-line);}
.gs-info{background:var(--blue-soft);color:var(--primary2);border:1px solid var(--blue-line);}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:linear-gradient(135deg,var(--ink) 0%,var(--ink2) 100%);color:#fff;padding:12px 22px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-lg);transform:translateY(10px);}
.toast.show{opacity:1;transform:translateY(0);}

/* ─── QUICK NAV BUTTONS ─── */
.qnav-btn{padding:6px 14px;border-radius:999px;background:#fff;font-size:12px;cursor:pointer;transition:all .15s;font-weight:500;letter-spacing:.2px;}
.qnav-btn b{font-weight:700;margin:0 2px;}
.qnav-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.qnav-overview{border:1px solid var(--primary-line);color:var(--primary2);font-weight:600;}
.qnav-overview:hover{background:var(--primary-soft);}
.qnav-new{border:1px solid var(--border);color:var(--ink3);}
.qnav-new:hover{border-color:var(--ink3);color:var(--ink2);}
.qnav-draft{border:1px solid #BAE6FD;color:#075985;background:#F0F9FF;font-weight:600;}
.qnav-draft:hover{background:#E0F2FE;}
.qnav-draft b{color:#0C4A6E;}
.qnav-partial{border:1px solid #FCD34D;color:#92400E;background:#FFFBEB;}
.qnav-partial:hover{background:#FEF3C7;}
.qnav-done{border:1px solid var(--green-line);color:var(--green);font-weight:600;background:var(--green-soft);}
.qnav-done:hover{background:#A7F3D0;}

/* ─── PDF ─── */
@media print{
  .topbar,.sidebar,.form-footer,.lock-bar,.history-log,.btn-back,.btn-save,.btn-pdf,.toast{display:none !important;}
  .app-body{display:block;}
  .form-detail-view{padding:.5rem;}
  .main-content{overflow:visible;}
}

input,select,textarea,button{-webkit-text-size-adjust:100%;}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{font-size:16px !important;}

/* ─── 全域修正：所有 date input 不可超出容器 ─── */
input[type="date"]{
  box-sizing:border-box !important;
  max-width:100% !important;
  min-width:0 !important;
}

/* ══════════════════════════════════════════════════
   手機版響應式修正（僅在 < 768px 生效，不影響桌機）
   ══════════════════════════════════════════════════ */
@media (max-width: 767px) {

  /* 防止整體容器產生水平捲軸 */
  /* 注意：使用 overflow-x:clip 而非 hidden，否則會破壞內部 position:sticky
     (overflow:hidden 會讓元素變成 scroll container,導致 sticky 表頭錨定錯誤) */
  body, #main-content, .form-detail-body {
    max-width: 100vw;
    overflow-x: clip;
  }
  /* 手機版讓整個 body 捲動,而不是 main-content 內部捲動,
     這樣 .sticky-th 才會以視窗為基準黏在 topbar 下方 */
  .main-content { overflow-y: visible !important; }

  /* 3. 簽名欄位日期 input：全寬，不超出螢幕 */
  input[type="date"] {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    font-size: 16px;
  }

  /* input / select / textarea 防溢出 */
  input[type="text"], input[type="number"], input[type="password"],
  select, textarea {
    max-width: 100%;
    box-sizing: border-box;
    font-size: 16px;
  }

  /* 3. 簽名區 g2：強制單欄，確保日期欄位不被截斷 */
  .g2, .card .g2 {
    grid-template-columns: 1fr !important;
  }
  .g2 > *, .card .g2 > * {
    min-width: 0 !important;
    width: 100% !important;
  }

  /* g3 Grid：手機版改為單欄 */
  .g3 {
    grid-template-columns: 1fr !important;
  }
  .g3 > * {
    min-width: 0 !important;
  }

  /* 4+5. 所有表格允許橫向捲動（不截斷內容） */
  .card-body {
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
    padding: 10px 8px;
  }

  /* 4. F01B 指導者評核表格：sticky 首欄 + 橫向捲動 */
  .f01b-table {
    font-size: 9px !important;
    width: max-content;
    min-width: 100%;
  }
  .f01b-table th, .f01b-table td {
    padding: 2px 1px !important;
    font-size: 9px !important;
  }
  .f01b-label {
    font-size: 9px !important;
    max-width: 80px !important;
    min-width: 70px !important;
    word-break: break-all;
  }
  .f01b-table button {
    width: 20px !important;
    height: 20px !important;
    font-size: 8px !important;
    padding: 0 !important;
  }
  /* 一般 rating-table */
  .rating-table {
    font-size: 9px;
  }
  .rating-table th, .rating-table td {
    padding: 2px 2px;
    font-size: 9px;
  }
  .rating-table td.row-label {
    font-size: 9px;
  }

  /* 5. 所有表格外層：overflow-x:auto */
  .card-body table {
    max-width: none;
  }
  /* 呼吸器設定表格 */
  table td input[type="text"] {
    width: 32px !important;
    font-size: 10px !important;
    padding: 1px 2px !important;
  }

  .dops-tbl th, .dops-tbl td {
    font-size: 10px;
    padding: 3px 2px;
  }

  /* 快捷列允許換行 */
  .quick-nav {
    flex-wrap: wrap;
  }

  /* r-btn 評分按鈕在手機版調整 */
  .r-btn {
    min-width: 26px;
    padding: 3px 2px;
    font-size: 10px;
  }

  /* F04 呼吸器設定 input 小一點 */
  td input[type="text"] {
    width: 38px !important;
    font-size: 11px;
    padding: 2px 3px;
  }
}
/* ══════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════
   平板版面一致化修正（Tablet layout normalization）
   ────────────────────────────────────────────────
   問題：原本斷點只有「>768px = 桌機版」與「≤768px = 手機單欄」，
   中間 769–1024px 的平板（iPad Air≈820、iPad Pro≈834、12.9"直立=1024）
   仍套用桌機版：側欄續佔 220px、g3 擠成 3 欄、卡片只在「同一列」等高、
   跨列高度不一，於是看起來「有大有小、有長有短、有寬有窄」。
   下方規則為「純新增」，未更動任何既有規則，可整段刪除即還原。
   ══════════════════════════════════════════════════ */

/* (1) 多欄時（≥769px，平板與桌機）卡片每列等高，消除「有長有短」。
       手機（≤768px）為單欄，刻意不套用，避免短卡片被拉長留白。 */
@media (min-width:769px){
  .form-grid{grid-auto-rows:1fr;}
  .form-grid > .form-card{height:100%;display:flex;flex-direction:column;}
}

/* (2) 平板區間（769–1024px）：把多欄收斂成整齊欄數、欄位填滿格子 */
@media (min-width:769px) and (max-width:1024px){
  /* 三欄表單欄位在平板上過擠 → 收成兩欄，寬度才一致 */
  .g3{grid-template-columns:1fr 1fr;}
  /* 兩欄／三欄內的元素允許收縮，避免被內容撐到寬窄不一 */
  .g2 > *, .g3 > *{min-width:0;}
  /* 欄位輸入框一律填滿所屬格子，解決「有寬有窄」 */
  .g2 input, .g2 select, .g2 textarea,
  .g3 input, .g3 select, .g3 textarea{width:100%;box-sizing:border-box;}
  /* 卡片總覽：固定下限，讓每列欄數與寬度穩定一致 */
  .form-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
}

/* (3) 直立平板（769–834px，含 iPad/Air/Pro 11"）：卡片固定兩欄，最整齊 */
@media (min-width:769px) and (max-width:834px){
  .form-grid{grid-template-columns:repeat(2,1fr);}
}
/* ══════════════════════════════════════════════════ */
</style>

/* ═══════════════════════════════════════════════════════════════════════
   ★ 本機儲存空間隔離（LTC 專用命名空間）
   ───────────────────────────────────────────────────────────────────────
   問題：小兒版、重症版、長期版三套系統都放在同一個網域
         （https://popololoqoo-wei.github.io/…），瀏覽器的 localStorage
         是「以網域為單位」共用的，三套系統會互相看到對方的快取
         —— 例如長期版的後台會冒出小兒版的老師名單。
         用 file:// 在本機直接開檔時也一樣（Chrome 讓所有本機檔案共用）。

   解法：把本系統所有 localStorage 的 key 自動加上 'ltc_' 前綴，
         讓三套系統各用各的空間，完全互不干擾。
         程式其他地方完全不用改寫法。
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  var NS = 'ltc_';
  var real;
  try{ real = window.localStorage; }catch(e){ return; }
  if(!real) return;
  var shim = {
    getItem   : function(k){ try{ return real.getItem(NS+k); }catch(e){ return null; } },
    setItem   : function(k,v){ try{ return real.setItem(NS+k,v); }catch(e){} },
    removeItem: function(k){ try{ return real.removeItem(NS+k); }catch(e){} },
    key       : function(i){ try{ var ks=nsKeys(); return i<ks.length?ks[i]:null; }catch(e){ return null; } },
    clear     : function(){ try{ nsKeys().forEach(function(k){ real.removeItem(NS+k); }); }catch(e){} }
  };
  function nsKeys(){
    var out=[];
    for(var i=0;i<real.length;i++){
      var k=real.key(i);
      if(k && k.indexOf(NS)===0) out.push(k.substring(NS.length));
    }
    return out;
  }
  Object.defineProperty(shim,'length',{ get:function(){ try{ return nsKeys().length; }catch(e){ return 0; } } });
  try{
    Object.defineProperty(window,'localStorage',{ configurable:true, get:function(){ return shim; } });
  }catch(e){
    try{ window.localStorage = shim; }catch(e2){}
  }
})();

function loadGoogleIdentity() {
  return new Promise((resolve) => {
    if (window.google && window.google.accounts) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

async function initGoogleAuth() {
  if (GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com') {
    updateGsStatus('warn', '⚠ 請在程式碼中填入 Google Client ID 後才能使用 Sheets 同步');
    return;
  }
  await loadGoogleIdentity();
  GS.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPES,
    callback: (resp) => {
      if (resp.error) { updateGsStatus('err', '授權失敗：' + resp.error); return; }
      GS.accessToken = resp.access_token;
      GS.isReady = true;
      updateGsStatus('ok', '✓ 已連接 Google Sheets（' + ADMIN_EMAIL + '）');
      toast('Google Sheets 已授權，正在載入設定…');
      loadConfigFromSheets();
    },
  });
}

  if (!GS.tokenClient) { initGoogleAuth().then(() => { if(GS.tokenClient) GS.tokenClient.requestAccessToken(); }); }
  else { GS.tokenClient.requestAccessToken(); }
}

function updateGsStatus(type, msg) {

  });
}

function esc(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"'`=\/]/g, function(c){return _ESC_MAP[c];});
}

/* ── 屬性 escape：用於 HTML attribute 值 ── */
function escAttr(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, function(c){return _ESC_MAP[c];});
}

/* ── 雜湊：用於密碼/PIN 不以明文存於前端 ── */
async function sha256(text){
  if(!text) return '';
  try{
    const enc=new TextEncoder();
    const buf=await crypto.subtle.digest('SHA-256', enc.encode(String(text)));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // 老瀏覽器 fallback：簡易 hash（並非密碼學安全，但比明文好）
    let h=0;
    for(let i=0;i<text.length;i++){h=((h<<5)-h)+text.charCodeAt(i);h|=0;}
    return 'fb_'+Math.abs(h).toString(16);
  }
}

/* ── 同步雜湊 fallback（用於初始化時無法等 await）── */
function syncHash(text){
  if(!text) return '';
  let h=0;
  for(let i=0;i<text.length;i++){h=((h<<5)-h)+text.charCodeAt(i);h|=0;}
  return 'sync_'+Math.abs(h).toString(16);
}

/* ── 輸入長度限制：避免 DoS 與 localStorage 爆掉 ── */
const MAX_FIELD_LENGTH = 5000;       // 一般文字欄位上限 5000 字
const MAX_NAME_LENGTH = 50;          // 姓名上限
const MAX_SHORT_LENGTH = 200;        // 短欄位（學號、卡號等）
function clipInput(val, maxLen){
  if(val===null||val===undefined) return '';
  const s=String(val);
  return s.length > (maxLen||MAX_FIELD_LENGTH) ? s.substring(0, maxLen||MAX_FIELD_LENGTH) : s;
}

/* ── 失敗次數計數器：防止暴力破解 ── */
const _failCounts={};
const MAX_FAILS_PER_MIN = 5;
function recordFail(key){
  const now=Date.now();
  if(!_failCounts[key]) _failCounts[key]={count:0, firstAt:now, lockedUntil:0};
  const rec=_failCounts[key];
  // 60 秒重置計數
  if(now - rec.firstAt > 60000){
    rec.count=1; rec.firstAt=now; rec.lockedUntil=0;
  } else {
    rec.count++;
    if(rec.count >= MAX_FAILS_PER_MIN){
      rec.lockedUntil = now + 60000; // 鎖 60 秒
    }
  }
}
function isLocked(key){
  const rec=_failCounts[key];
  if(!rec) return false;
  if(Date.now() < rec.lockedUntil) return Math.ceil((rec.lockedUntil-Date.now())/1000);
  return false;
}
function clearFails(key){
  delete _failCounts[key];
}

/* ── Session timeout：閒置 30 分後自動登出 ── */
const SESSION_TIMEOUT_MS = 30 * 60 * 1000; // 30 分鐘
let _lastActivity = Date.now();
let _sessionCheckTimer = null;
function bumpActivity(){
  _lastActivity = Date.now();
}
function startSessionWatchdog(){
  if(_sessionCheckTimer) clearInterval(_sessionCheckTimer);
  _sessionCheckTimer = setInterval(function(){
    if(!APP.currentRole) return; // 未登入不檢查
    if(Date.now() - _lastActivity > SESSION_TIMEOUT_MS){
      alert('因閒置時間過長（30 分鐘），請重新登入以保護您的帳號安全');
      try{ doLogout(); }catch(e){}
    }
  }, 30000); // 每 30 秒檢查一次
}

/* 依日期自動推算學期字串
   台灣學年度規則：8 月起算新學年；8 月–翌年 1 月＝第1學期，2–7 月＝第2學期 */
function deriveTermFromDate(dateStr){
  if(!dateStr) return '';
  var m=String(dateStr).match(/(\d{4})[\/-](\d{1,2})/);
  if(!m) return '';
  var y=+m[1], mo=+m[2];
  if(!y||!mo||mo<1||mo>12) return '';
  var ay=(mo>=8)?(y-1911):(y-1912);
  var sem=(mo>=8||mo===1)?'第1學期':'第2學期';
  return ay+'學年度'+sem;
}

/* 取得某學生所屬學期
   優先序：本機/設定檔指定 > 帳號 term 欄位 > 依實習起始日推算 > 未分類 */
function getStudentTerm(sid){
  var t=(APP.studentTerms&&APP.studentTerms[sid])||'';
  var acc=(APP.students&&APP.students[sid])||{};
  if(!t) t=acc.term||'';
  if(!t) t=deriveTermFromDate(acc.intern_start||'');
  t=String(t||'').trim();
  return t || TERM_UNASSIGNED;
}
/* 此學生的學期是「自動推算」還是「人工指定」（後台顯示小標籤用） */

/* 學期排序鍵：學年度數字 ×10 + 學期序，數字越大＝越新。未分類永遠排最後 */
function _termSortKey(t){
  if(!t || t===TERM_UNASSIGNED) return -1e9;
  var s=String(t);
  var m=s.match(/(\d{2,4})\s*學年/);
  var y=m?+m[1]:0;
  if(!y){ var m2=s.match(/(\d{2,4})/); y=m2?+m2[1]:0; }
  if(y>1911) y=y-1911;               // 若填西元年，換算成民國年比較
  var sem=0;
  if(/暑/.test(s)) sem=3;
  else if(/第\s*2\s*學期|下學期/.test(s)) sem=2;
  else if(/第\s*1\s*學期|上學期/.test(s)) sem=1;
  return y*10+sem;
}

/* 目前所有學生用到的學期清單（新→舊，未分類墊底） */
function listTerms(){
  var seen={};
  Object.keys(APP.students||{}).forEach(function(sid){ seen[getStudentTerm(sid)]=1; });
  return Object.keys(seen).sort(function(a,b){
    var d=_termSortKey(b)-_termSortKey(a);
    return d!==0 ? d : String(a).localeCompare(String(b),'zh-Hant');
  });
}

/* 把一組 sid 依學期分組 → [{term, sids:[...]}, ...]（新→舊） */
function groupSidsByTerm(sids){
  var map={};
  (sids||[]).forEach(function(sid){
    var t=getStudentTerm(sid);
    if(!map[t]) map[t]=[];
    map[t].push(sid);
  });
  return Object.keys(map).sort(function(a,b){
    var d=_termSortKey(b)-_termSortKey(a);
    return d!==0 ? d : String(a).localeCompare(String(b),'zh-Hant');
  }).map(function(t){ return {term:t, sids:map[t]}; });
}

/* 最新（＝預設展開）的那個學期 */

}

/* 學期建議選項：現有學期 ∪ 依今日推算的本學期與前一學期 */
function termSuggestions(){
  var out=listTerms().filter(function(t){return t!==TERM_UNASSIGNED;});
  var now=new Date();
  var cur=deriveTermFromDate(now.getFullYear()+'/'+(now.getMonth()+1));
  [cur].forEach(function(t){ if(t && out.indexOf(t)<0) out.unshift(t); });
  return out;
}
function termDatalistHtml(id){
  return '<datalist id="'+id+'">'+termSuggestions().map(function(t){
    return '<option value="'+escAttr(t)+'"></option>';
  }).join('')+'</datalist>';
}

/* ★ FIX v19.4【學期同步】收下 loadAccounts 回傳的學期資料 —— 後端為權威來源。
   ── 為什麼要改成後端權威？────────────────────────────────────────────
   舊版 reconcileStudentTerms 是「本機無條件贏」，再加上 saveConfigToSheets
   會帶著本機的 Date.now() 新時間戳把整包舊 map 推回雲端。結果只要有一台
   開很久沒重整的後台分頁按下任何按鈕（新增主題／講師／拖曳排序…），
   它記憶體裡的舊學期就會蓋掉雲端剛改好的新學期 → 「學期跳回舊學年度」。
   v19.3 後端已把 term 寫進 Students 分頁（權威欄位），前端改成以它為準。

   採用規則（保守，不會誤刪未同步的本機指定）：
     1. Students.term 有值            → 一律以後端為準
     2. 後端 Config 對照表有 '' 墓碑  → 代表管理員在別台明確清除，照做
     3. 其餘（後端完全沒提到這個 sid）→ 保留本機值，等下次編輯時回寫
   ─────────────────────────────────────────────────────────────────── */
function adoptServerTerms(data){
  if(!APP.students) return;
  if(!APP.studentTerms) APP.studentTerms={};
  var srvMap=(data && data.studentTerms && typeof data.studentTerms==='object') ? data.studentTerms : null;
  var srvAt =+((data && data.studentTermsAt) || 0);
  var adopted=0, cleared=0;

  // (1) Students 分頁的 term 欄 —— setStudentTerm / updateStudent 直接寫入，最權威
  Object.keys(APP.students).forEach(function(sid){
    var remote=String((APP.students[sid]||{}).term||'').trim();
    if(remote && APP.studentTerms[sid]!==remote){ APP.studentTerms[sid]=remote; adopted++; }
    else if(remote) APP.studentTerms[sid]=remote;
  });

  // (2) Config 對照表（含 '' 清除墓碑）—— 雙保險，涵蓋 term 欄還沒補齊的舊資料
  if(srvMap){
    Object.keys(srvMap).forEach(function(sid){
      var sv=String(srvMap[sid]==null?'':srvMap[sid]).trim();
      if(sv){
        if(APP.studentTerms[sid]!==sv){ APP.studentTerms[sid]=sv; adopted++; }
        if(APP.students[sid]) APP.students[sid].term=sv;
      }else if(Object.prototype.hasOwnProperty.call(APP.studentTerms, sid) && APP.studentTerms[sid]){
        // 後端明確記著「已清除」→ 本機也跟著清除，改回自動推算
        APP.studentTerms[sid]='';
        if(APP.students[sid]) APP.students[sid].term='';
        cleared++;
      }
    });
  }

  if(srvAt) APP.studentTermsAt=srvAt;   // 時間戳一律由伺服器蓋章，避免各裝置時鐘不同步
  _saveStudentTermsLocal(false);
  if(adopted||cleared) console.log('[terms] 已採用後端學期 '+adopted+' 筆，清除 '+cleared+' 筆');
  if(typeof data==='object' && data && typeof data.defaultNewTerm==='string' && data.defaultNewTerm){
    APP.defaultNewTerm=data.defaultNewTerm;
    try{ localStorage.setItem('default_new_term', APP.defaultNewTerm); }catch(e){}
  }
}

/* 帳號清單重新載入後，把本機留底的學期回貼（僅用於後端尚未支援 term 的舊版相容路徑） */
function reconcileStudentTerms(fullList){
  if(!APP.students) return;
  if(!APP.studentTerms) APP.studentTerms={};
  Object.keys(APP.students).forEach(function(sid){
    var hasLocal=Object.prototype.hasOwnProperty.call(APP.studentTerms, sid);
    var local=hasLocal?String(APP.studentTerms[sid]||''):'';
    var remote=APP.students[sid].term;
    // ★ FIX v1.6.1：用 hasOwnProperty 判斷，'' 代表「管理員已明確清除」，
    //   不可再被後端舊值救回來（舊版用 if(local) 會誤判成沒指定）。
    if(hasLocal) APP.students[sid].term=local;       // 本機指定優先（後端多半還沒有此欄位）
    else if(remote) APP.studentTerms[sid]=remote;    // 後端有值 → 收進本機留底
  });
  // ★ FIX v1.6.1：孤兒清除改為「只在確定拿到完整名單時」才執行。
  //   舊版無條件刪除，只要後端回傳部分名單（老師角色 / 權限過濾 / 暫時性錯誤），
  //   不在名單裡的學生指定學期就會被刪光，再被 saveConfigToSheets 帶著新時間戳
  //   推上雲端 → 所有裝置永久遺失，畫面退回「依實習起始日自動推算」。
  if(fullList===true){
    Object.keys(APP.studentTerms).forEach(function(sid){
      if(!APP.students[sid]) delete APP.studentTerms[sid];
    });
  }
  _saveStudentTermsLocal(false);
}

/* ─── 【資安修補 v18】alias for compatibility ─── 
   原檔已有 esc/escAttr/sha256。新增的安全工具沿用既有 API：
*/
function escapeHtml(s){ return esc(s); }
function escapeAttr(s){ return escAttr(s); }
function escapeJsString(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[\\"']/g, '\\$&').replace(/\u0000/g,'\\0').replace(/\n/g,'\\n').replace(/\r/g,'\\r');
}

/* ─── 【資安修補 v18】localStorage 防竄改 ─── 
   敏感設定如 gs_client_id 從 localStorage 讀取時必須驗證格式，
   否則攻擊者在共用電腦上可植入惡意值，誘導下一位使用者連到攻擊者的 OAuth 流程。
*/
function safeReadClientId(){
  try{
    const v = localStorage.getItem('gs_client_id');
    if(!v) return null;
    if(!/^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$/i.test(v)){
      console.warn('[Security] localStorage 中 gs_client_id 格式異常，已忽略');
      localStorage.removeItem('gs_client_id');
      return null;
    }
    return v;
  }catch(e){ return null; }
}
function safeReadConfigGid(){
  try{
    const v = localStorage.getItem('config_gid');
    if(v && /^[0-9]+$/.test(v)) return v;
    return '0';
  }catch(e){ return '0'; }
}

/* ─── 【資安修補 v18】密碼雜湊：SHA-256 + per-user salt ───
   舊版 (h:) 只用單純 SHA-256，相同密碼產生相同雜湊，可被 rainbow table 反查。
   新版 (h2:) 加上 salt（學號或卡號），同樣是 123 但每個使用者的雜湊都不同。
   sha256 函式既有，這裡只新增 salted 版本。
*/
async function hashPassword(salt, plain){
  return 'h2:' + (await sha256(String(salt).toLowerCase() + ':' + String(plain)));
}
async function passwordMatchesV2(input, stored, salt){
  if(!stored) return false;
  if(typeof stored !== 'string') return false;
  if(stored.indexOf('h2:')===0){
    const h = await hashPassword(salt, input);
    return h === stored;
  }
  if(stored.indexOf('h:')===0){
    return ('h:' + (await sha256(input))) === stored;
  }
  return stored === input;
}

/* 【資安修補 v18.2】把後端傳來的 ISO 時間字串切成 yyyy-MM-dd
   後端 GAS 寫 toISOString() 會產生 "2026-08-11T16:00:00.000Z"
   <input type="date"> 只接受 yyyy-MM-dd，不切會 console 跳警告 */
function _normalizeDateStr(s){
  if(!s) return '';
  s = String(s);
  // 已是 yyyy-MM-dd
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // ISO 格式：取前 10 字元
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.substring(0, 10);
  // 嘗試 Date 解析
  try{
    const d = new Date(s);
    if(!isNaN(d.getTime())){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+day;
    }
  }catch(e){}
  return '';
}

/* ─── 【資安修補 v18】後端驗證登入 ───
   呼叫 GAS 的 authStudent/authTeacher/authAdmin endpoint，
   後端用雜湊比對密碼，成功後發給 8 小時 session token。
   token 用於後續所有寫入操作（saveForm 等）。 */
async function authenticateBackend(role, identifier, password){
  if(!GAS_URL || GAS_URL==='YOUR_GAS_URL_HERE'){
    return {ok:false, error:'後端未設定 (GAS_URL 為空)'};
  }
  try{
    const url = GAS_URL + '?action=auth&role=' + encodeURIComponent(role) + '&t=' + Date.now();
    const resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},  // GAS doPost 使用 text/plain 避免 CORS preflight
      body: JSON.stringify({
        role: role,
        id: identifier,
        password: password
      })
    });
    if(!resp.ok) return {ok:false, error:'後端回應錯誤 ('+resp.status+')'};
    const data = await resp.json();
    if(data.ok && data.token){
      saveSession(data.token, data.expiresInSec || 28800);
      return {ok:true, user:data.user, token:data.token};
    }
    return {ok:false, error: data.error || '帳號或密碼錯誤'};
  }catch(e){
    console.warn('authenticateBackend error:', e);
    // 網路錯誤時，若本地有快取的雜湊資料且為向下相容模式，可嘗試本地驗證
    return {ok:false, error:'無法連線後端：' + e.message};
  }
}

async function doLogin(role){
  if(role==='student'){

    const pwd=clipInput(document.getElementById('s-pwd').value, MAX_SHORT_LENGTH);

    // 暴力破解保護（前端只做 UX 提示，真正的限速由後端做）
    const lockKey='login_student_'+sid;
    const locked=isLocked(lockKey);
    if(locked){
      errEl.textContent='登入失敗次數過多，請等待 '+locked+' 秒後再試';
      errEl.style.display='block';return;
    }
    // 【新】優先呼叫後端驗證
    const result = await authenticateBackend('student', sid, pwd);
    let acc = null;
    let matched = false;
    if(result.ok){
      matched = true;
      acc = result.user;  // 後端回傳 {sid, name, school}
      // ★ 合併而非覆蓋:保留設定檔(autoLoadConfig)帶入的實習資料等欄位,
      //   避免後端 auth 只回 {sid,name,school} 時把 intern_* 洗掉。

      acc = APP.students[sid];
    } else if(result.error && result.error.indexOf('連線')>=0){
      // 後端連線失敗 → 退回本地快取驗證（離線降級）
      const localAcc = APP.students[sid];
      if(localAcc && localAcc.pwd){
        const ok = await passwordMatchesV2(pwd, localAcc.pwd, sid);
        if(ok){ matched = true; acc = localAcc; }
      }
    }
    if(!matched){
      recordFail(lockKey);
      errEl.textContent = result.error || '學號或密碼錯誤';
      errEl.style.display='block';return;
    }
    if(!checkStudentExpiry(sid)){

      errEl.style.display='block';return;
    }

    errEl.style.display='none';
    APP.currentRole='student';

      errEl.style.display='block';return;
    }
    const result = await authenticateBackend('teacher', card, pwd);
    let acc = null;
    let matched = false;
    if(result.ok){
      matched = true;
      acc = result.user;
      APP.teachers[card] = acc;
    } else if(result.error && result.error.indexOf('連線')>=0){
      const localAcc = APP.teachers[card];
      if(localAcc && localAcc.pwd){
        const ok = await passwordMatchesV2(pwd, localAcc.pwd, card);
        if(ok){ matched = true; acc = localAcc; }
      }
    }
    if(!matched){
      recordFail(lockKey);
      errEl.textContent = result.error || '卡號或密碼錯誤';
      errEl.style.display='block';return;
    }
    clearFails(lockKey);
    errEl.style.display='none';
    APP.currentRole='teacher';APP.currentUser={card,name:acc.name};

      errEl.style.display='block';return;

    APP.currentRole='admin';
    APP.currentUser={name:'管理員', email: result.user.email || id};

    enterApp();
  }
}

/* ─── 【資安修補 v18.1】從後端載入學生/老師清單 ───
   管理員 / 老師登入後呼叫；後端會驗證 session token 並決定回傳什麼。
   - admin: 取得全部學生 + 全部老師
   - teacher: 只取得學生清單（不含密碼明文）
   - student: 後端會拒絕，前端不應呼叫
   後端回傳格式：
     {ok:true, students:{sid:{name,school,pwd,pwdStatus,expiry,...}}, 
                teachers:{card:{name,pwd,pwdStatus,...}},
                studentOrder:[...], teacherOrder:[...]}
*/
async function loadAccountsFromBackend(){
  if(!GAS_URL) throw new Error('GAS_URL 未設定');
  const token = getSessionToken();
  if(!token) throw new Error('未登入或 session 已過期');
  
  const resp = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({
      action: 'loadAccounts',
      sessionToken: token
    })
  });
  if(!resp.ok) throw new Error('後端回應錯誤 ('+resp.status+')');
  const data = await resp.json();
  if(!data.ok) throw new Error(data.error || '載入失敗');
  
  // 寫入 APP
  // ★ 合併策略:後端的 students/teachers 不一定回傳 pwdPlain,
  //   為避免覆蓋掉本地原有的 pwdPlain(導致 👁 圖示無法檢視原始密碼),
  //   採用「以後端為主、保留本地 pwdPlain」的合併方式。
  // ★ 修補：後端若回傳空物件（例如學生角色，後端不回 teachers 詳細資料），
  //   不可覆蓋掉本地由 autoLoadConfig() 帶來的清單，否則簽名下拉會變空。
  if(data.students && Object.keys(data.students).length > 0){
    var prevStudents = APP.students || {};
    Object.keys(data.students).forEach(function(sid){
      var remote = data.students[sid] || {};
      var local = prevStudents[sid] || {};
      // 後端沒帶 pwdPlain 就沿用本地的;後端有帶就用後端的
      if(!remote.pwdPlain && local.pwdPlain) remote.pwdPlain = local.pwdPlain;
    });
    APP.students = data.students;
  }
  if(data.teachers && Object.keys(data.teachers).length > 0){
    var prevTeachers = APP.teachers || {};
    Object.keys(data.teachers).forEach(function(card){
      var remote = data.teachers[card] || {};
      var local = prevTeachers[card] || {};
      if(!remote.pwdPlain && local.pwdPlain) remote.pwdPlain = local.pwdPlain;
    });
    APP.teachers = data.teachers;
  }
  if(data.studentOrder && data.studentOrder.length>0) APP.studentOrder = data.studentOrder;
  if(data.teacherOrder && data.teacherOrder.length>0) APP.teacherOrder = data.teacherOrder;
  // ★ v1.6：APP.students 被整包覆蓋後，把本機留底的「學期」標記回貼
  // ★ FIX v1.6.1：只有「管理員 + 後端確實回了學生名單」時，才允許清除孤兒紀錄。
  //   其他角色（老師 / 學生）拿到的可能是過濾後的部分名單，不可用來判定「這個帳號不存在」。
  var _isFullList = (APP.currentRole==='admin') && !!(data.students && Object.keys(data.students).length>0);
  /* ★ FIX v19.4【學期同步】v19.3 後端已在 loadAccounts 回傳 studentTerms /
     studentTermsAt / defaultNewTerm，但舊版前端完全沒有讀它，後端的「雙保險」
     等於白做。這裡改成：後端有回 → 走 adoptServerTerms（後端權威）；
     後端沒回（舊版 GAS）→ 才退回舊的 reconcileStudentTerms 本機優先邏輯。 */
  try{
    if(data && typeof data.studentTerms==='object' && data.studentTerms!==null){
      adoptServerTerms(data);
      if(_isFullList){
        Object.keys(APP.studentTerms||{}).forEach(function(sid){
          if(!APP.students[sid]) delete APP.studentTerms[sid];
        });
        _saveStudentTermsLocal(false);
      }
    }else{
      reconcileStudentTerms(_isFullList);
    }
  }catch(e){ console.warn('adoptServerTerms failed', e); }
  
  console.log('[loadAccounts] 學生 ' + Object.keys(APP.students).length + 
              ' 位，老師 ' + Object.keys(APP.teachers).length + ' 位');
  return data;
}

/* ── 把現有密碼/PIN 自動升級為新版加鹽雜湊 ──
   【資安修補 v18】所有舊版資料統一升級：
   - 明文 → h2: (sha256(salt + ':' + plain))
   - 舊版 h: (無 salt) → 保持原樣供向下相容；下次登入成功時自動重新雜湊為 h2:
   - 學生/老師密碼也要遷移（舊版錯誤地保持明文）
*/
async function migratePlaintextSecrets(){
  let changed=false;

  // 學生密碼：明文 → h2: (salt = sid)
  for(const sid in APP.students){
    const acc = APP.students[sid];
    if(acc && acc.pwd && typeof acc.pwd==='string'){
      // 既不是 h2: 也不是 h:，視為明文
      if(acc.pwd.indexOf('h2:')!==0 && acc.pwd.indexOf('h:')!==0){
        acc.pwd = await hashPassword(sid, acc.pwd);
        changed = true;
      }
    }
  }
  // 老師密碼：明文 → h2: (salt = card)
  for(const card in APP.teachers){
    const acc = APP.teachers[card];
    if(acc && acc.pwd && typeof acc.pwd==='string'){
      if(acc.pwd.indexOf('h2:')!==0 && acc.pwd.indexOf('h:')!==0){
        acc.pwd = await hashPassword(card, acc.pwd);
        changed = true;
      }
    }
  }
  // 管理員密碼（salt 用 ADMIN_EMAIL）
  if(APP.adminPwd && typeof APP.adminPwd==='string'){
    if(APP.adminPwd.indexOf('h2:')!==0 && APP.adminPwd.indexOf('h:')!==0 && APP.adminPwd){
      APP.adminPwd = await hashPassword(ADMIN_EMAIL, APP.adminPwd);
      changed = true;
    }
  }
  // 老師 PIN（共用，salt 用固定值 'teacher_pin'）
  if(APP.teacherPIN && typeof APP.teacherPIN==='string'){
    if(APP.teacherPIN.indexOf('h2:')!==0 && APP.teacherPIN.indexOf('h:')!==0){
      APP.teacherPIN = await hashPassword('teacher_pin', APP.teacherPIN);
      changed = true;
    }
  }
  // 筆試後測 PIN
  if(APP.examPIN && typeof APP.examPIN==='string'){
    if(APP.examPIN.indexOf('h2:')!==0 && APP.examPIN.indexOf('h:')!==0){
      APP.examPIN = await hashPassword('exam_pin', APP.examPIN);
      changed = true;
    }
  }

  if(changed){
    try{ saveConfigToSheets(); }catch(e){console.warn('hash migration save failed',e);}
  }
}
async function doRegister(){
  const sid=clipInput((document.getElementById('r-sid').value||'').trim(), MAX_SHORT_LENGTH);
  const name=clipInput((document.getElementById('r-name').value||'').trim(), MAX_NAME_LENGTH);
  const school=clipInput((document.getElementById('r-school').value||'').trim(), MAX_NAME_LENGTH);
  const pwd=clipInput(document.getElementById('r-pwd').value, MAX_SHORT_LENGTH);
  const pwd2=clipInput(document.getElementById('r-pwd2').value, MAX_SHORT_LENGTH);
  const err=document.getElementById('r-err');

  // 【安全】註冊頻率限制:每 5 分鐘最多註冊 3 個帳號
  try{
    var now=Date.now();
    var regLog=JSON.parse(localStorage.getItem('register_log')||'[]');
    regLog=regLog.filter(function(t){return (now-t)<300000;});
    if(regLog.length>=3){
      err.textContent='⚠ 註冊次數過多，請 5 分鐘後再試';err.style.display='block';return;
    }
  }catch(e){}

  if(!sid||!name||!school||!pwd){err.textContent='請填寫所有欄位';err.style.display='block';return;}
  if(pwd.length<6){err.textContent='密碼至少6個字元';err.style.display='block';return;}
  if(pwd.length>64){err.textContent='密碼過長（上限 64 碼）';err.style.display='block';return;}
  if(pwd!==pwd2){err.textContent='兩次密碼不一致';err.style.display='block';return;}
  if(!/^[A-Za-z0-9_-]+$/.test(sid)){err.textContent='學號只能包含英文字母、數字、底線或減號';err.style.display='block';return;}
  if(sid.length<3 || sid.length>20){err.textContent='學號長度應為 3-20 碼';err.style.display='block';return;}
  if(/[<>&"\\\/]/.test(name)){err.textContent='姓名包含不允許的特殊字元';err.style.display='block';return;}
  err.style.display='none';

  // ★ v19:改走後端 register API,不再用 saveConfigToSheets 整批同步
  //   這樣自助註冊只新增一筆到 Students 分頁,不會把本地殘留的舊帳號(包括已被刪除的)洗回去
  if(!GAS_URL){
    err.textContent='⚠ 系統錯誤:後端未設定';err.style.display='block';return;
  }
  try{
    const resp = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'register', sid:sid, name:name, school:school, pwd:pwd})
    });
    if(!resp.ok){
      err.textContent='⚠ 後端回應錯誤 ('+resp.status+')';err.style.display='block';return;
    }
    const data = await resp.json();
    if(!data.ok){
      err.textContent='⚠ '+(data.error||'註冊失敗');err.style.display='block';return;
    }

    // 註冊成功 → 記錄 + 儲存 token + 直接登入
    try{
      var now2=Date.now();
      var regLog2=JSON.parse(localStorage.getItem('register_log')||'[]');
      regLog2=regLog2.filter(function(t){return (now2-t)<300000;});
      regLog2.push(now2);
      localStorage.setItem('register_log',JSON.stringify(regLog2));
    }catch(e){}

    // 儲存 session token
    /* ★ FIX v19.4【致命】舊版寫成 setSessionToken()，但本檔根本沒有這個函式
       （正確名稱是 saveSession()）。加上 typeof 守衛後錯誤被靜靜吞掉，
       導致自助註冊的學生「畫面看起來登入成功、實際上沒有 session token」，
       之後每一次 saveFormToSheets 都被後端擋掉，資料只留在 localStorage，
       清快取或換裝置就全部消失。 */
    if(data.token){
      saveSession(data.token, data.expiresInSec || 28800);
    }else{
      console.warn('[register] 後端未回傳 token，請確認 GAS 版本');
    }
    // 登入狀態
    APP.currentRole='student';
    APP.currentUser={sid:sid, name:name, school:school,
      intern_cat:(APP.students[sid]&&APP.students[sid].intern_cat)||'',
      intern_start:(APP.students[sid]&&APP.students[sid].intern_start)||'',
      intern_end:(APP.students[sid]&&APP.students[sid].intern_end)||''};
    enterApp();
  }catch(e){
    err.textContent='⚠ 連線失敗:'+(e.message||e);err.style.display='block';
  }
}
/* 【v19.1 改密碼流程修補】
   舊版只改記憶體 + saveConfigToSheets,但 v19 後端 saveConfig 不接受 students 欄位,
   導致密碼根本沒寫進 Sheet,學生用新密碼登入會失敗。
   新版改走後端專屬 API:
     步驟 1:用舊密碼向後端 auth 取得 sessionToken
     步驟 2:帶 token 呼叫 changePassword
     步驟 3:後端回應 ok 才顯示成功
   後端會同步寫入 PasswordHistory 分頁,管理員可在後台查看異動記錄。 */
async function changeStudentPwd(){
  const sid=clipInput((document.getElementById('cp-sid').value||'').trim(), MAX_SHORT_LENGTH);
  const old=clipInput(document.getElementById('cp-old').value, MAX_SHORT_LENGTH);
  const nw=clipInput(document.getElementById('cp-new').value, MAX_SHORT_LENGTH);
  const nw2=clipInput(document.getElementById('cp-new2').value, MAX_SHORT_LENGTH);
  const err=document.getElementById('cp-err');
  const lockKey='changepwd_'+sid;
  const locked=isLocked(lockKey);
  if(locked){err.textContent='嘗試次數過多，請等待 '+locked+' 秒';err.style.display='block';return;}

  // ── 前端基本驗證 ──
  if(!sid){err.textContent='請輸入學號';err.style.display='block';return;}
  if(!old){err.textContent='請輸入舊密碼';err.style.display='block';return;}
  if(nw.length<6){err.textContent='新密碼至少 6 碼';err.style.display='block';return;}
  if(nw!==nw2){err.textContent='新密碼兩次輸入不一致';err.style.display='block';return;}
  if(nw===old){err.textContent='新密碼不可與舊密碼相同';err.style.display='block';return;}
  if(!GAS_URL){err.textContent='系統未設定後端，請聯繫管理員';err.style.display='block';return;}

  // 顯示「處理中」狀態
  err.style.color='var(--ink3)';
  err.textContent='⏳ 正在更新密碼，請稍候…';
  err.style.display='block';

  try{
    // ── 步驟 1:用舊密碼登入,取得 sessionToken ──
    const authResp = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'auth', role:'student', id:sid, password:old})
    });
    if(!authResp.ok) throw new Error('連線失敗 ('+authResp.status+')');
    const authData = await authResp.json();
    if(!authData.ok){
      recordFail(lockKey);
      err.style.color='var(--red)';
      err.textContent = authData.error || '學號或舊密碼錯誤';
      err.style.display='block';
      return;
    }

    // ── 步驟 2:帶 token 呼叫 changePassword ──
    const cpResp = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        action:'changePassword',
        sessionToken: authData.token,
        oldPwd: old,
        newPwd: nw
      })
    });
    if(!cpResp.ok) throw new Error('連線失敗 ('+cpResp.status+')');
    const cpData = await cpResp.json();
    if(!cpData.ok){
      err.style.color='var(--red)';
      err.textContent = cpData.error || '密碼更新失敗';
      err.style.display='block';
      return;
    }

    // ── 步驟 3:確認成功 ──
    clearFails(lockKey);
    err.style.display='none';
    err.style.color='';
    // 清空表單
    document.getElementById('cp-sid').value='';
    document.getElementById('cp-old').value='';
    document.getElementById('cp-new').value='';
    document.getElementById('cp-new2').value='';
    const accName = (APP.students[sid] && APP.students[sid].name) || sid;
    toast('✓ '+esc(accName)+' 的密碼已更新成功，請以新密碼登入');
    // 自動帶回登入畫面並預填學號
    showPanel('student-login-panel');
    setTimeout(function(){
      var sidInput=document.getElementById('s-sid');
      if(sidInput) sidInput.value=sid;
    },50);

  }catch(e){
    err.style.color='var(--red)';
    err.textContent='⚠ 系統連線失敗：'+(e.message||e)+'，請稍後再試';
    err.style.display='block';
  }
}
