/* ── 清除本機測試資料：清空 APP.formData、APP.historyLog、localStorage 草稿 ── */
/* ── 雲端清除 helper：把 formKey 的雲端資料覆蓋為空 ──
   v1.5.2 修正：GAS v18 後端要求寫入操作必須帶 sessionToken,舊版 iframe form
   submit 沒帶 token 會被後端默默拒絕(對帳就會失敗)。改用與 saveFormToSheets
   完全相同的 fetch+JSON+sessionToken 方式,並真正等待後端回應。 */
async function clearCloudFormData(formKey){
  if(!GAS_URL || GAS_URL === 'YOUR_GAS_URL_HERE') return false;
  var payload = {
    action: 'saveForm',
    formId: formKey,
    data: '{}',
    history: '[]',
    studentId: APP.currentRole==='student' ? APP.currentUser.sid
              : (APP.currentRole==='teacher' ? APP.currentUser.card : 'admin_clear'),
    sessionToken: (typeof getSessionToken==='function' ? getSessionToken() : null) || '',
    role: APP.currentRole || 'admin',
    secret: (typeof GAS_WRITE_SECRET!=='undefined' && GAS_WRITE_SECRET) ? GAS_WRITE_SECRET : ''
  };
  if(!payload.sessionToken){
    console.warn('[clearCloudFormData] 未取得 sessionToken,GAS v18 會拒絕寫入。請重新登入後再試。');
  }
  try{
    var resp = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload),
      mode:'cors'
    });
    if(!resp.ok){
      console.warn('[clearCloudFormData] HTTP', resp.status, formKey);
      return false;
    }
    var data = await resp.json().catch(function(){return null;});
    if(data && data.error){
      console.warn('[clearCloudFormData] backend rejected:', data.error, formKey);
      return false;
    }
    return true;
  }catch(e){
    console.warn('clearCloudFormData failed:', formKey, e && e.message);
    return false;
  }
}

/* ── 【對帳】回頭跟雲端確認指定 formKey 是否真的清乾淨 ──
   回傳 true = 雲端確實已空；false = 雲端還有資料（或讀取失敗，保守當失敗）
   讀取會穿透快取（cache:no-cache + 時間戳）以避免讀到舊副本。 */
async function verifyCloudFormCleared(formKey){
  if(!GAS_URL || GAS_URL === 'YOUR_GAS_URL_HERE') return true; // 無雲端時視為已清
  try{
    var controller = new AbortController();
    var tid = setTimeout(function(){controller.abort();}, 8000);
    var url = GAS_URL + '?action=loadForm&formId=' + encodeURIComponent(formKey) + '&t=' + Date.now();
    var resp = await fetch(url, {cache:'no-cache', signal:controller.signal});
    clearTimeout(tid);
    if(!resp.ok) return false; // 讀不到 → 保守認為沒清乾淨
    var data = await resp.json();
    // formData 為 '{}'、空字串、或不存在 → 視為已清
    var fd = data.formData;
    var hist = data.history;
    var fdEmpty = (!fd || fd === '' || fd === '{}' || fd === 'null');
    var histEmpty = (!hist || hist === '' || hist === '[]' || hist === 'null');
    if(!fdEmpty){
      try{
        var parsed = JSON.parse(fd);
        // 解析成物件後，所有 key 的 value 都是空 → 視為已清
        var anyVal = Object.keys(parsed).some(function(k){
          var v = parsed[k];
          return v !== '' && v !== null && v !== undefined && v !== false;
        });
        fdEmpty = !anyVal;
      }catch(e){ fdEmpty = false; }
    }
    return fdEmpty && histEmpty;
  }catch(e){
    console.warn('verifyCloudFormCleared error:', formKey, e && e.name);
    return false;
  }
}

/* ── 帶重試與對帳的雲端清除 ──
   清除 → 等一下 → 對帳 → 沒清乾淨就再清，最多 maxRetries 次。
   回傳 {ok:true} 或 {ok:false, reason:'...'}。 */
async function clearCloudFormDataVerified(formKey, maxRetries){
  if(typeof maxRetries!=='number') maxRetries = 3;
  for(var attempt=1; attempt<=maxRetries; attempt++){
    await clearCloudFormData(formKey);
    // 給 GAS 一點時間落地(縮短等候,從 800ms 起跳改為 250ms 起跳;
    // 重試時遞增,但仍比舊版快得多)
    await new Promise(function(r){ setTimeout(r, 250 + attempt*200); });
    var ok = await verifyCloudFormCleared(formKey);
    if(ok) return {ok:true, attempts:attempt};
  }
  return {ok:false, reason:'verify_failed_after_'+maxRetries+'_retries'};
}

/* ─── 並行批次清除 + 持續可見進度條 ───────────────────────────────
 * 把整份 formKey 清單切成 N 筆一批,每批內所有 fetch 平行跑,
 * 比舊版「一筆等一筆」快 5-10 倍。
 *
 * 參數:
 *   formKeyList — 要清除的 formKey 陣列
 *   label       — 顯示在進度條上的標題(例如「清除所有測試資料」)
 *   concurrency — 每批並行筆數(預設 8;太多會被 GAS 限流)
 *
 * 回傳:{success, failed:[...formKeys]} */
async function clearCloudFormsInBatches(formKeyList, label, concurrency){
  concurrency = concurrency || 8;
  var total = formKeyList.length;
  var done = 0;
  var failed = [];
  var startTs = Date.now();

  // 建立進度面板(置中浮層,使用者按完二次確認後立即顯示)
  showClearProgressPanel(label, total);
  updateClearProgressPanel(0, total, 0, 0);

  // 切批執行
  for(var i=0; i<total; i+=concurrency){
    var batch = formKeyList.slice(i, i+concurrency);
    // 同一批內並行;Promise.all 等全部回來再進下一批
    var results = await Promise.all(batch.map(function(fk){
      return clearCloudFormDataVerified(fk, 3).then(function(r){
        return {fk:fk, ok:r.ok};
      }).catch(function(){
        return {fk:fk, ok:false};
      });
    }));
    results.forEach(function(r){
      done++;
      if(!r.ok) failed.push(r.fk);
    });
    // 即時更新進度條(每批結束都更新一次)
    var elapsed = Math.round((Date.now()-startTs)/1000);
    var perItem = elapsed/Math.max(1,done);
    var remain = Math.max(0, Math.round(perItem*(total-done)));
    updateClearProgressPanel(done, total, failed.length, remain);
  }

  hideClearProgressPanel();
  return {success: total-failed.length, failed: failed};
}

/* 進度面板:置中浮層,過程中持續可見,讓使用者明確掌握進度 */

      '<div style="font-size:16px;font-weight:700;color:#1E40AF;margin-bottom:6px;">⏳ '+esc(label||'清除中')+'</div>'+
      '<div id="clear-progress-status" style="font-size:13px;color:#475569;margin-bottom:14px;">準備中…</div>'+
      '<div style="background:#E5E7EB;height:14px;border-radius:7px;overflow:hidden;margin-bottom:10px;">'+
        '<div id="clear-progress-bar" style="background:linear-gradient(90deg,#3B82F6,#2563EB);height:100%;width:0%;transition:width .3s;"></div>'+
      '</div>'+
      '<div id="clear-progress-detail" style="font-size:12px;color:#64748B;display:flex;justify-content:space-between;gap:10px;">'+
        '<span id="clear-progress-count">0 / '+total+'</span>'+
        '<span id="clear-progress-eta">剩餘時間估算中…</span>'+
      '</div>'+
      '<div style="margin-top:14px;padding:8px 12px;background:#FEF3C7;border-left:3px solid #F59E0B;border-radius:6px;font-size:11px;color:#78350F;line-height:1.6;">'+
        '⚠ 過程請勿關閉視窗或重新整理。完成後此視窗會自動消失。'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
}
function updateClearProgressPanel(done, total, failedCnt, etaSec){
  var bar = document.getElementById('clear-progress-bar');
  var cnt = document.getElementById('clear-progress-count');
  var eta = document.getElementById('clear-progress-eta');
  var st = document.getElementById('clear-progress-status');
  if(!bar||!cnt||!eta||!st) return;
  var pct = total>0 ? Math.round(done*100/total) : 0;
  bar.style.width = pct+'%';
  cnt.textContent = done+' / '+total+(failedCnt>0?'(失敗 '+failedCnt+')':'');
  if(etaSec<=0){
    eta.textContent = '完成中…';
  }else if(etaSec<60){
    eta.textContent = '剩餘約 '+etaSec+' 秒';
  }else{
    eta.textContent = '剩餘約 '+Math.round(etaSec/60)+' 分 '+(etaSec%60)+' 秒';
  }
  st.textContent = '已處理 '+done+' 份(共 '+total+' 份)'+(failedCnt>0?' · '+failedCnt+' 份對帳失敗將自動重試':'');
}
function hideClearProgressPanel(){
  var ov = document.getElementById('clear-progress-overlay');
  if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
}

/* ─── 只重試上次清除失敗的那幾筆 ───
 * 用途:大批清除後若有少數筆對帳失敗(常見原因是 GAS 那一瞬間有延遲),
 *      使用者不必整批 160 筆重清,只要針對失敗清單再跑一輪即可。
 * 每筆會用更多次重試(5 次,比原本 3 次更積極),且仍走並行批次處理。 */
async function retryFailedClearList(){
  var r = APP._lastClearResult;
  if(!r || !r.failedList || r.failedList.length===0){
    toast('沒有失敗清單可重試');
    return;
  }
  if(!confirm('將重試 '+r.failedList.length+' 筆失敗的清除動作。\n\n每筆會嘗試最多 5 次清除+對帳,通常 10-30 秒內完成。\n\n確定要重試?')) return;

  var list = r.failedList.slice();
  var stillFailed = [];
  // 用更積極的重試(maxRetries=5)
  showClearProgressPanel('重試失敗清單', list.length);
  updateClearProgressPanel(0, list.length, 0, 0);
  var done = 0, startTs = Date.now();
  for(var i=0; i<list.length; i+=4){
    var batch = list.slice(i, i+4); // 失敗清單通常很少筆,每批 4 筆即可
    var results = await Promise.all(batch.map(function(fk){
      return clearCloudFormDataVerified(fk, 5).then(function(r2){
        return {fk:fk, ok:r2.ok};
      }).catch(function(){
        return {fk:fk, ok:false};
      });
    }));
    results.forEach(function(res){
      done++;
      if(!res.ok) stillFailed.push(res.fk);
    });
    var elapsed = Math.round((Date.now()-startTs)/1000);
    var remain = Math.max(0, Math.round(elapsed/Math.max(1,done)*(list.length-done)));
    updateClearProgressPanel(done, list.length, stillFailed.length, remain);
  }
  hideClearProgressPanel();

  // 同步清除本機殘留(如果有的話)
  list.forEach(function(k){
    if(stillFailed.indexOf(k)<0){
      delete APP.formData[k];
      delete APP.historyLog[k];
    }
  });
  try{
    var drafts = JSON.parse(localStorage.getItem('form_drafts')||'{}');
    var hLogs = JSON.parse(localStorage.getItem('history_logs')||'{}');
    list.forEach(function(k){
      if(stillFailed.indexOf(k)<0){
        delete drafts[k];
        delete hLogs[k];
      }
    });
    localStorage.setItem('form_drafts', JSON.stringify(drafts));
    localStorage.setItem('history_logs', JSON.stringify(hLogs));
  }catch(e){}

  // 更新結果面板
  if(stillFailed.length===0){
    APP._lastClearResult = {
      ok: true,
      ts: new Date().toLocaleString('zh-TW'),
      type: '重試後全部成功 (原本範圍:'+(r.type||'未知')+')',
      total: r.total,
      success: r.total,
      failed: 0,
      failedList: []
    };
    alert('✅ 重試成功\n\n'+list.length+' 筆全部已清除並通過對帳。');
  } else {
    APP._lastClearResult = {
      ok: false,
      ts: new Date().toLocaleString('zh-TW'),
      type: '重試後仍有失敗 (原本範圍:'+(r.type||'未知')+')',
      total: r.total,
      success: r.total - stillFailed.length,
      failed: stillFailed.length,
      failedList: stillFailed
    };
    alert('⚠ 重試後仍有 '+stillFailed.length+' 筆失敗:\n\n'+stillFailed.join('\n')+'\n\n建議:\n1. 用「🔍 驗證雲端是否真的有殘留」確認是否雲端其實已空(常見 GAS 延遲)\n2. 或直接到 Google Sheets 手動清除這幾列');
  }
  if(typeof renderAdmin==='function') setTimeout(renderAdmin, 300);
}

/* ─── 只驗證失敗清單在雲端是否真的還有資料 ───
 * 不做寫入,只讀取對帳。常見情境:GAS 寫入成功了但 verify 那一瞬間還沒落地,
 * 隔幾秒重讀一次發現其實已經空了。這個按鈕讓使用者不必再清一次就能知道實況。 */
async function verifyFailedClearList(){
  var r = APP._lastClearResult;
  if(!r || !r.failedList || r.failedList.length===0){
    toast('沒有失敗清單可驗證');
    return;
  }
  showClearProgressPanel('驗證雲端狀態', r.failedList.length);
  updateClearProgressPanel(0, r.failedList.length, 0, 0);

  var actuallyEmpty = []; // 雲端實際已空的
  var stillHasData = []; // 雲端確實還有資料的
  var done = 0, startTs = Date.now();
  var list = r.failedList.slice();
  for(var i=0; i<list.length; i+=4){
    var batch = list.slice(i, i+4);
    var results = await Promise.all(batch.map(function(fk){
      return verifyCloudFormCleared(fk).then(function(isEmpty){
        return {fk:fk, isEmpty:isEmpty};
      }).catch(function(){
        return {fk:fk, isEmpty:false};
      });
    }));
    results.forEach(function(res){
      done++;
      if(res.isEmpty) actuallyEmpty.push(res.fk);
      else stillHasData.push(res.fk);
    });
    var elapsed = Math.round((Date.now()-startTs)/1000);
    var remain = Math.max(0, Math.round(elapsed/Math.max(1,done)*(list.length-done)));
    updateClearProgressPanel(done, list.length, stillHasData.length, remain);
  }
  hideClearProgressPanel();

  // 如果雲端其實已空,自動清掉本機殘留並更新結果面板
  if(actuallyEmpty.length>0){
    actuallyEmpty.forEach(function(k){
      delete APP.formData[k];
      delete APP.historyLog[k];
    });
    try{
      var drafts = JSON.parse(localStorage.getItem('form_drafts')||'{}');
      var hLogs = JSON.parse(localStorage.getItem('history_logs')||'{}');
      actuallyEmpty.forEach(function(k){
        delete drafts[k];
        delete hLogs[k];
      });
      localStorage.setItem('form_drafts', JSON.stringify(drafts));
      localStorage.setItem('history_logs', JSON.stringify(hLogs));
    }catch(e){}
  }

  var msg = '🔍 驗證結果\n\n';
  msg += '檢查 '+list.length+' 筆失敗紀錄,雲端實際狀態:\n';
  msg += '  ✅ 已空(誤報): '+actuallyEmpty.length+' 筆\n';
  msg += '  ⚠ 仍有資料: '+stillHasData.length+' 筆\n\n';
  if(actuallyEmpty.length>0){
    msg += '已空的這 '+actuallyEmpty.length+' 筆是 GAS 延遲造成的假失敗,雲端其實清乾淨了,已自動從本機草稿移除。\n\n';
  }
  if(stillHasData.length>0){
    msg += '⚠ 雲端確實還有殘留的:\n'+stillHasData.join('\n')+'\n\n建議按「🔁 重試」再清一次,或直接到 Google Sheets 手動處理。';
  } else {
    msg += '✅ 所有失敗紀錄都是假警報,實際雲端是乾淨的。可以放心進行下一步測試。';
  }
  alert(msg);

  // 更新面板:若全部驗證為空,標為成功
  if(stillHasData.length===0){
    APP._lastClearResult = {
      ok: true,
      ts: new Date().toLocaleString('zh-TW'),
      type: '驗證後確認已清乾淨 (原本範圍:'+(r.type||'未知')+')',
      total: r.total,
      success: r.total,
      failed: 0,
      failedList: []
    };
  } else {
    APP._lastClearResult = {
      ok: false,
      ts: new Date().toLocaleString('zh-TW'),
      type: '驗證後仍有殘留 (原本範圍:'+(r.type||'未知')+')',
      total: r.total,
      success: r.total - stillHasData.length,
      failed: stillHasData.length,
      failedList: stillHasData
    };
  }
  if(typeof renderAdmin==='function') setTimeout(renderAdmin, 300);
}

/* 【資安修補 v18.1】統一的後端呼叫 helper
   自動帶 sessionToken；token 失效時自動清除並引導重新登入 */
async function callBackend(action, payload){
  if(!GAS_URL) return {ok:false, error:'GAS_URL 未設定'};
  const token = getSessionToken();
  if(!token) return {ok:false, error:'未登入或登入逾時'};
  try{
    const resp = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(Object.assign({action, sessionToken:token}, payload || {}))
    });
    if(!resp.ok) return {ok:false, error:'後端回應錯誤 ('+resp.status+')'};
    const data = await resp.json();
    if(data.error && (data.error.indexOf('token')>=0 || data.error.indexOf('逾時')>=0)){
      clearSession();
      toast('⚠ 登入逾時，請重新登入', false);
    }
    return data;
  }catch(e){
    return {ok:false, error: e.message || String(e)};
  }
}

function downloadPasswordHistoryCSV(){
  if(!_pwdHistoryCache || _pwdHistoryCache.length === 0){
    toast('沒有可下載的記錄，請先點「載入」', false);
    return;
  }
  // CSV 標頭
  var headers = ['時間','角色','帳號','姓名','舊密碼明文','新密碼明文','動作','操作者'];
  var actionLabel = {
    selfChange:'自助改密碼', adminReset:'管理員重設', adminUpdate:'管理員代改',
    addAccount:'新增帳號', register:'自助註冊'
  };
  var roleLabel = { student:'學生', teacher:'老師' };
  function csvEscape(v){
    var s = String(v==null?'':v);
    if(s.indexOf(',')>=0 || s.indexOf('"')>=0 || s.indexOf('\n')>=0){
      s = '"' + s.replace(/"/g,'""') + '"';
    }
    return s;
  }
  var lines = [headers.map(csvEscape).join(',')];
  _pwdHistoryCache.forEach(function(e){
    lines.push([
      e.timestamp,
      roleLabel[e.role] || e.role,
      e.accountKey,
      e.accountName,
      e.oldPwdPlain,
      e.newPwdPlain,
      actionLabel[e.action] || e.action,
      e.actor
    ].map(csvEscape).join(','));
  });
  // 加 BOM 讓 Excel 開啟時辨識 UTF-8
  var csv = '\uFEFF' + lines.join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var ts = new Date();
  var fname = 'password_history_'+
    ts.getFullYear()+
    String(ts.getMonth()+1).padStart(2,'0')+
    String(ts.getDate()).padStart(2,'0')+'_'+
    String(ts.getHours()).padStart(2,'0')+
    String(ts.getMinutes()).padStart(2,'0')+'.csv';
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  toast('✓ 已下載 '+fname);
}

/* 取得全班學生清單 [{sid,name,school,intern_start,intern_end,intern_cat}] */
function cohortStudentList(allTerms){
  var order = (APP.studentOrder && APP.studentOrder.length) ? APP.studentOrder.slice()
            : Object.keys(APP.students||{});
  Object.keys(APP.students||{}).forEach(function(sid){ if(order.indexOf(sid)<0) order.push(sid); });
  var ft = allTerms ? '' : (APP.cohortFilterTerm||'');
  return order.filter(function(sid){ return APP.students && APP.students[sid]; })
              .filter(function(sid){ return !ft || getStudentTerm(sid)===ft; })
              .map(function(sid){
                var s = APP.students[sid] || {};
                return { sid: sid, name: s.name || sid, school: s.school || '',
                         intern_start: s.intern_start || '', intern_end: s.intern_end || '', intern_cat: s.intern_cat || '',
                         term: getStudentTerm(sid) };
              });
}

function cohortForm(formId, sid){ return APP.formData[formId+'_'+sid] || {}; }

/* ── 一次把全班所有學生的表單資料載入 APP.formData（沿用後端 loadAllForms API） ── */
async function loadCohortData(){
  var students = cohortStudentList();
  for(var i=0;i<students.length;i++){
    var sid = students[i].sid;
    try{
      var controller = new AbortController();
      var tid = setTimeout(function(){ controller.abort(); }, 12000);
      var resp = await fetch(GAS_URL, {
        method:'POST', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({ action:'loadAllForms', sid: sid }),
        signal: controller.signal, cache:'no-cache'
      });
      clearTimeout(tid);
      if(!resp.ok) continue;
      var data = await resp.json();
      if(!data.ok || !data.forms) continue;
      Object.keys(data.forms).forEach(function(fkey){
        var item = data.forms[fkey] || {};
        if(item.formData){
          try{
            var loaded = JSON.parse(item.formData);
            // 整份覆蓋該 formKey（統計需要雲端最新版；不影響其他 key）
            APP.formData[fkey] = loaded;
          }catch(e){}
        }
        // ★ 一併載入「儲存紀錄」：getStatus 以是否有 historyLog 判斷表單是否真的存過。
        //   若只載入欄位值卻沒載入紀錄，已完成的表單會卡在「草稿中」，永遠不會顯示「完成」。
        if(item.history){
          try{
            var hist = JSON.parse(item.history);
            if(Array.isArray(hist) && hist.length) APP.historyLog[fkey] = hist;
          }catch(e){}
        }
      });
    }catch(e){ /* 單一學生失敗就略過，續抓其他人 */ }
  }
  return students;
}

/* F13 書面個案：s1 + s2a~s2h（各有上限），總分 100 */
function cohortF13Score(sid){
  var d = cohortForm('F13', sid);
  var items=[['s1',5],['s2a',5],['s2b',20],['s2c',10],['s2d',20],['s2e',5],['s2f',15],['s2g',15],['s2h',5]];
  var any=false, tot=0;
  items.forEach(function(it){
    var v=d[it[0]];
    if(v!==undefined && v!=='' && v!==null){ any=true; var n=parseInt(v,10)||0; if(n>it[1])n=it[1]; if(n<0)n=0; tot+=n; }
  });
  return any ? tot : null;
}
/* F14 PPT 個案：f14_sc_0~11（各有上限），總分 100 */
function cohortF14Score(sid){
  var d = cohortForm('F14', sid);

    if(v!==undefined && v!=='' && v!==null){ any=true; var n=parseInt(v,10)||0; if(n>maxes[i])n=maxes[i]; if(n<0)n=0; tot+=n; }
  }

/* ═════════════════ SVG 圖表 ═════════════════ */
/* 群組長條圖：categories（X 軸）× series（圖例）；matrix[cat][ser]=值 */
function cohortGroupedBarSVG(categories, series, matrix, max, opts){
  opts = opts || {};
  var colors = opts.colors || _cohColors();
  var W = opts.width||720, H = opts.height||340;
  var padL=42, padR=14, padT=16, padB=70;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var nCat=categories.length, nSer=series.length;
  var groupW=plotW/nCat, barGap=3, groupInner=groupW*0.74;
  var barW=Math.max(3,(groupInner - barGap*(nSer-1))/nSer);
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;font-family:sans-serif;max-width:'+W+'px;margin:0 auto;">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#FFFFFF"/>';
  var steps=opts.ySteps||4;
  for(var g=0;g<=steps;g++){
    var yv=max*g/steps, y=padT+plotH-(yv/max)*plotH;
    s+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#E5E9F0" stroke-width="1"/>';
    s+='<text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="#888">'+Math.round(yv)+'</text>';
  }
  if(opts.threshold!=null){
    var ty=padT+plotH-(opts.threshold/max)*plotH;
    s+='<line x1="'+padL+'" y1="'+ty.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ty.toFixed(1)+'" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5,4"/>';
    s+='<text x="'+(W-padR)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#DC2626">'+_cohEsc(opts.thresholdLabel||('門檻 '+opts.threshold))+'</text>';
  }
  for(var c=0;c<nCat;c++){
    var gx=padL+groupW*c+(groupW-groupInner)/2;
    for(var si=0;si<nSer;si++){
      var v=matrix[c][si];
      if(v==null||isNaN(v)) continue;
      var bh=(v/max)*plotH, bx=gx+si*(barW+barGap), by=padT+plotH-bh;
      s+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" fill="'+colors[si%colors.length]+'" rx="2"/>';
      if(opts.valueLabels) s+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(by-2).toFixed(1)+'" text-anchor="middle" font-size="8.5" fill="#555">'+v+'</text>';
    }
    var cxl=padL+groupW*c+groupW/2;
    s+='<text x="'+cxl.toFixed(1)+'" y="'+(padT+plotH+15)+'" text-anchor="middle" font-size="11" fill="#333">'+_cohEsc(categories[c])+'</text>';
  }
  s+='<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="#999" stroke-width="1"/>';
  var lx=padL, ly=H-22;
  for(var si2=0;si2<nSer;si2++){
    s+='<rect x="'+lx+'" y="'+(ly-9)+'" width="11" height="11" rx="2" fill="'+colors[si2%colors.length]+'"/>';
    s+='<text x="'+(lx+15)+'" y="'+ly+'" font-size="11" fill="#333">'+_cohEsc(series[si2])+'</text>';
    lx += 22 + String(series[si2]).length*12;
    if(lx > W-110){ lx=padL; ly+=16; }
  }
  s+='</svg>';
  return s;
}

/* 水平長條圖：適合項目多、名稱長（核心課程各堂平均） */
function cohortHBarSVG(labels, values, opts){
  opts = opts || {};
  var max=opts.max||100, rowH=opts.rowH||26, padT=10, padB=26;
  var labelW=opts.labelW||168, padR=46, padL=8;
  var n=labels.length, W=opts.width||690, H=padT+padB+n*rowH;
  var plotX=padL+labelW, plotW=W-plotX-padR;
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;font-family:sans-serif;max-width:'+W+'px;margin:0 auto;">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#FFFFFF"/>';
  if(opts.threshold!=null){
    var tx=plotX+(opts.threshold/max)*plotW;
    s+='<line x1="'+tx.toFixed(1)+'" y1="'+padT+'" x2="'+tx.toFixed(1)+'" y2="'+(H-padB)+'" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="5,4"/>';
    s+='<text x="'+tx.toFixed(1)+'" y="'+(H-padB+14)+'" text-anchor="middle" font-size="10" fill="#DC2626">'+_cohEsc(opts.thresholdLabel||opts.threshold)+'</text>';
  }
  for(var i=0;i<n;i++){
    var y=padT+i*rowH, v=values[i];
    s+='<text x="'+(plotX-6)+'" y="'+(y+rowH/2+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="#333">'+_cohEsc(labels[i])+'</text>';
    s+='<rect x="'+plotX+'" y="'+(y+4).toFixed(1)+'" width="'+plotW+'" height="'+(rowH-8)+'" fill="#F0F2F6" rx="3"/>';
    if(v!=null && !isNaN(v)){
      var bw=Math.max(0,(v/max))*plotW;
      var col=(opts.threshold!=null && v<opts.threshold) ? '#DC2626' : (opts.color||'#2563EB');
      s+='<rect x="'+plotX+'" y="'+(y+4).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-8)+'" fill="'+col+'" rx="3"/>';
      s+='<text x="'+(plotX+bw+4).toFixed(1)+'" y="'+(y+rowH/2+3).toFixed(1)+'" font-size="10" font-weight="700" fill="#333">'+(opts.fmt?opts.fmt(v):v)+'</text>';
    } else {
      s+='<text x="'+(plotX+4)+'" y="'+(y+rowH/2+3).toFixed(1)+'" font-size="10" fill="#bbb">—（未完成）</text>';
    }
  }
  s+='</svg>';
  return s;
}

/* ═════════════════ 共用小工具 ═════════════════ */
function _cohAvg(arr){ var v=arr.filter(function(x){return x!=null && !isNaN(x);}); if(!v.length) return null; return Math.round(v.reduce(function(a,b){return a+b;},0)/v.length); }
function _cohTbl(headHtml, bodyHtml){
  return '<table style="width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 2px;">'
       + '<thead>'+headHtml+'</thead><tbody>'+bodyHtml+'</tbody></table>';
}
function _cohTh(t,extra){ return '<th style="background:#3F6212;color:#fff;padding:6px 8px;border:1px solid #cbd5e1;font-weight:600;text-align:center;'+(extra||'')+'">'+_cohEsc(t)+'</th>'; }
function _cohTd(t,extra){ return '<td style="padding:5px 8px;border:1px solid #d8dee9;text-align:center;'+(extra||'')+'">'+(t==null?'':t)+'</td>'; }
function _cohNote(t){ return '<div style="font-size:11px;color:#64748b;margin:2px 0 10px;line-height:1.6;">'+t+'</div>'; }
function _cohChartBox(svg){ return '<div style="overflow-x:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch;">'+svg+'</div>'; }

/* ═════════════════ 各統整區段 ═════════════════ */
/* 回傳 [{id,title,html}]，畫面與 PDF 共用 */
function cohortSections(students){
  var secs=[];
  var names=students.map(function(s){return s.name;});

  /* 1) 整體表單完成率 */
  (function(){
    var html='';
    var totalForms=FORMS.length;
    var perStu=students.map(function(s){
      var done=0,draft=0;
      FORMS.forEach(function(f){
        var st=getStudentFormStatus(f.id,s.sid);
        if(st==='done')done++; else if(st==='draft')draft++;
      });
      return {name:s.name, done:done, draft:draft, pct:Math.round(done/totalForms*100)};
    });
    var classDone=perStu.reduce(function(a,b){return a+b.done;},0);
    var classPct=Math.round(classDone/(totalForms*students.length||1)*100);
    // KPI
    html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">';
    html+='<div style="flex:1;min-width:110px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 12px;"><div style="font-size:11px;color:#3F6212;">學生人數</div><div style="font-size:22px;font-weight:700;color:#1E3A8A;">'+students.length+'</div></div>';
    html+='<div style="flex:1;min-width:110px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 12px;"><div style="font-size:11px;color:#3F6212;">每人表單數</div><div style="font-size:22px;font-weight:700;color:#1E3A8A;">'+totalForms+'</div></div>';
    html+='<div style="flex:1;min-width:110px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;padding:10px 12px;"><div style="font-size:11px;color:#047857;">全班整體完成率</div><div style="font-size:22px;font-weight:700;color:#047857;">'+classPct+'%</div></div>';
    html+='</div>';
    // per-student progress bars
    html+='<div style="margin-top:4px;">';
    perStu.forEach(function(p){
      var col=p.pct>=80?'#059669':p.pct>=50?'#2563EB':'#D97706';
      html+='<div style="margin-bottom:8px;">';
      html+='<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;"><span style="font-weight:600;color:#1A2332;">'+_cohEsc(p.name)+'</span><span style="color:#64748b;">已完成 '+p.done+'／'+totalForms+'（'+p.pct+'%）'+(p.draft?'，草稿 '+p.draft:'')+'</span></div>';
      html+='<div style="background:#EEF2F7;border-radius:6px;height:12px;overflow:hidden;"><div style="height:12px;width:'+p.pct+'%;background:'+col+';border-radius:6px;"></div></div>';
      html+='</div>';
    });
    html+='</div>';
    secs.push({id:'overview', title:'① 整體表單完成率', html:html});
  })();

  /* 2) Learning Style 四人總匯（四宮格雷達圖） */
  (function(){
    var dims=F16_AXIS_ORDER;
    var stuScores=students.map(function(s){return cohortF16(s.sid);});
    var html='';
    html+=_cohNote('每向度滿分 20 分（七向度：視覺／社交／身體／聽覺／言語／獨立／邏輯）。雷達圖向外擴越大代表該向度越強；每位學生最高分的向度即其「主要學習風格」，已標示於各圖上方。');
    html+='<table style="width:100%;border-collapse:collapse;table-layout:fixed;">';
    students.forEach(function(s,si){
      if(si%2===0) html+='<tr>';
      var sc=stuScores[si];
      var topTxt;
      if(sc){
        var maxv=-1; dims.forEach(function(c){ if(sc[c]>maxv)maxv=sc[c]; });
        var topCodes=dims.filter(function(c){ return sc[c]===maxv; });
        topTxt=(maxv>0&&topCodes.length)?topCodes.map(function(c){return F16_STYLES[c].zh;}).join('、'):'—';
      } else { topTxt='未完成'; }
      var inner='<div style="font-weight:700;font-size:14px;color:#3F6212;">'+_cohEsc(s.name)+'</div>'
        +'<div style="font-size:12px;font-weight:700;margin:2px 0 2px;color:'+(sc?'#7F1D1D':'#bbb')+';">主要風格：'+_cohEsc(topTxt)+'</div>'
        +(sc?buildF16RadarSVG(sc,200,{pad:true,showScores:true}):'<div style="height:170px;line-height:170px;color:#bbb;font-size:13px;">（未完成）</div>');
      html+='<td style="width:50%;text-align:center;vertical-align:top;padding:4px;page-break-inside:avoid;border:1px solid #e2e8f0;">'+inner+'</td>';
      if(si%2===1) html+='</tr>';
      else if(si===students.length-1) html+='<td style="width:50%;border:1px solid #e2e8f0;"></td></tr>';
    });
    html+='</table>';
    secs.push({id:'f16', title:'② Learning Style 四人總匯', html:html});
  })();

  /* 3) 筆試前/後測成績分布 */
  (function(){
    var pre=students.map(function(s){return cohortQuizScore('F-PRE',s.sid);});
    var post=students.map(function(s){return cohortQuizScore('F-POST',s.sid);});
    var matrix=students.map(function(s,i){ return [pre[i],post[i]]; });
    var html='';
    html+=_cohNote('每題 4 分共 25 題，滿分 100，<b style="color:#DC2626;">60 分及格</b>（紅色虛線）。藍＝前測、橘＝後測，可看出每位學生的進步幅度。');
    html+=_cohChartBox(cohortGroupedBarSVG(names, ['前測','後測'], matrix, 100, {height:320, threshold:60, thresholdLabel:'及格線 60', valueLabels:true, colors:['#60A5FA','#D97706']}));
    var head='<tr>'+_cohTh('學生')+_cohTh('前測')+_cohTh('後測')+_cohTh('進步')+'</tr>';
    var body='';
    students.forEach(function(s,i){
      function cell(v){ if(v==null) return _cohTd('<span style="color:#bbb;">未完成</span>','text-align:center;'); return _cohTd(v,'text-align:center;font-weight:700;color:'+(v>=60?'#059669':'#DC2626')+';'); }
      var diff=(pre[i]!=null&&post[i]!=null)?(post[i]-pre[i]):null;
      var diffTxt = diff==null?'—':((diff>0?'▲ +':diff<0?'▼ ':'')+diff);
      var diffCol = diff==null?'#94a3b8':(diff>0?'#059669':diff<0?'#DC2626':'#64748b');
      body+='<tr>'+_cohTd('<b>'+_cohEsc(s.name)+'</b>','background:#FAFBFF;')+cell(pre[i])+cell(post[i])+_cohTd(diffTxt,'text-align:center;font-weight:600;color:'+diffCol+';')+'</tr>';
    });
    var avgPre=_cohAvg(pre), avgPost=_cohAvg(post);
    body+='<tr style="background:#F1F5FB;">'+_cohTd('<b>全班平均</b>')+_cohTd(avgPre==null?'—':avgPre,'text-align:center;font-weight:700;')+_cohTd(avgPost==null?'—':avgPost,'text-align:center;font-weight:700;')+_cohTd((avgPre!=null&&avgPost!=null)?((avgPost-avgPre>=0?'+':'')+(avgPost-avgPre)):'—','text-align:center;font-weight:700;')+'</tr>';
    html+=_cohTbl(head,body);
    secs.push({id:'exam', title:'③ 筆試前／後測成績分布', html:html});
  })();


  /* 3-2) 全班錯題方向彙整（弱點教學地圖） */
  (function(){
    if(typeof EXAM_CATEGORIES==='undefined' || typeof _examRowsFromFormData!=='function') return;
    var agg={};
    EXAM_CATEGORIES.forEach(function(c){ agg[c.key]={name:c.name,advice:c.advice,course:c.course,preC:0,preT:0,postC:0,postT:0}; });
    var preStu=0, postStu=0;
    students.forEach(function(s){
      var pr=_examRowsFromFormData(cohortForm('F-PRE',s.sid));
      var po=_examRowsFromFormData(cohortForm('F-POST',s.sid));
      if(pr){ preStu++;  pr.forEach(function(r){ if(agg[r.key]){ agg[r.key].preC+=r.correct;  agg[r.key].preT+=r.total;  } }); }
      if(po){ postStu++; po.forEach(function(r){ if(agg[r.key]){ agg[r.key].postC+=r.correct; agg[r.key].postT+=r.total; } }); }
    });
    if(preStu===0 && postStu===0) return; // 全班都還沒作答就不顯示
    var cats=EXAM_CATEGORIES.map(function(c){
      var a=agg[c.key];
      var preRate  = a.preT>0  ? Math.round(a.preC/a.preT*100)   : null;
      var postRate = a.postT>0 ? Math.round(a.postC/a.postT*100) : null;
      return { key:c.key, name:c.name, advice:c.advice, course:c.course,
               preRate:preRate, postRate:postRate,
               primary:(postRate!=null?postRate:(preRate!=null?preRate:0)) };
    });
    var useLabel = postStu>0 ? '後測' : '前測';
    var doneN = postStu>0 ? postStu : preStu;
    var sorted = cats.slice().sort(function(a,b){ return a.primary-b.primary; }); // 弱點在前
    var labels = sorted.map(function(c){ return c.name; });
    var vals   = sorted.map(function(c){ return c.primary; });
    var html='';
    html+=_cohNote('把 25 題依臨床範疇分成 9 大方向，統計<b>全班</b>各方向的正確率（'+useLabel+'，已完成 '+doneN+' 人）。長條由低到高排序，越上面代表<b>全班共同越弱</b>、最該加強的教學方向；紅線為 80% 掌握門檻。');
    html+=_cohChartBox(cohortHBarSVG(labels, vals, {max:100, threshold:80, thresholdLabel:'掌握門檻 80', labelW:210, rowH:16}));
    var head='<tr>'+_cohTh('臨床方向')+_cohTh('前測班正確率')+_cohTh('後測班正確率')+_cohTh('進步')+_cohTh('掌握度')+'</tr>';
    var body='';
    sorted.forEach(function(c){
      function rc(v){ if(v==null) return _cohTd('<span style="color:#bbb;">—</span>','text-align:center;'); var col=v>=80?'#059669':(v>=50?'#D97706':'#DC2626'); return _cohTd(v+'%','text-align:center;font-weight:700;color:'+col+';'); }
      var diff=(c.preRate!=null&&c.postRate!=null)?(c.postRate-c.preRate):null;
      var diffTxt=diff==null?'—':(diff>0?'▲ +'+diff+'%':diff<0?'▼ '+diff+'%':'持平');
      var diffCol=diff==null?'#94a3b8':(diff>0?'#059669':diff<0?'#DC2626':'#64748b');
      var base=(c.postRate!=null?c.postRate:c.preRate);
      var tag=base==null?'—':(base>=80?'已掌握':base>=50?'待補強':'需加強');
      var tagCol=base==null?'#94a3b8':(base>=80?'#059669':base>=50?'#D97706':'#DC2626');
      body+='<tr>'+_cohTd('<b>'+_cohEsc(c.name)+'</b>','background:#FAFBFF;')+rc(c.preRate)+rc(c.postRate)+_cohTd(diffTxt,'text-align:center;font-weight:600;color:'+diffCol+';')+_cohTd(tag,'text-align:center;font-weight:700;color:'+tagCol+';')+'</tr>';
    });
    html+=_cohTbl(head,body);
    var weak=sorted.filter(function(c){ var base=(c.postRate!=null?c.postRate:c.preRate); return base!=null && base<80; });
    if(weak.length){
      var adv='<div style="margin-top:10px;border:1px solid #FCD34D;border-radius:8px;overflow:hidden;">';
      adv+='<div style="background:#F59E0B;color:#fff;padding:8px 12px;font-weight:700;font-size:13px;">📌 全班共同弱點與教學精進建議</div>';
      weak.forEach(function(c){
        var base=(c.postRate!=null?c.postRate:c.preRate);
        adv+='<div style="padding:10px 12px;border-bottom:1px dashed #FDE68A;background:#FFFEF8;">';
        adv+='<div style="font-weight:700;color:#92400E;font-size:13px;">● '+_cohEsc(c.name)+'（全班'+useLabel+'正確率 '+base+'%）</div>';
        adv+='<div style="font-size:12px;color:#374151;line-height:1.6;margin-top:3px;">'+_cohEsc(c.advice)+'</div>';
        adv+='<div style="font-size:12px;color:var(--primary2);margin-top:3px;">📚 建議加強教學／指定複習：'+_cohEsc(c.course)+'</div>';
        adv+='</div>';
      });
      adv+='</div>';
      html+=adv;
    } else {
      html+='<div style="margin-top:10px;padding:10px 12px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;color:#065F46;font-weight:700;font-size:13px;">👏 全班各方向正確率皆 ≥ 80%，整體掌握良好。</div>';
    }
    secs.push({id:'examdir', title:'③ 全班錯題方向彙整（弱點教學地圖）', html:html});
  })();

  /* 4) 核心課程各堂平均 */
  (function(){

    var labels=cts.map(cohortCourseLabel);

  /* 5) 個案報告成績總表 */
  (function(){
    var f13=students.map(function(s){return cohortF13Score(s.sid);});
    var f14=students.map(function(s){return cohortF14Score(s.sid);});
    var matrix=students.map(function(s,i){return [f13[i],f14[i]];});
    var html='';
    html+=_cohNote('書面報告與口頭報告（PPT）皆滿分 100，<b style="color:#DC2626;">60 分及格</b>。');
    html+=_cohChartBox(cohortGroupedBarSVG(names, ['書面報告','口頭報告'], matrix, 100, {height:300, threshold:60, thresholdLabel:'及格線 60', valueLabels:true}));
    var head='<tr>'+_cohTh('學生')+_cohTh('書面報告')+_cohTh('口頭報告')+'</tr>';
    var body='';
    function cell(v){ if(v==null) return _cohTd('<span style="color:#bbb;">未完成</span>','text-align:center;'); return _cohTd(v+' / 100','text-align:center;font-weight:700;color:'+(v>=60?'#059669':'#DC2626')+';'); }

    html+=_cohTbl(head,body);
    secs.push({id:'case', title:'⑤ 個案報告成績總表', html:html});
  })();

  /* 6) DOPS / EPA 完成度與分數 */
  (function(){
    var dops=FORMS.filter(function(f){return /^D0\d$/.test(f.id);});
    var epas=FORMS.filter(function(f){return /^E0\d$/.test(f.id);});
    var html='';
    // DOPS 表
    html+='<div style="font-size:13px;font-weight:700;color:#991B1B;margin:2px 0 4px;">DOPS 操作技術評核</div>';

    students.forEach(function(s){
      var row='<tr>'+_cohTd('<b>'+_cohEsc(s.name)+'</b>','background:#FAFBFF;');
      dops.forEach(function(f){
        var r=cohortDops(f.id,s.sid);
        var st=getStudentFormStatus(f.id,s.sid);
        var cell;
        if(r.result){
          var pass=(r.result==='合格');

  /* 7) 教師評分型表單（臨床表現 / CbD / 360 / 實習總評值） */
  (function(){
    // 各表單分數萃取（回 {score,max,pass} 或 null）
    function f02Score(sid){ // 臨床表現自評：10 題 1-5，滿分 50
      var d=cohortForm('F02',sid), any=false, t=0;
      for(var i=0;i<10;i++){var v=d['f02_'+i]; if(v!==undefined&&v!==''&&v!=null){any=true;var n=parseInt(v,10)||0;t+=n;}}
      return any?{score:t,max:50,pass:null}:null;
    }
    function cbdScore(fid,sid){ // CbD：7 題 1-9，滿分 63（UGY 每項需 ≥5）
      var d=cohortForm(fid,sid), any=false, t=0;

      return any?{score:t,max:63,pass:null}:null;
    }
    function f07Score(fid,sid){ // 360：態度80+題0-7、臨床75+題8-13，總分=兩者各半，及格 ≥70
      var d=cohortForm(fid,sid), any=false;
      var att=80; for(var i=0;i<8;i++){var v=d['f07_'+i]; if(v!==undefined&&v!==''&&v!=null){any=true;att+=parseInt(v,10)||0;}}

      var tot=Math.round(att*0.5+clin*0.5);
      return any?{score:tot,max:100,pass:70}:null;
    }
    function f15Score(sid){ // 實習總評值：態度25+技能50+溝通25(+加分5)，滿分105，及格 ≥60

      var row='<tr>'+_cohTd('<b>'+_cohEsc(s.name)+'</b>','background:#FAFBFF;');
      cols.forEach(function(c){
        var r=c.get(s);
        if(!r){ row+=_cohTd('<span style="color:#bbb;">未評</span>','text-align:center;'); return; }

/* ═════════════════ 畫面渲染 ═════════════════ */
async function renderCohortDashboard(){
  if(APP.currentRole!=='admin' && APP.currentRole!=='teacher'){
    console.warn('renderCohortDashboard blocked: role='+APP.currentRole);
    return;
  }
  // 清理 F16 浮動表頭殘留（同 renderAdmin）
  var _f16fh=document.getElementById('f16-floating-thead'); if(_f16fh)_f16fh.remove();
  var mc=document.getElementById('main-content');
  var sb=document.getElementById('sidebar');
  if(sb) sb.querySelectorAll('.sidebar-item').forEach(function(el){el.classList.remove('active');});
  var navOn=document.getElementById('cohort-nav-btn'); if(navOn)navOn.classList.add('active');

  // ★ v1.6：首次進入時，預設只看「最新學期」，避免逐年累積後每次都要載入全部學生
  if(APP.cohortFilterTerm===undefined || APP.cohortFilterTerm===null) APP.cohortFilterTerm='';
  if(!APP._cohortTermInit){
    APP._cohortTermInit=true;
    var _allTerms=listTerms();
    if(_allTerms.length>1){
      var _lt=latestTerm();
      if(_lt) APP.cohortFilterTerm=_lt;
    }
  }
  if(APP.cohortFilterTerm && listTerms().indexOf(APP.cohortFilterTerm)<0) APP.cohortFilterTerm='';

  var _pending=cohortStudentList().length;
  mc.innerHTML='<div style="padding:3rem;text-align:center;color:var(--ink3);">'
    +'<div style="font-size:32px;margin-bottom:10px;">📊</div>'
    +'<div style="font-size:14px;font-weight:600;">正在彙整'+(APP.cohortFilterTerm?_cohEsc(APP.cohortFilterTerm):'全班')+'資料…</div>'
    +'<div style="font-size:12px;margin-top:6px;color:var(--ink3);">逐一從雲端載入每位學生的表單（'+_pending+' 位）</div></div>';

  var students;
  try{ students = await loadCohortData(); }
  catch(e){
    mc.innerHTML='<div class="admin-section"><div style="padding:2rem;text-align:center;color:#DC2626;">⚠ 載入失敗：'+_cohEsc(e.message||e)+'<br><button class="btn-update" style="margin-top:12px;" onclick="renderCohortDashboard()">重試</button></div></div>';
    return;
  }
  if(!students || !students.length){
    var _anyStu=Object.keys(APP.students||{}).length;
    mc.innerHTML='<div class="admin-section">'
      + (_anyStu ? cohortTermSwitcherHtml() : '')
      + '<div style="padding:2rem;text-align:center;color:var(--ink3);">'
      + (_anyStu ? ('「'+_cohEsc(APP.cohortFilterTerm||'')+'」目前沒有學生，請於上方切換其他學期。') : '尚無學生資料。請先於「系統管理」新增學生帳號。')
      + '</div></div>';
    return;
  }

  var secs=cohortSections(students);
  var html='<div class="admin-section">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:1rem;">';
  html+='<div style="font-family:var(--ff-serif);font-size:18px;font-weight:600;">📊 班級學習統整</div>';
  html+='<div style="display:flex;gap:8px;"><button class="btn-update" onclick="renderCohortDashboard()">↻ 重新整理</button><button class="btn-primary" style="padding:8px 16px;" onclick="downloadCohortPDF()">🖨 匯出班級總表 PDF</button></div>';
  html+='</div>';
  // ★ v1.6 學期切換列
  html+=cohortTermSwitcherHtml();
  html+='<div style="font-size:12px;color:var(--ink3);margin-bottom:1rem;">資料時間：'+new Date().toLocaleString('zh-TW')
      +'　·　檢視範圍：'+(APP.cohortFilterTerm?_cohEsc(APP.cohortFilterTerm):'全部學期')
      +'　·　共 '+students.length+' 位學生</div>';
  // ★ v1.6 各學期人數統計（不需雲端資料，直接由帳號設定彙整）
  html+='<div class="admin-card"><div class="admin-card-head">⓪ 各學期（梯次）人數統計</div>'
      +'<div class="admin-card-body">'+cohortTermStatsHtml()+'</div></div>';
  secs.forEach(function(sec){
    html+='<div class="admin-card"><div class="admin-card-head" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">'
      +'<span>'+_cohEsc(sec.title)+'</span>'
      +'<button onclick="downloadCohortPDF(\''+sec.id+'\')" title="只匯出此區塊的 PDF" style="flex:0 0 auto;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;white-space:nowrap;">🖨 此區 PDF</button>'
      +'</div><div class="admin-card-body">'+sec.html+'</div></div>';
  });
  html+='</div>';
  mc.innerHTML=html;
  window.scrollTo(0,0);
}

/* 切換目前檢視的學期 */
function switchCohortTerm(term){
  APP.cohortFilterTerm=String(term||'');
  APP._cohortTermInit=true;
  renderCohortDashboard();
}

/* 學期切換列（膠囊按鈕：全部 + 各學期，含人數） */
function cohortTermSwitcherHtml(){
  var groups=groupSidsByTerm(Object.keys(APP.students||{}));
  var total=Object.keys(APP.students||{}).length;
  if(!groups.length) return '';
  var cur=APP.cohortFilterTerm||'';
  function pill(label,val,count,active,warn){
    var bg=active?(warn?'#B45309':'var(--primary2)'):'#fff';
    var col=active?'#fff':(warn?'#92400E':'var(--primary2)');
    var bd=active?(warn?'#B45309':'var(--primary2)'):(warn?'#FCD34D':'var(--primary-line)');
    return '<button type="button" onclick="switchCohortTerm(\''+escapeJsString(val)+'\')" '
      +'style="padding:6px 14px;font-size:12px;font-weight:'+(active?'700':'500')+';background:'+bg+';color:'+col+';border:1px solid '+bd+';border-radius:999px;cursor:pointer;white-space:nowrap;">'
      +_cohEsc(label)+' <span style="opacity:.8;font-size:11px;">('+count+')</span></button>';
  }
  var h='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;margin-bottom:12px;">';
  h+='<span style="font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;">🎓 檢視學期：</span>';
  h+=pill('全部學期','',total,!cur,false);
  groups.forEach(function(g){
    h+=pill(g.term, g.term, g.sids.length, cur===g.term, g.term===TERM_UNASSIGNED);
  });
  h+='<span style="font-size:11px;color:var(--ink3);flex-basis:100%;margin-top:2px;">💡 只載入所選學期的學生資料，學生人數多時速度會快很多；匯出的 PDF 也只包含此學期。</span>';
  h+='</div>';
  return h;
}

/* 各學期人數統計（長條圖 + 明細表；資料來自帳號設定，不需雲端載入） */
function cohortTermStatsHtml(){
  var all=cohortStudentList(true);
  if(!all.length) return '<div style="font-size:12px;color:var(--ink3);">尚無學生資料。</div>';
  var groups=groupSidsByTerm(all.map(function(s){return s.sid;}));
  var max=Math.max.apply(null, groups.map(function(g){return g.sids.length;}));
  var colors=_cohColors();

  // ── 手繪 inline SVG 長條圖（與其他區塊一致，列印友善）──
  var barW=54, gap=26, padL=44, padT=18, padB=54, chartH=170;
  var w=Math.max(360, padL*2+groups.length*barW+(groups.length-1)*gap);
  var h='<div style="font-size:12px;color:var(--ink3);margin-bottom:10px;line-height:1.6;">'
    +'各學期（梯次）的學生人數分佈。學生逐年累積後，可用此表掌握每一梯次的規模，'
    +'並於上方切換學期，單獨檢視該梯次的學習成效統計。</div>';
  h+='<div style="overflow-x:auto;"><svg viewBox="0 0 '+w+' '+(chartH+padT+padB)+'" width="100%" style="max-width:'+w+'px;font-family:inherit;">';
  // 基準線
  h+='<line x1="'+(padL-8)+'" y1="'+(padT+chartH)+'" x2="'+(w-10)+'" y2="'+(padT+chartH)+'" stroke="#CBD5E1" stroke-width="1"/>';
  // Y 軸刻度（0 / 半 / 最大）
  [0,0.5,1].forEach(function(r){
    var v=Math.round(max*r), y=padT+chartH-chartH*r;
    h+='<line x1="'+(padL-8)+'" y1="'+y+'" x2="'+(w-10)+'" y2="'+y+'" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>';
    h+='<text x="'+(padL-12)+'" y="'+(y+4)+'" font-size="10" fill="#94A3B8" text-anchor="end">'+v+'</text>';
  });
  groups.forEach(function(g,i){
    var x=padL+i*(barW+gap);
    var bh=Math.round(chartH*(g.sids.length/(max||1)));
    if(bh<3) bh=3;
    var y=padT+chartH-bh;
    var col=(g.term===TERM_UNASSIGNED)?'#F59E0B':colors[i%colors.length];
    h+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+col+'" opacity="0.9"><title>'+_cohEsc(g.term)+'：'+g.sids.length+' 位</title></rect>';
    h+='<text x="'+(x+barW/2)+'" y="'+(y-5)+'" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">'+g.sids.length+'</text>';
    // 標籤（過長就折兩行）
    var lbl=String(g.term);
    var l1=lbl.length>7?lbl.slice(0,7):lbl, l2=lbl.length>7?lbl.slice(7,15):'';
    h+='<text x="'+(x+barW/2)+'" y="'+(padT+chartH+16)+'" font-size="10.5" fill="#475569" text-anchor="middle">'+_cohEsc(l1)+'</text>';
    if(l2) h+='<text x="'+(x+barW/2)+'" y="'+(padT+chartH+29)+'" font-size="10.5" fill="#475569" text-anchor="middle">'+_cohEsc(l2)+'</text>';
  });
  h+='</svg></div>';

  // ── 明細表 ──
  h+='<div style="overflow-x:auto;margin-top:10px;"><table style="width:100%;border-collapse:collapse;font-size:12px;">';
  h+='<tr style="background:var(--primary-soft);">'
   + '<th style="padding:6px 8px;text-align:left;border:1px solid var(--primary-line);">學期（梯次）</th>'
   + '<th style="padding:6px 8px;text-align:center;border:1px solid var(--primary-line);width:70px;">人數</th>'
   + '<th style="padding:6px 8px;text-align:center;border:1px solid var(--primary-line);width:70px;">佔比</th>'
   + '<th style="padding:6px 8px;text-align:left;border:1px solid var(--primary-line);">實習學校</th>'
   + '<th style="padding:6px 8px;text-align:left;border:1px solid var(--primary-line);">實習類別</th>'
   + '<th style="padding:6px 8px;text-align:left;border:1px solid var(--primary-line);">實習期間</th>'
   + '<th style="padding:6px 8px;text-align:center;border:1px solid var(--primary-line);width:86px;">檢視</th></tr>';
  groups.forEach(function(g){
    var schools=[],cats=[],minD='',maxD='';
    g.sids.forEach(function(sid){
      var a=APP.students[sid]||{};
      var sc=(a.school||'').trim(); if(sc&&schools.indexOf(sc)<0) schools.push(sc);
      var ct=(a.intern_cat||'').trim(); if(ct&&cats.indexOf(ct)<0) cats.push(ct);
      var st=_normalizeDateStr(a.intern_start||''), en=_normalizeDateStr(a.intern_end||'');
      if(st&&(!minD||st<minD)) minD=st;
      if(en&&(!maxD||en>maxD)) maxD=en;
    });
    var pct=Math.round(g.sids.length/all.length*100);
    var isCur=(APP.cohortFilterTerm===g.term);
    h+='<tr style="background:'+(isCur?'var(--primary-soft)':'#fff')+';">'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;font-weight:600;">'+(g.term===TERM_UNASSIGNED?'⚠ ':'')+_cohEsc(g.term)+(isCur?' <span style="font-size:10px;color:var(--primary2);">（檢視中）</span>':'')+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;text-align:center;font-weight:700;">'+g.sids.length+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;text-align:center;color:#64748b;">'+pct+'%</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;color:#475569;">'+_cohEsc(schools.join('、')||'—')+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;color:#475569;">'+_cohEsc(cats.join('、')||'—')+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;color:#475569;white-space:nowrap;">'+_cohEsc((minD&&maxD)?(minD+' ～ '+maxD):(minD||maxD||'—'))+'</td>'
      +'<td style="padding:6px 8px;border:1px solid #E2E8F0;text-align:center;">'
        +'<button type="button" onclick="switchCohortTerm(\''+escapeJsString(g.term)+'\')" style="padding:3px 10px;font-size:11px;background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary2);border-radius:5px;cursor:pointer;">單獨檢視</button></td>'
      +'</tr>';
  });
  h+='<tr style="background:#F8FAFC;font-weight:700;">'
   + '<td style="padding:6px 8px;border:1px solid #E2E8F0;">合計</td>'
   + '<td style="padding:6px 8px;border:1px solid #E2E8F0;text-align:center;">'+all.length+'</td>'
   + '<td colspan="5" style="padding:6px 8px;border:1px solid #E2E8F0;color:#64748b;font-weight:400;">共 '+groups.length+' 個學期梯次</td></tr>';
  h+='</table></div>';
  return h;
}

/* ═════════════════ 匯出班級總表 PDF ═════════════════ */
function downloadCohortPDF(sectionId){
  var students=cohortStudentList();
  if(!students.length){ toast('⚠ 無學生資料'); return; }
  var secs=cohortSections(students);
  // ★ 若指定 sectionId，只匯出該區塊；否則匯出整份班級總表
  if(sectionId){
    var single=secs.filter(function(s){return s.id===sectionId;});
    if(!single.length){ toast('⚠ 找不到此區塊'); return; }
    secs=single;
  }
  var docTitle = sectionId ? ('班級統整－'+secs[0].title.replace(/^[①-⑩]\s*/,'')) : '班級學習統整報告';
  var appVer=(document.querySelector('meta[name="version"]')||{}).content||'';
  var now=new Date().toLocaleString('zh-TW');

  // ── 蒐集學校 / 實習日期 / 學期，供 PDF 表頭顯示 ──
  var cohortInfo = (function(){
    // 學校：取學生資料中不重複的實習學校
    var schools=[];
    students.forEach(function(s){
      var sc=(s.school||'').trim();
      if(sc && schools.indexOf(sc)<0) schools.push(sc);
    });
    // 實習類別：取學生資料中不重複的實習類別（供檔名使用）
    var cats=[];
    students.forEach(function(s){
      var c=(s.intern_cat||'').trim();
      if(c && cats.indexOf(c)<0) cats.push(c);
    });
    // 實習日期：以「後台帳號設定的實習起迄」為準（權威來源）。
    //   ⚠ 不再直接掃所有表單的 s_date，因為 DOPS/EPA 等表單的 s_date 是「評核日期」(單一日期)，
    //     會把評核日期誤當成實習起日，造成日期區間錯誤。
    var minD=null, maxD=null;
    function _consider(st,en){
      if(st){ st=String(st).trim().replace(/-/g,'/'); if(/^\d{4}\/\d{2}\/\d{2}$/.test(st)&&(minD===null||st<minD)) minD=st; }
      if(en){ en=String(en).trim().replace(/-/g,'/'); if(/^\d{4}\/\d{2}\/\d{2}$/.test(en)&&(maxD===null||en>maxD)) maxD=en; }
    }
    var _hasAcct=false;
    students.forEach(function(s){
      if((s.intern_start||'').trim()||(s.intern_end||'').trim()){ _hasAcct=true; _consider(s.intern_start, s.intern_end); }
    });
    // 後備：若帳號完全沒有實習日期，才掃表單，且只取「範圍格式」的 s_date（排除單一評核日期）
    if(!_hasAcct){
      students.forEach(function(s){
        (typeof FORMS!=='undefined'?FORMS:[]).forEach(function(f){
          var d=APP.formData[f.id+'_'+s.sid];
          if(!d || !d.s_date) return;
          var raw=String(d.s_date);
          if(raw.indexOf(' - ')<0 && raw.indexOf('～')<0 && raw.indexOf('~')<0) return; // 只取範圍格式
          var found=raw.match(/\d{4}[\/-]\d{2}[\/-]\d{2}/g);
          if(!found) return;
          var srt=found.slice().sort();
          _consider(srt[0], srt[srt.length-1]);
        });
      });
    }
    var dateStr = (minD&&maxD) ? (minD===maxD ? minD : (minD+' ～ '+maxD)) : '—';
    // 學期：管理員若在後台手動填了「班級學期」，優先採用；否則依最早起日自動推算
    //   (台灣學年度規則：8月起為新學年；8–翌年1月為第1學期，2–7月為第2學期)
    var termStr='';
    // ★ v1.6：優先採用「目前檢視的學期」；若未篩選但全體同屬一個學期，也直接採用
    var _viewTerm=(typeof APP!=='undefined' && APP.cohortFilterTerm)?String(APP.cohortFilterTerm).trim():'';
    if(!_viewTerm){
      var _ts=[];
      students.forEach(function(s){ var t=s.term||''; if(t && t!==TERM_UNASSIGNED && _ts.indexOf(t)<0) _ts.push(t); });
      if(_ts.length===1) _viewTerm=_ts[0];
    }
    var _manualTerm=(typeof APP!=='undefined' && APP.cohortTerm)?String(APP.cohortTerm).trim():'';
    if(_viewTerm && _viewTerm!==TERM_UNASSIGNED){
      termStr=_viewTerm;
    } else if(_manualTerm){
      termStr=_manualTerm;
    } else if(minD){
      var p=minD.split('/'), y=+p[0], mo=+p[1];
      var ay=(mo>=8)?(y-1911):(y-1912);
      var sem=(mo>=8||mo===1)?'第1學期':'第2學期';
      termStr=ay+'學年度'+sem;
    }
    return {schools:schools, cats:cats, dateStr:dateStr, termStr:termStr};
  })();
  var cohortMetaParts=[];
  if(cohortInfo.schools.length) cohortMetaParts.push('實習學校：'+_cohEsc(cohortInfo.schools.join('、')));
  cohortMetaParts.push('實習日期：'+_cohEsc(cohortInfo.dateStr));
  if(cohortInfo.termStr) cohortMetaParts.push('學期：'+_cohEsc(cohortInfo.termStr));

  var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+_cohEsc(docTitle)+'</title><style>';
  h+='@page{size:A4 landscape;margin:1.2cm;} ';
  h+='body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Source Han Sans TC",sans-serif;color:#1A1612;margin:0;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact;} ';
  h+='*{-webkit-print-color-adjust:exact;print-color-adjust:exact;} ';
  h+='.header{text-align:center;border-bottom:2px solid #3F6212;padding-bottom:10px;margin-bottom:14px;} ';
  h+='.hosp{font-size:10pt;color:#3F6212;letter-spacing:1.5px;font-weight:600;} ';
  h+='.title{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Source Han Sans TC",sans-serif;font-size:18pt;font-weight:600;margin:6px 0 4px;letter-spacing:2px;} ';
  h+='.sub{font-size:9pt;color:#888;} ';
  h+='.sec{margin-top:14px;} .sec.brk{page-break-before:always;} .secpage.brk{page-break-before:always;} ';
  h+='.sec-h{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Source Han Sans TC",sans-serif;background:#3F6212;color:#fff;font-weight:600;padding:6px 12px;font-size:12pt;letter-spacing:1px;margin-bottom:8px;} ';
  h+='table{page-break-inside:auto;} tr{page-break-inside:avoid;} svg{page-break-inside:avoid;} ';
  h+='.cts-tight td,.cts-tight th{padding-top:2px!important;padding-bottom:2px!important;line-height:1.25;} .cts-tight .note,.cts-tight p{margin:2px 0!important;} ';
  h+='</style></head><body>';
  // 表頭產生器（可帶入各區標題，與單區匯出外觀一致）
  function _cohHeader(title){
    return '<div class="header"><div class="hosp">臺中榮民總醫院 胸腔部 呼吸治療科</div>'
         + '<div class="title">'+_cohEsc(title)+'</div>'
         + '<div class="sub" style="font-size:10pt;color:#374151;margin-bottom:3px;">'+cohortMetaParts.join('　·　')+'</div></div>';
  }
  var _footer='<div style="margin-top:16px;padding-top:5px;border-top:1px solid #E5E7EB;text-align:right;font-size:7.5pt;color:#9CA3AF;letter-spacing:.3px;">產製時間：'+_cohEsc(now)+(appVer?'　·　系統版本：'+_cohEsc(appVer):'')+'</div>';
  if(sectionId){
    // 單區匯出：表頭(大字區名) + 內容(不重複藍色區段標題) + 頁尾
    h+=_cohHeader(docTitle);
    h+='<div class="sec">'+secs[0].html+'</div>';
    h+=_footer;
  }else{
    // 整份匯出：排除①整體表單完成率；其餘每區「各自一頁」，外觀與單區匯出一致(每頁有自己的大字標題)
    var pageSecs=secs.filter(function(s){ return s.id!=='overview'; });
    pageSecs.forEach(function(sec,i){
      var clean=sec.title.replace(/^[①-⑩]\s*/,'').trim();
      h+='<div class="secpage'+(i>0?' brk':'')+'">'
        + _cohHeader('班級統整－'+clean)
        + '<div class="sec">'+sec.html+'</div>'
        + '</div>';
    });
    h+=_footer;
  }
  h+='</body></html>';
  // ── 另存檔名：學年度 學校-實習類別-標頭名稱（例：114學年度暑期實習 長庚科技大學(嘉義分部)-重症呼吸照護實習-Learning Style 四人總匯）──
  var _fnTitle = sectionId ? secs[0].title.replace(/^[①-⑩]\s*/,'').trim() : '班級學習統整報告';
  var _fnSchool = (cohortInfo.schools && cohortInfo.schools.length) ? cohortInfo.schools.join('、') : '';
  var _fnCat    = (cohortInfo.cats && cohortInfo.cats.length) ? cohortInfo.cats.join('、') : '';
  var _fnMid = [];
  if(_fnSchool) _fnMid.push(_fnSchool);
  if(_fnCat) _fnMid.push(_fnCat);
  _fnMid.push(_fnTitle);
  var _fnTerm = (cohortInfo.termStr||'').trim();
  var _pdfFileName = (_fnTerm ? _fnTerm+' ' : '') + _fnMid.join('-');
  // 移除 Windows/瀏覽器檔名不允許的字元
  _pdfFileName = _pdfFileName.replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim() || docTitle;
  var auto='<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){document.title='+JSON.stringify(_pdfFileName)+';window.print();},400);});</scr'+'ipt>';
  h=h.replace('</body>', auto+'</body>');
  var w=window.open('','_blank');
  if(!w){ toast('⚠ 瀏覽器阻擋了彈出視窗，請允許後再試'); return; }
  w.document.open(); w.document.write(h); w.document.close();
  toast('✓ 列印對話框即將開啟，請選擇「另存為 PDF」');
}

async function saveCohortTerm(){
  var el=document.getElementById('cohort-term-input');
  var v=el?(el.value||'').trim():'';
  APP.cohortTerm=v;
  APP.cohortTermAt=Date.now();
  try{
    localStorage.setItem('cohort_term', v);
    localStorage.setItem('cohort_term_at', String(APP.cohortTermAt));
  }catch(e){}

  // ★ FIX v19.2: 走專屬 setCohortTerm API,並用回傳值驗證伺服器真的寫進去了
  var res = await callBackend('setCohortTerm', {term: v});

/* ═══════════ DRAG & DROP 排序 ═══════════ */
var _dragSrc = null;

function dragStart(e){
  _dragSrc = e.currentTarget;
  e.currentTarget.style.opacity = '0.4';
  e.currentTarget.style.background = '#FFF8E8';
  if(e.dataTransfer){
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', e.currentTarget.dataset.idx); }catch(err){}
  }
}

function dragOver(e){
  if(e.preventDefault) e.preventDefault();
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  // 視覺提示
  var tgt = e.currentTarget;
  if(tgt && tgt !== _dragSrc){
    tgt.style.borderTop = '3px solid var(--gold)';
  }
  return false;
}

function dragLeave(e){
  if(e.currentTarget) e.currentTarget.style.borderTop = '';
}

function dragDrop(e){
  if(e.stopPropagation) e.stopPropagation();
  if(e.preventDefault) e.preventDefault();
  var tgt = e.currentTarget;
  if(!_dragSrc || _dragSrc === tgt) return false;
  var listType = _dragSrc.dataset.list;
  var srcIdx = _dragSrc.dataset.idx;
  var dstIdx = tgt.dataset.idx;
  if(listType === 'topics' || listType === 'speakers'){
    // 數字索引（陣列）
    var arr = (listType==='topics') ? APP.courseTopics : APP.courseSpeakers;
    var sI = parseInt(srcIdx), dI = parseInt(dstIdx);
    var moved = arr.splice(sI, 1)[0];
    arr.splice(dI, 0, moved);
    if(listType==='topics') refreshTopicList(); else refreshSpeakerList();
  } else if(listType === 'students'){
    // 字串 sid（順序陣列）
    if(!APP.studentOrder) getStudentOrder();
    var sIdx = APP.studentOrder.indexOf(srcIdx);
    var dIdx = APP.studentOrder.indexOf(dstIdx);
    if(sIdx >= 0 && dIdx >= 0){
      var s = APP.studentOrder.splice(sIdx, 1)[0];
      APP.studentOrder.splice(dIdx, 0, s);
      refreshStudentTable();
    }
  } else if(listType === 'teachers'){
    if(!APP.teacherOrder) getTeacherOrder();
    var sI2 = APP.teacherOrder.indexOf(srcIdx);
    var dI2 = APP.teacherOrder.indexOf(dstIdx);
    if(sI2 >= 0 && dI2 >= 0){
      var t = APP.teacherOrder.splice(sI2, 1)[0];
      APP.teacherOrder.splice(dI2, 0, t);
      refreshTeacherTable();
    }
  }
  saveConfigToSheets();
  return false;
}

function dragEnd(e){
  if(e.currentTarget){
    e.currentTarget.style.opacity = '';
    e.currentTarget.style.background = '';
  }
  // 清除所有拖曳邊框
  document.querySelectorAll('.drag-row').forEach(function(el){
    el.style.borderTop = '';
  });
  _dragSrc = null;
}

function connectGoogleSheets(){
  if (GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE.apps.googleusercontent.com') {
    updateGsStatus('warn', '⚠ 請先在程式碼中填入您的 Google OAuth Client ID');
    alert('尚未設定 Google Client ID。\n\n請照以下步驟：\n1. 前往 console.cloud.google.com\n2. 建立專案 → 啟用 Sheets API\n3. 建立 OAuth 憑證（網頁應用程式）→ 取得 Client ID\n4. 將 Client ID 貼入程式碼 GOOGLE_CLIENT_ID 變數\n5. 在「已授權的 JavaScript 來源」加入此頁面的網址');
    return;
  }
  updateGsStatus('info', '正在開啟 Google 授權…');
  if (!GS.tokenClient) {
    initGoogleAuth().then(() => { if (GS.tokenClient) GS.tokenClient.requestAccessToken(); });
  } else {
    GS.tokenClient.requestAccessToken();
  }
}

/* ★ FIX v19.4【學期同步】統一的學期寫入通道。
   一次呼叫 setStudentTerm 批次 API：後端會同時寫進 Students.term 與
   Config.studentTerms（時間戳由伺服器蓋章），並回讀驗證。
   舊版是「跑 N 次 updateStudent + 再存一次整包 config」，30 位學生 = 31 次
   整張表讀寫，中途逾時就只改到一半，而且會把可能過期的 config 推上去。
   參數 map: {sid: '學期字串'}，空字串＝清除指定（改回自動推算） */
async function pushTermsToServer(map){
  var sids=Object.keys(map||{});
  if(!sids.length) return {ok:true, updated:[]};
  var res=await callBackend('setStudentTerm', {terms: map});
  if(!res || !res.ok){
    // 舊版 GAS 沒有這支 API → 退回逐筆 updateStudent，功能不中斷
    var msg=(res&&res.error)||'';
    if(msg.indexOf('Unknown action')>=0){
      console.warn('[terms] 後端尚未支援 setStudentTerm，退回逐筆 updateStudent');
      for(var i=0;i<sids.length;i++){
        var acc=APP.students[sids[i]]; if(!acc) continue;
        try{ await callBackend('updateStudent', {sid:sids[i], name:acc.name, school:acc.school||'',
          term:map[sids[i]], intern_cat:acc.intern_cat||'', intern_start:acc.intern_start||'',
          intern_end:acc.intern_end||'', expiry:acc.expiry||''}); }catch(e){}
      }
      toast('⚠ 後端版本較舊（無 setStudentTerm），已用相容模式寫入。建議更新 GAS 至 v19.4。', false);
      return {ok:true, updated:sids, legacy:true};
    }
    toast('⚠ 學期未能寫入雲端：'+(msg||'未知錯誤')+'（僅暫存本機）', false);
    return {ok:false, error:msg};
  }
  // 伺服器回讀驗證的結果就是唯一真相 → 直接覆蓋本機
  if(res.verify && typeof res.verify==='object'){
    Object.keys(res.verify).forEach(function(sid){
      var v=String(res.verify[sid]||'');
      if(v==='(讀不到)') return;
      APP.studentTerms[sid]=v;
      if(APP.students[sid]) APP.students[sid].term=v;
    });
  }
  if(res.studentTermsAt) APP.studentTermsAt=+res.studentTermsAt||APP.studentTermsAt;
  _saveStudentTermsLocal(false);
  if(res.notFound && res.notFound.length){
    toast('⚠ 有 '+res.notFound.length+' 個學號在後端找不到：'+res.notFound.slice(0,3).join('、'), false);
  }
  return res;
}

   學期指定，全部寫進 Students 分頁的 term 欄（老師端/其他裝置才看得到）。 */
async function syncAllTermsToCloud(){

  h+='<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11.5px;">';
  h+='<tr style="background:var(--cream);"><th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--border2);">學期（梯次）</th>'
   + '<th style="padding:5px 8px;text-align:center;border-bottom:1px solid var(--border2);width:70px;">人數</th>'
   + '<th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--border2);width:34%;">人數分佈</th>'
   + '<th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--border2);">實習學校</th>'
   + '<th style="padding:5px 8px;text-align:left;border-bottom:1px solid var(--border2);">實習期間</th></tr>';
  groups.forEach(function(g){
    var schools=[], minD='', maxD='';
    g.sids.forEach(function(sid){
      var a=APP.students[sid]||{};
      var sc=(a.school||'').trim(); if(sc&&schools.indexOf(sc)<0) schools.push(sc);
      var st=_normalizeDateStr(a.intern_start||''), en=_normalizeDateStr(a.intern_end||'');
      if(st&&(!minD||st<minD)) minD=st;
      if(en&&(!maxD||en>maxD)) maxD=en;
    });
    var pct=Math.round(g.sids.length/(max||1)*100);
    var isUn=(g.term===TERM_UNASSIGNED);
    h+='<tr style="border-bottom:1px solid #F1F1EE;">'

async function applyDefaultExpiry(sid) {

/* 批次:把選取的學生「期限延長 N 天」(從今天起算)*/
async function batchExtendDays(days) {
  var sids = _batchGetSelectedSids();
  if (sids.length === 0) {
    toast('⚠ 請先勾選要批次處理的學生帳號');
    return;
  }
  var newExp = computeDefaultExpiry(days);
  var label = (days === 90) ? '90 天' : (days === 180 ? '180 天' : (days === 365 ? '1 年' : days + ' 天'));
  var preview = sids.slice(0, 5).map(function(s){
    return '  · ' + s + ' (' + (APP.students[s].name || '') + ')';
  }).join('\n');
  if (sids.length > 5) preview += '\n  ... 等共 ' + sids.length + ' 位';
  if (!confirm('將以下 ' + sids.length + ' 位學生的帳號期限,統一設為 ' + newExp + ' (今天 +' + label + '):\n\n' + preview + '\n\n是否確認?')) return;
  for (var i=0;i<sids.length;i++){
    var acc=APP.students[sids[i]]; if(!acc) continue;
    acc.expiry = newExp;
    await callBackend('updateStudent', {sid:sids[i], name:acc.name, school:acc.school||'', expiry:newExp});
  }
  refreshStudentTable();
  toast('✓ 已將 ' + sids.length + ' 位學生的期限延長至 ' + newExp);
}

/* ── 學生帳號修改 ── */
async function editStudent(sid) {
  const acc = APP.students[sid];
  if (!acc) return;
  const newSid = prompt('修改學號（目前：' + sid + '）\n⚠ 注意：修改學號後，學生需用新學號登入', sid);
  if (newSid === null) return;
  const trimmedSid = clipInput(newSid.trim(), MAX_SHORT_LENGTH);
  if (trimmedSid && trimmedSid !== sid) {
    if (!trimmedSid) { toast('⚠ 學號不可為空'); return; }
    if (!/^[A-Za-z0-9_-]+$/.test(trimmedSid)) { toast('⚠ 學號只能包含英數字底線減號'); return; }
    if (APP.students[trimmedSid]) { toast('⚠ 此學號「' + trimmedSid + '」已被使用'); return; }
  }
  const newName = prompt('修改姓名（目前：' + acc.name + '）', acc.name);
  if (newName === null) return;
  const newSchool = prompt('修改學校（目前：' + (acc.school||'') + '）', acc.school||'');
  if (newSchool === null) return;
  var curPwdHint = '（目前：已加密儲存，無法檢視）';
  const newPwd = prompt('修改密碼' + curPwdHint + '\n留空表示不變更；輸入新密碼將以加鹽雜湊儲存。', '');
  const cleanName = clipInput((newName||acc.name).trim(), MAX_NAME_LENGTH);
  const cleanSchool = clipInput((newSchool||acc.school||'').trim(), MAX_NAME_LENGTH);
  const cleanPwd = newPwd && newPwd.trim() ? clipInput(newPwd.trim(), MAX_SHORT_LENGTH) : null;

  // 【資安修補 v18.1】走後端 API
  const payload = {
    sid: sid,
    newSid: trimmedSid && trimmedSid !== sid ? trimmedSid : undefined,
    name: cleanName,
    school: cleanSchool
  };
  if(cleanPwd !== null) payload.newPwd = cleanPwd;
  const result = await callBackend('updateStudent', payload);
  if(!result.ok){ toast('⚠ '+(result.error||'修改失敗'),false); return; }

  // 後端成功 → 更新本地快取
  const targetSid = (trimmedSid && trimmedSid !== sid) ? trimmedSid : sid;
  if (targetSid !== sid) {
    APP.students[targetSid] = {
      name: cleanName, school: cleanSchool,
      pwd: cleanPwd !== null ? 'h2:(remote)' : acc.pwd,
      expiry: acc.expiry,
      selfRegistered: acc.selfRegistered,
      registeredAt: acc.registeredAt,
      intern_cat: acc.intern_cat||'',
      intern_start: acc.intern_start||'',
      intern_end: acc.intern_end||'',
      term: acc.term||''
    };
    delete APP.students[sid];
    // ★ v1.6 學期對照表也要跟著改學號，否則分組會遺失
    if (APP.studentTerms && APP.studentTerms[sid]) {
      APP.studentTerms[targetSid] = APP.studentTerms[sid];
      delete APP.studentTerms[sid];
      _saveStudentTermsLocal();
    }
    if (APP.studentOrder && APP.studentOrder.indexOf(sid) >= 0) {
      APP.studentOrder = APP.studentOrder.map(function(s){ return s === sid ? targetSid : s; });
    }
  } else {
    APP.students[sid].name = cleanName;
    APP.students[sid].school = cleanSchool;
    if (cleanPwd !== null) APP.students[sid].pwd = 'h2:(remote)';
  }
  refreshStudentTable();
  /* ★ FIX v19.4：學號變更時，後端會一併把 Forms 分頁的 formId 尾綴改名，
     並回傳 formsRenamed 筆數。舊版沒有這段，改完學號後該生所有表單會變成
     孤兒（formId 尾綴還是舊學號），學生登入會看到一片空白。 */
  if (targetSid !== sid) {
    var _fr = (result && typeof result.formsRenamed === 'number') ? result.formsRenamed : null;
    if (_fr === null) {
      toast('⚠ 學號已改，但後端未回報表單搬移結果。請確認 GAS 已更新到 v19.4，否則舊表單會失聯。', false);
    } else {
      toast('✓ 學生資料已更新（同時搬移 ' + _fr + ' 筆表單資料）');
    }
  } else {
    toast('✓ 學生資料已更新');
  }
}

/* ── 帳號期限檢查 ── */
function checkStudentExpiry(sid) {
  const acc = APP.students[sid];
  if (!acc || !acc.expiry) return true; // 無期限設定，可登入
  return new Date(acc.expiry) >= new Date();
}

/* ── 計算預設到期日(從今天起算 N 天後)──
   用於:管理員新增學生未填期限時、學生自助註冊時自動帶入 */
function computeDefaultExpiry(days) {
  days = days || 90;  // 預設 90 天
  var d = new Date();
  d.setDate(d.getDate() + days);
  // 格式化為 YYYY-MM-DD(date input 用)
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

    +    'style="padding:5px 10px;font-size:12px;border:1px solid var(--border);border-radius:999px;width:170px;">'
    +  '<button type="button" onclick="expandAllTermGroups(true)" style="padding:5px 10px;font-size:11px;background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--primary2);border-radius:6px;cursor:pointer;">全部展開</button>'
    +  '<button type="button" onclick="expandAllTermGroups(false)" style="padding:5px 10px;font-size:11px;background:#fff;border:1px solid var(--border);color:var(--ink3);border-radius:6px;cursor:pointer;">全部收合</button>'
    +'</div></div>';

  html+='<div style="font-size:11px;color:var(--ink3);margin:-4px 0 10px;">'
    +'共 '+order.length+' 位學生 · '+groups.length+' 個學期梯次　｜　點學期標題可展開／收合</div>';

  html+='<div id="term-groups">';
  groups.forEach(function(g,gi){
    // 預設：最新學期展開，其餘收合；老師手動調整過就依照記錄
    var isCollapsed;
    if(Object.prototype.hasOwnProperty.call(collapsed,g.term)) isCollapsed=!!collapsed[g.term];
    else isCollapsed=(groups.length>1) && (g.term!==newest);

    // 該學期的摘要資訊（學校 / 實習期間）
    var schools=[], minD='', maxD='';
    g.sids.forEach(function(sid){
      var a=APP.students[sid]||{};
      var sc=(a.school||'').trim();
      if(sc&&schools.indexOf(sc)<0) schools.push(sc);
      var st=_normalizeDateStr(a.intern_start||''), en=_normalizeDateStr(a.intern_end||'');
      if(st&&(!minD||st<minD)) minD=st;
      if(en&&(!maxD||en>maxD)) maxD=en;
    });
    var range=(minD&&maxD)?(minD+' ～ '+maxD):(minD||maxD||'');
    var metaBits=[];
    if(schools.length) metaBits.push(schools.join('、'));
    if(range) metaBits.push('實習期間 '+range);

    var isUn=(g.term===TERM_UNASSIGNED);
    var headBg=isUn?'#FFFBEB':'linear-gradient(135deg,var(--primary-soft) 0%,var(--paper) 100%)';
    var headBorder=isUn?'#FCD34D':'var(--primary-line)';
    var headColor=isUn?'#92400E':'var(--primary2)';

    html+='<div class="term-group" data-term="'+escapeAttr(g.term)+'" style="margin-bottom:12px;border:1px solid '+headBorder+';border-radius:var(--r2);overflow:hidden;">';
    html+='<div class="term-group-head" onclick="toggleTermGroup('+gi+')" '
      +'style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:'+headBg+';user-select:none;">'
      +'<span id="term-caret-'+gi+'" style="font-size:11px;color:'+headColor+';width:12px;display:inline-block;transition:transform .15s;">'+(isCollapsed?'▶':'▼')+'</span>'
      +'<span style="font-size:14px;font-weight:700;color:'+headColor+';">'+(isUn?'⚠ ':'🎓 ')+escapeHtml(g.term)+'</span>'
      +'<span style="font-size:11px;font-weight:700;background:'+(isUn?'#F59E0B':'var(--primary)')+';color:#fff;padding:1px 9px;border-radius:999px;">'+g.sids.length+' 位</span>'
      +(metaBits.length?'<span style="font-size:11px;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(metaBits.join('　·　'))+'</span>':'<span style="flex:1;"></span>')
      +'<span id="term-hint-'+gi+'" style="font-size:10px;color:var(--ink3);white-space:nowrap;">'+(isCollapsed?'點擊展開':'點擊收合')+'</span>'
      +'</div>';
    html+='<div class="term-group-body" id="term-body-'+gi+'" style="padding:12px;background:#fff;'+(isCollapsed?'display:none;':'')+'">';
    html+='<div class="form-grid">';
    g.sids.forEach(function(sid){
      var acc=APP.students[sid]||{};
      var hay=((acc.name||'')+' '+sid+' '+(acc.school||'')).toLowerCase();
      html+='<div class="form-card stu-card" data-hay="'+escapeAttr(hay)+'" onclick="selectStudent(\''+escapeAttr(sid)+'\')">'
        +'<div class="form-card-num" style="background:var(--blue);">👤</div>'
        +'<div class="form-card-name">'+escapeHtml(acc.name||sid)+'</div>'
        +'<div class="form-card-sub">'+escapeHtml(acc.school||'')+'　學號：'+escapeHtml(sid)+'</div>'
        +'<div class="form-card-meta"><span style="font-size:11px;color:var(--blue);">點擊查看學習護照</span></div>'
        +'</div>';
    });
    html+='</div></div></div>';
  });
  html+='</div>';
  return html;
}

/* 展開／收合單一學期群組 */
function toggleTermGroup(gi){
  var body=document.getElementById('term-body-'+gi);
  var caret=document.getElementById('term-caret-'+gi);
  var hint=document.getElementById('term-hint-'+gi);
  if(!body) return;
  var willCollapse=(body.style.display!=='none');
  body.style.display=willCollapse?'none':'';
  if(caret) caret.textContent=willCollapse?'▶':'▼';
  if(hint) hint.textContent=willCollapse?'點擊展開':'點擊收合';
  // 記住老師的選擇
  var wrap=body.closest ? body.closest('.term-group') : body.parentNode;
  var term=wrap?wrap.getAttribute('data-term'):'';
  if(term){
    var st=_termCollapseState();
    st[term]=willCollapse;
    _setTermCollapseState(st);
  }
}

/* 全部展開 / 全部收合 */
function expandAllTermGroups(expand){
  var st=_termCollapseState();
  document.querySelectorAll('.term-group').forEach(function(wrap,i){
    var idx=(wrap.querySelector('.term-group-body')||{}).id||'';
    idx=idx.replace('term-body-','');
    var body=document.getElementById('term-body-'+idx);
    var caret=document.getElementById('term-caret-'+idx);
    var hint=document.getElementById('term-hint-'+idx);
    if(body) body.style.display=expand?'':'none';
    if(caret) caret.textContent=expand?'▼':'▶';
    if(hint) hint.textContent=expand?'點擊收合':'點擊展開';
    var term=wrap.getAttribute('data-term');
    if(term) st[term]=!expand;
  });
  _setTermCollapseState(st);
}

/* 跨學期搜尋學生（有符合者自動展開該學期） */
function filterTeacherStudents(kw){
  kw=String(kw||'').trim().toLowerCase();
  document.querySelectorAll('.term-group').forEach(function(wrap){
    var body=wrap.querySelector('.term-group-body');
    var idx=(body&&body.id||'').replace('term-body-','');
    var caret=document.getElementById('term-caret-'+idx);
    var hint=document.getElementById('term-hint-'+idx);
    var hits=0;
    wrap.querySelectorAll('.stu-card').forEach(function(card){
      var match=!kw || (card.getAttribute('data-hay')||'').indexOf(kw)>=0;
      card.style.display=match?'':'none';
      if(match) hits++;
    });
    if(!kw){
      // 還原成使用者記錄的收合狀態
      var st=_termCollapseState();
      var term=wrap.getAttribute('data-term');
      var isCollapsed=Object.prototype.hasOwnProperty.call(st,term)?!!st[term]:(term!==latestTerm());
      wrap.style.display='';
      if(body) body.style.display=isCollapsed?'none':'';
      if(caret) caret.textContent=isCollapsed?'▶':'▼';
      if(hint) hint.textContent=isCollapsed?'點擊展開':'點擊收合';
    }else{
      wrap.style.display=hits?'':'none';
      if(body) body.style.display=hits?'':'none';
      if(caret) caret.textContent='▼';
      if(hint) hint.textContent='符合 '+hits+' 位';
    }
  });
}

function renderStatusSection(filterStatus){

  </div>`;
  if(filtered.length===0){
    html+=`<div style="text-align:center;padding:3rem;color:var(--ink3);">此分類目前沒有表單</div>`;
  } else {
    // 工具列（全部展開／收起）
    var VIEW_KEY='statusSection_'+filterStatus;
    html += '<div class="collapsible-toolbar">'
      + '<div style="font-size:12px;color:var(--ink3);">點擊群組標題即可展開／收起；系統會記住您的選擇</div>'
      + '<div class="collapsible-toolbar-actions">'
        + '<button class="collapsible-toolbar-btn" onclick="collGrpExpandAll(\''+VIEW_KEY+'\')">▼ 全部展開</button>'
        + '<button class="collapsible-toolbar-btn" onclick="collGrpCollapseAll(\''+VIEW_KEY+'\')">▲ 全部收起</button>'
      + '</div>'
    + '</div>';
    // 依分組依次渲染
    groups.forEach(function(g){
      // 此狀態下，本組裡的表單清單
      var inGroup=g.ids.filter(function(id){return getStatus(id)===filterStatus;});
      if(inGroup.length===0) return; // 此分組目前無此狀態表單，整組省略
      // 統計：本組總共多少 / 本組此狀態多少（讓使用者知道分組進度）
      var groupAllStats=_collGrpStats(g, function(id){return getStatus(id);});
      var isOpen=_collGrpIsOpen(VIEW_KEY, g.label, groupAllStats);
      // 預設未開的話，預設打開（清單頁本來就只看一種狀態，分組打開比較直觀）
      var savedKey=_collGrpRead(VIEW_KEY, g.label);
      if(savedKey===null) isOpen=true;
      html += '<div class="collapsible-group'+(isOpen?' is-open':'')+'" data-vk="'+VIEW_KEY+'" data-grp="'+VIEW_KEY+':'+g.label+'" data-label="'+g.label+'" data-default-open="1">';
      // 自訂 group head：標題、本組此狀態份數
      var chipColor=colorMap[filterStatus];
      var chipIcon=filterStatus==='done'?'✅':(filterStatus==='draft'?'✏️':'⭕');
      html += '<div class="collapsible-header" onclick="toggleCollGrp(this.parentElement.getAttribute(\'data-vk\'), this.parentElement.getAttribute(\'data-label\'))">'
        + '<span class="collapsible-caret">▶</span>'
        + '<span class="collapsible-title">'+escapeExamHtml(g.label)+'</span>'
        + '<span class="collapsible-summary">'
          + '<span class="collapsible-status-tags">'
            + '<span class="stag" style="background:'+chipColor+';color:#fff;">'+chipIcon+' '+inGroup.length+' / '+groupAllStats.total+'</span>'
          + '</span>'
        + '</span>'
      + '</div>';
      html += '<div class="collapsible-body"><div class="form-grid">';
      inGroup.forEach(function(id){
        var f=findForm(id); if(!f) return;
        var st=getStatus(id);
        var stLabel=st==='done'?'✅ 已完成':st==='draft'?'✏️ 草稿中（未完成）':'⭕ 未填寫';
        var stColor=st==='done'?'var(--green)':st==='draft'?'#0EA5E9':'var(--ink3)';
        var dlBtn=st==='done'
          ?`<button onclick="event.stopPropagation();checkAndDownloadPDF('${f.id}')" style="margin-top:8px;width:100%;padding:6px 0;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.3px;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">⬇ 下載 PDF</button>`
          :'';
        html+=`<div class="form-card" onclick="openForm('${f.id}')" style="display:flex;flex-direction:column;">
          <div class="form-card-name" style="margin-top:4px;">${f.name}</div>
          <div class="form-card-sub">${f.sub}</div>
          <div class="form-card-meta" style="flex:1;"><span style="font-size:11px;color:${stColor};font-weight:500;">${stLabel}</span></div>
          ${dlBtn}
        </div>`;
      });
      html+='</div></div></div>';
    });
  }
  html+='</div>';
  mc.innerHTML=html;
  // 點擊頂端狀態時，頁面永遠從最上方開始顯示
  try{ window.scrollTo({top:0, behavior:'auto'}); }catch(e){ window.scrollTo(0,0); }
}
/* ══ DEBUG 診斷工具 ══ */
window.debugStatus=function(id){
  if(!isDevMode()){ console.log('debug disabled'); return; }
  var formKey=getFormKey(id);
  var dById=APP.formData[id]||{};
  var dByKey=APP.formData[formKey]||{};
  var dFromDraft={};
  try{
    var allDrafts=JSON.parse(localStorage.getItem('form_drafts')||'{}');
    Object.keys(allDrafts).forEach(function(k){
      if(k===id||k===formKey) Object.assign(dFromDraft,allDrafts[k]);
    });
  }catch(e){}
  var d=Object.assign({},dFromDraft,dById,dByKey);

  var allLogs=[];var logSeen={};
  [formKey,id].forEach(function(k){(APP.historyLog[k]||[]).forEach(function(l){if(!logSeen[l.ts]){logSeen[l.ts]=true;allLogs.push(l);}});});
  try{var sl=JSON.parse(localStorage.getItem('history_logs')||'{}');[formKey,id].forEach(function(k){(sl[k]||[]).forEach(function(l){if(!logSeen[l.ts]){logSeen[l.ts]=true;allLogs.push(l);}});});}catch(e){}

  var req=(REQUIRED_STUDENT_FIELDS[id]||[]).slice();
  var f=findForm(id);
  if(f&&f.roles==='both'&&req.indexOf('t_sign')<0) req.push('t_sign');
  // 直接使用 REQUIRED_STUDENT_FIELDS，不再硬寫 override（原本的硬寫已過時）

  function hasRealVal(v){if(v===undefined||v===null||v===false)return false;var s=String(v).trim();if(s==='')return false;if(s==='[]'||s==='{}'||s==='null')return false;return true;}
  function checkField(k){
    var v=d[k];if(!hasRealVal(v))return false;
    if(k==='s_date'){var sv=String(v).trim();if(sv.indexOf(' - ')>=0){var pts=sv.split(' - ');return pts.length===2&&pts[0].trim().length>=8&&pts[1].trim().length>=8;}return sv.length>=8;}
    if(k==='t_sign'||k==='s_sign'){var sv2=String(v).trim();return sv2!==''&&sv2!=='請選擇學生'&&sv2!=='請選擇老師'&&sv2!=='請選擇臨床老師'&&sv2!=='請選擇實習總指導教師'&&sv2!=='請選擇指導老師';}
    if(k==='t_sign_date'||k==='s_sign_date')return String(v).trim().length>=8;
    return true;
  }

  console.group('🔍 診斷：'+id+' | formKey='+formKey);
  console.log('📁 APP.formData[id]:', JSON.stringify(dById));
  console.log('📁 APP.formData[formKey]:', JSON.stringify(dByKey));
  console.log('📁 localStorage draft:', JSON.stringify(dFromDraft));
  console.log('📝 historyLog 合計:', allLogs.length,'筆');
  if(allLogs.length>0) console.log('   最新:', allLogs[0].role, allLogs[0].ts);
  console.log('');
  console.log('必填欄位 ('+req.length+'個):');
  req.forEach(function(k){
    var ok=checkField(k);
    console.log(' '+(ok?'✅':'❌')+' ['+k+'] =',JSON.stringify(d[k]));
  });
  var allOk=req.every(function(k){return checkField(k);});
  console.log('');
  console.log('→ 必填全滿:',allOk,'| 有記錄:',allLogs.length>0);
  console.log('→ getStatus:',getStatus(id));
  console.groupEnd();
};
